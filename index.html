tex": "g=b\\times ROE", "terms": [{"s": {"t": "m", "v": "g"}, "d": "dividend (sustainable) growth rate"}, {"s": {"t": "m", "v": "b"}, "d": "earnings retention rate = 1 − dividend payout ratio"}, {"s": {"t": "m", "v": "ROE"}, "d": "return on equity"}], "note": null}, {"type": "formula", "name": "Required return implied by the Gordon model", "tex": "r=\\frac{D_1}{P_0}+g", "terms": [{"s": {"t": "t", "v": "D<sub>1</sub>/P<sub>0</sub>"}, "d": "expected dividend yield"}, {"s": {"t": "m", "v": "g"}, "d": "expected dividend (and price) growth rate"}, {"s": {"t": "m", "v": "P_{\\mathrm{0}}"}, "d": "current price, assumed equal to intrinsic value"}], "note": "Rearranges the Gordon model: required return = dividend yield + capital-gains (growth) yield."}, {"type": "formula", "name": "Terminal value (Gordon growth)", "tex": "V_n=\\frac{D_{n+1}}{r-g}", "terms": [{"s": {"t": "m", "v": "V_{\\mathrm{n}}"}, "d": "value at time n of dividends from n+1 onward"}, {"s": {"t": "m", "v": "D_{n+1}"}, "d": "first dividend of the constant-growth phase"}, {"s": {"t": "m", "v": "r"}, "d": "required return"}, {"s": {"t": "m", "v": "g"}, "d": "long-run constant growth rate"}], "note": null}, {"type": "formula", "name": "Two-stage dividend discount model", "tex": "V_0=\\sum_{t=1}^{n}\\frac{D_t}{(1+r)^{t}}+\\frac{V_n}{(1+r)^{n}}", "terms": [{"s": {"t": "m", "v": "D_{\\mathrm{t}}"}, "d": "dividends during the first (high-growth) stage"}, {"s": {"t": "m", "v": "V_{\\mathrm{n}}"}, "d": "terminal value at end of stage 1 (Gordon growth)"}, {"s": {"t": "m", "v": "r"}, "d": "required rate of return"}, {"s": {"t": "m", "v": "n"}, "d": "length of the first stage"}], "note": null}, {"type": "formula", "name": "First dividend of the stable phase", "tex": "D_{n+1}=D_0\\,(1+g_S)^{n}\\,(1+g_L)", "terms": [{"s": {"t": "m", "v": "D_{\\mathrm{0}}"}, "d": "current dividend"}, {"s": {"t": "m", "v": "g_{\\mathrm{S}}"}, "d": "short-term (stage 1) growth rate"}, {"s": {"t": "m", "v": "g_{\\mathrm{L}}"}, "d": "long-term (stable) growth rate"}, {"s": {"t": "m", "v": "n"}, "d": "number of years in the high-growth stage"}], "note": null}, {"type": "formula", "name": "Justified forward (leading) P/E", "tex": "\\frac{P_0}{E_1}=\\frac{D_1/E_1}{r-g}=\\frac{p}{r-g}", "terms": [{"s": {"t": "m", "v": "P_{\\mathrm{0}}"}, "d": "justified price today"}, {"s": {"t": "m", "v": "E_{\\mathrm{1}}"}, "d": "next year's forecast earnings per share"}, {"s": {"t": "m", "v": "p"}, "d": "dividend payout ratio = D₁ ÷ E₁"}, {"s": {"t": "m", "v": "r"}, "d": "required rate of return"}, {"s": {"t": "m", "v": "g"}, "d": "dividend growth rate"}], "note": "P/E is inversely related to r and positively related to g and the payout ratio."}, {"type": "formula", "name": "Price multiples (method of comparables)", "tex": "\\text{P/E}=\\frac{\\text{Price}}{EPS},\\quad \\text{P/B}=\\frac{\\text{Price}}{\\text{BVPS}},\\quad \\text{P/S}=\\frac{\\text{Price}}{\\text{Sales per share}},\\quad \\text{P/CF}=\\frac{\\text{Price}}{\\text{CF per share}}", "terms": [{"s": {"t": "m", "v": "EPS"}, "d": "earnings per share (trailing or forward)"}, {"s": {"t": "m", "v": "BVPS"}, "d": "book value of equity per share"}, {"s": {"t": "t", "v": "Sales per share"}, "d": "revenue per share"}, {"s": {"t": "t", "v": "CF per share"}, "d": "cash flow per share"}], "note": "Comparables rest on the law of one price: similar assets should trade at similar multiples."}, {"type": "formula", "name": "Enterprise value (EV)", "tex": "EV=\\text{MV of equity}+\\text{MV of debt}+\\text{MV of preferred}-\\text{Cash \\& short-term investments}", "terms": [{"s": {"t": "t", "v": "MV of equity"}, "d": "market capitalization"}, {"s": {"t": "t", "v": "MV of debt"}, "d": "market value of debt"}, {"s": {"t": "t", "v": "MV of preferred"}, "d": "market value of preferred stock"}, {"s": {"t": "t", "v": "Cash &amp; short-term investments"}, "d": "subtracted as they offset acquisition cost"}], "note": "EV multiples (e.g., EV/EBITDA) value the whole firm; Equity value = EV − Debt + Cash."}, {"type": "formula", "name": "Asset-based valuation", "tex": "\\text{Equity value}=\\text{Market value of assets}-\\text{Market value of liabilities}", "terms": [{"s": {"t": "t", "v": "Market value of assets"}, "d": "fair value of the firm's assets"}, {"s": {"t": "t", "v": "Market value of liabilities"}, "d": "fair value of the firm's liabilities"}], "note": "Values equity as the net fair value of assets less liabilities."}], "concepts": []}]}, {"id": "FSA", "name": "Financial Statement Analysis", "modules": [{"name": "Learning Module 2 — Analyzing Income Statements", "cards": [{"type": "formula", "name": "Basic EPS", "tex": "\\text{Basic EPS}=\\frac{\\text{Net income}-\\text{Preferred dividends}}{\\text{Weighted avg. shares outstanding}}", "terms": [{"s": {"t": "m", "v": "\\text{Net income}"}, "d": "net income for the period"}, {"s": {"t": "m", "v": "\\text{Preferred dividends}"}, "d": "dividends declared on preferred stock"}, {"s": {"t": "m", "v": "\\text{Weighted avg. shares}"}, "d": "shares weighted by fraction of the year outstanding"}], "note": "Only common shareholders' earnings are in the numerator."}, {"type": "formula", "name": "Weighted average shares outstanding", "tex": "\\text{WASO}=\\textstyle\\sum \\text{Shares}\\times\\frac{\\text{Months outstanding}}{12}", "terms": [{"s": {"t": "m", "v": "\\text{WASO}"}, "d": "weighted average shares outstanding"}, {"s": {"t": "m", "v": "\\text{Shares}"}, "d": "shares in each sub-period"}, {"s": {"t": "m", "v": "\\text{Months outstanding}"}, "d": "months the block was outstanding"}], "note": "Shares issued/repurchased mid-year are time-weighted; splits are applied retroactively."}, {"type": "formula", "name": "Diluted EPS", "tex": "\\text{Diluted EPS}=\\frac{(\\text{NI}-\\text{Pref. div.})+\\text{Conv. pref. div.}+\\text{Conv. debt int.}(1-t)}{\\text{WASO}+\\text{Dilutive potential common shares}}", "terms": [{"s": {"t": "m", "v": "\\text{NI}"}, "d": "net income"}, {"s": {"t": "m", "v": "\\text{Conv. pref. div.}"}, "d": "dividends on dilutive convertible preferred (added back)"}, {"s": {"t": "m", "v": "\\text{Conv. debt int.}(1-t)"}, "d": "after-tax interest on dilutive convertible debt (added back)"}, {"s": {"t": "m", "v": "t"}, "d": "tax rate"}, {"s": {"t": "m", "v": "\\text{Dilutive potential shares}"}, "d": "shares from convertibles + options (if dilutive)"}], "note": "Include a security only if it is dilutive (lowers EPS); ignore antidilutive ones."}, {"type": "formula", "name": "Treasury stock method — incremental shares", "tex": "\\Delta\\text{Shares}=N-\\frac{N\\times X}{\\bar{P}}", "terms": [{"s": {"t": "m", "v": "\\Delta\\text{Shares}"}, "d": "net new shares added to the denominator"}, {"s": {"t": "m", "v": "N"}, "d": "number of options/warrants outstanding"}, {"s": {"t": "m", "v": "X"}, "d": "exercise price"}, {"s": {"t": "m", "v": "\\bar{P}"}, "d": "average market price of the share over the period"}], "note": "Proceeds from exercise (N×X) are assumed to buy back shares at the average price."}, {"type": "formula", "name": "Gross profit margin", "tex": "\\text{Gross profit margin}=\\frac{\\text{Gross profit}}{\\text{Revenue}}", "terms": [{"s": {"t": "m", "v": "\\text{Gross profit}"}, "d": "revenue − cost of goods sold"}, {"s": {"t": "m", "v": "\\text{Revenue}"}, "d": "net sales"}], "note": null}, {"type": "formula", "name": "Operating profit margin", "tex": "\\text{Operating margin}=\\frac{\\text{Operating income (EBIT)}}{\\text{Revenue}}", "terms": [{"s": {"t": "m", "v": "\\text{Operating income}"}, "d": "earnings before interest and taxes"}, {"s": {"t": "m", "v": "\\text{Revenue}"}, "d": "net sales"}], "note": null}, {"type": "formula", "name": "Net profit margin", "tex": "\\text{Net profit margin}=\\frac{\\text{Net income}}{\\text{Revenue}}", "terms": [{"s": {"t": "m", "v": "\\text{Net income}"}, "d": "profit after all expenses and taxes"}, {"s": {"t": "m", "v": "\\text{Revenue}"}, "d": "net sales"}], "note": null}, {"type": "formula", "name": "Retained earnings roll-forward", "tex": "\\text{End. RE}=\\text{Beg. RE}+\\text{Net income}-\\text{Dividends}", "terms": [{"s": {"t": "m", "v": "\\text{End. RE}"}, "d": "ending retained earnings"}, {"s": {"t": "m", "v": "\\text{Beg. RE}"}, "d": "beginning retained earnings"}, {"s": {"t": "m", "v": "\\text{Net income}"}, "d": "net income for the period"}, {"s": {"t": "m", "v": "\\text{Dividends}"}, "d": "dividends declared"}], "note": null}], "concepts": [{"type": "concept", "name": "Revenue recognition core principle", "def": "Recognize revenue to depict the transfer of goods/services in the amount expected to be received — the five-step model (identify contract → recognize revenue).", "note": null}, {"type": "concept", "name": "Five-step revenue model", "def": "Identify the contract, identify performance obligations, determine the transaction price, allocate the price, and recognize revenue as obligations are satisfied.", "note": null}, {"type": "concept", "name": "Expense recognition (matching)", "def": "Expenses are matched to the revenues they help generate; period costs are expensed as incurred when no clear future benefit exists.", "note": null}, {"type": "concept", "name": "Gross vs. net revenue reporting", "def": "A principal reports gross revenue (controls the good/service); an agent reports only the net commission. Misclassification inflates revenue.", "note": null}, {"type": "concept", "name": "Operating vs. non-operating items", "def": "Operating items relate to core business; non-operating (e.g., investment income for a manufacturer) should be separated for analysis.", "note": null}, {"type": "concept", "name": "Basic vs. diluted EPS", "def": "Basic EPS uses actual weighted-average shares; diluted EPS assumes conversion of dilutive securities (options, convertibles), never anti-dilutive ones.", "note": null}, {"type": "concept", "name": "Common-size income statement", "def": "Expresses each line as a percentage of revenue, enabling comparison of cost structure and margins across firms and over time.", "note": null}, {"type": "concept", "name": "Earnings quality warning signs", "def": "Aggressive revenue timing, one-time gains in operating income, and rising receivables faster than sales suggest lower-quality earnings.", "note": null}]}, {"name": "Learning Module 3 — Analyzing Balance Sheets", "cards": [{"type": "formula", "name": "Current ratio", "tex": "\\text{Current ratio}=\\frac{\\text{Current assets}}{\\text{Current liabilities}}", "terms": [{"s": {"t": "m", "v": "\\text{Current assets}"}, "d": "assets expected to convert to cash within a year"}, {"s": {"t": "m", "v": "\\text{Current liabilities}"}, "d": "obligations due within a year"}], "note": "Higher indicates more short-term liquidity cushion."}, {"type": "formula", "name": "Quick ratio (acid test)", "tex": "\\text{Quick ratio}=\\frac{\\text{Cash}+\\text{Short-term inv.}+\\text{Receivables}}{\\text{Current liabilities}}", "terms": [{"s": {"t": "m", "v": "\\text{Cash}"}, "d": "cash and equivalents"}, {"s": {"t": "m", "v": "\\text{Short-term inv.}"}, "d": "marketable securities"}, {"s": {"t": "m", "v": "\\text{Receivables}"}, "d": "accounts receivable"}], "note": "Excludes inventory and prepaid expenses (less liquid)."}, {"type": "formula", "name": "Cash ratio", "tex": "\\text{Cash ratio}=\\frac{\\text{Cash}+\\text{Short-term investments}}{\\text{Current liabilities}}", "terms": [{"s": {"t": "m", "v": "\\text{Cash}"}, "d": "cash and equivalents"}, {"s": {"t": "m", "v": "\\text{Short-term investments}"}, "d": "marketable securities"}, {"s": {"t": "m", "v": "\\text{Current liabilities}"}, "d": "obligations due within a year"}], "note": "The most conservative liquidity measure."}, {"type": "formula", "name": "Total debt ratio (debt-to-assets)", "tex": "\\text{Debt-to-assets}=\\frac{\\text{Total debt}}{\\text{Total assets}}", "terms": [{"s": {"t": "m", "v": "\\text{Total debt}"}, "d": "interest-bearing short- and long-term debt"}, {"s": {"t": "m", "v": "\\text{Total assets}"}, "d": "total assets"}], "note": null}, {"type": "formula", "name": "Debt-to-equity ratio", "tex": "\\text{Debt-to-equity}=\\frac{\\text{Total debt}}{\\text{Total shareholders' equity}}", "terms": [{"s": {"t": "m", "v": "\\text{Total debt}"}, "d": "short- and long-term interest-bearing debt"}, {"s": {"t": "m", "v": "\\text{Total equity}"}, "d": "total shareholders' equity"}], "note": null}, {"type": "formula", "name": "Long-term debt-to-equity", "tex": "\\text{LT debt-to-equity}=\\frac{\\text{Long-term debt}}{\\text{Total shareholders' equity}}", "terms": [{"s": {"t": "m", "v": "\\text{Long-term debt}"}, "d": "debt due beyond one year"}, {"s": {"t": "m", "v": "\\text{Total equity}"}, "d": "total shareholders' equity"}], "note": null}, {"type": "formula", "name": "Financial leverage ratio", "tex": "\\text{Financial leverage}=\\frac{\\text{Average total assets}}{\\text{Average total equity}}", "terms": [{"s": {"t": "m", "v": "\\text{Average total assets}"}, "d": "average total assets"}, {"s": {"t": "m", "v": "\\text{Average total equity}"}, "d": "average shareholders' equity"}], "note": "Also the 'equity multiplier' in the DuPont decomposition."}, {"type": "formula", "name": "Common-size balance sheet", "tex": "\\text{Common-size item}=\\frac{\\text{Balance-sheet line item}}{\\text{Total assets}}", "terms": [{"s": {"t": "m", "v": "\\text{Line item}"}, "d": "any asset, liability, or equity item"}, {"s": {"t": "m", "v": "\\text{Total assets}"}, "d": "total assets"}], "note": "Expresses composition for comparison across firms and time."}], "concepts": [{"type": "concept", "name": "Measurement bases: cost vs. fair value", "def": "Some assets are carried at historical cost (adjusted), others at fair value; the mix affects comparability and how well the balance sheet reflects economic value.", "note": null}, {"type": "concept", "name": "Financial asset classifications", "def": "Amortized cost, fair value through OCI, and fair value through profit or loss — the classification drives where gains/losses appear.", "note": null}, {"type": "concept", "name": "Goodwill and intangibles", "def": "Goodwill arises in acquisitions (price over fair value of net assets), is not amortized but tested for impairment; internally generated goodwill isn't recognized.", "note": null}, {"type": "concept", "name": "Current vs. non-current classification", "def": "Assets/liabilities expected to be realized/settled within a year (or operating cycle) are current; this split underlies liquidity analysis.", "note": null}, {"type": "concept", "name": "Common-size balance sheet", "def": "Expresses each item as a percentage of total assets, revealing asset composition and capital structure for cross-company comparison.", "note": null}, {"type": "concept", "name": "Off-balance-sheet concerns", "def": "Some obligations (certain leases, guarantees) may understate leverage; analysts adjust to capture the true economic position.", "note": null}, {"type": "concept", "name": "Book value vs. market value of equity", "def": "Book equity is an accounting residual; it often differs from market value because of historical cost, unrecognized intangibles, and future prospects.", "note": null}]}, {"name": "Learning Module 4 — Analyzing Statements of Cash Flows I", "cards": [{"type": "formula", "name": "Operating cash flow — direct method", "tex": "\\text{CFO}=\\text{Cash from customers}-\\text{Cash to suppliers}-\\text{Cash to employees}-\\text{Interest}-\\text{Taxes}", "terms": [{"s": {"t": "m", "v": "\\text{Cash from customers}"}, "d": "cash actually collected from sales"}, {"s": {"t": "m", "v": "\\text{Cash to suppliers}"}, "d": "cash paid for inputs"}, {"s": {"t": "m", "v": "\\text{Interest},\\;\\text{Taxes}"}, "d": "cash interest and income taxes paid"}], "note": "Direct method lists actual operating cash receipts and payments."}, {"type": "formula", "name": "Cash received from customers", "tex": "\\text{Cash from customers}=\\text{Revenue}-\\Delta\\text{Accounts receivable}", "terms": [{"s": {"t": "m", "v": "\\text{Revenue}"}, "d": "sales for the period"}, {"s": {"t": "m", "v": "\\Delta\\text{Accounts receivable}"}, "d": "increase in receivables (subtract); decrease adds"}], "note": "A rise in receivables means less cash collected than revenue booked."}, {"type": "formula", "name": "Cash paid to suppliers", "tex": "\\text{Cash to suppliers}=\\text{COGS}+\\Delta\\text{Inventory}-\\Delta\\text{Accounts payable}", "terms": [{"s": {"t": "m", "v": "\\text{COGS}"}, "d": "cost of goods sold"}, {"s": {"t": "m", "v": "\\Delta\\text{Inventory}"}, "d": "increase in inventory (adds to cash paid)"}, {"s": {"t": "m", "v": "\\Delta\\text{Accounts payable}"}, "d": "increase in payables (reduces cash paid)"}], "note": null}, {"type": "formula", "name": "Operating cash flow — indirect method", "tex": "\\text{CFO}=\\text{NI}+\\text{Non-cash charges}-\\text{Gains}+\\text{Losses}-\\Delta\\text{WC (net op. assets)}", "terms": [{"s": {"t": "m", "v": "\\text{NI}"}, "d": "net income"}, {"s": {"t": "m", "v": "\\text{Non-cash charges}"}, "d": "depreciation, amortization, etc. (added back)"}, {"s": {"t": "m", "v": "\\text{Gains/Losses}"}, "d": "on investing/financing items, reversed out"}, {"s": {"t": "m", "v": "\\Delta\\text{WC}"}, "d": "increase in net operating working capital (subtract)"}], "note": "Start from net income and adjust for non-cash items and working-capital changes."}, {"type": "formula", "name": "Retained earnings and dividends", "tex": "\\text{Dividends}=\\text{Beg. RE}+\\text{Net income}-\\text{End. RE}", "terms": [{"s": {"t": "m", "v": "\\text{Beg. RE},\\;\\text{End. RE}"}, "d": "beginning and ending retained earnings"}, {"s": {"t": "m", "v": "\\text{Net income}"}, "d": "net income for the period"}], "note": "Used to infer dividends paid when not separately disclosed."}], "concepts": [{"type": "concept", "name": "Three sections of the cash flow statement", "def": "Operating (core business cash), investing (long-term assets), and financing (debt/equity and dividends) activities.", "note": null}, {"type": "concept", "name": "Direct vs. indirect method (CFO)", "def": "Direct lists actual cash receipts/payments; indirect starts from net income and adjusts for non-cash items and working-capital changes. Same CFO total.", "note": null}, {"type": "concept", "name": "Non-cash adjustments to net income", "def": "Add back depreciation/amortization and non-cash losses, subtract non-cash gains, to move from accrual net income toward operating cash flow.", "note": null}, {"type": "concept", "name": "Working-capital changes and CFO", "def": "An increase in operating assets (e.g., receivables, inventory) uses cash; an increase in operating liabilities (e.g., payables) provides cash.", "note": null}, {"type": "concept", "name": "IFRS vs. US GAAP interest/dividends", "def": "IFRS allows more flexibility in classifying interest and dividends among sections; US GAAP is more prescriptive — affects comparability of CFO.", "note": null}, {"type": "concept", "name": "Why CFO can differ from net income", "def": "Accruals, non-cash charges, and timing of cash collection/payment cause net income and operating cash flow to diverge — a key earnings-quality check.", "note": null}]}, {"name": "Learning Module 5 — Analyzing Statements of Cash Flows II", "cards": [{"type": "formula", "name": "Free cash flow to the firm (from NI)", "tex": "\\text{FCFF}=\\text{NI}+\\text{NCC}+\\text{Int}(1-t)-\\text{FCInv}-\\text{WCInv}", "terms": [{"s": {"t": "m", "v": "\\text{NI}"}, "d": "net income"}, {"s": {"t": "m", "v": "\\text{NCC}"}, "d": "non-cash charges (e.g., depreciation)"}, {"s": {"t": "m", "v": "\\text{Int}(1-t)"}, "d": "after-tax interest expense (added back)"}, {"s": {"t": "m", "v": "\\text{FCInv}"}, "d": "investment in fixed capital (capex)"}, {"s": {"t": "m", "v": "\\text{WCInv}"}, "d": "investment in working capital"}], "note": "Cash available to all capital providers (debt and equity)."}, {"type": "formula", "name": "Free cash flow to the firm (from CFO)", "tex": "\\text{FCFF}=\\text{CFO}+\\text{Int}(1-t)-\\text{FCInv}", "terms": [{"s": {"t": "m", "v": "\\text{CFO}"}, "d": "cash flow from operations"}, {"s": {"t": "m", "v": "\\text{Int}(1-t)"}, "d": "after-tax interest expense"}, {"s": {"t": "m", "v": "\\text{FCInv}"}, "d": "capital expenditures"}], "note": "Add back after-tax interest because CFO is after interest under US GAAP."}, {"type": "formula", "name": "Free cash flow to equity", "tex": "\\text{FCFE}=\\text{CFO}-\\text{FCInv}+\\text{Net borrowing}", "terms": [{"s": {"t": "m", "v": "\\text{CFO}"}, "d": "cash flow from operations"}, {"s": {"t": "m", "v": "\\text{FCInv}"}, "d": "capital expenditures"}, {"s": {"t": "m", "v": "\\text{Net borrowing}"}, "d": "new debt issued − debt repaid"}], "note": "Cash available to common shareholders after debt flows."}, {"type": "formula", "name": "Cash flow-to-revenue", "tex": "\\text{CF-to-revenue}=\\frac{\\text{CFO}}{\\text{Revenue}}", "terms": [{"s": {"t": "m", "v": "\\text{CFO}"}, "d": "cash flow from operations"}, {"s": {"t": "m", "v": "\\text{Revenue}"}, "d": "net sales"}], "note": "Operating cash generated per unit of sales."}, {"type": "formula", "name": "Cash return on assets", "tex": "\\text{Cash ROA}=\\frac{\\text{CFO}}{\\text{Average total assets}}", "terms": [{"s": {"t": "m", "v": "\\text{CFO}"}, "d": "cash flow from operations"}, {"s": {"t": "m", "v": "\\text{Average total assets}"}, "d": "average total assets"}], "note": null}, {"type": "formula", "name": "Cash return on equity", "tex": "\\text{Cash ROE}=\\frac{\\text{CFO}}{\\text{Average shareholders' equity}}", "terms": [{"s": {"t": "m", "v": "\\text{CFO}"}, "d": "cash flow from operations"}, {"s": {"t": "m", "v": "\\text{Average equity}"}, "d": "average shareholders' equity"}], "note": null}, {"type": "formula", "name": "Cash-to-income", "tex": "\\text{Cash-to-income}=\\frac{\\text{CFO}}{\\text{Operating income}}", "terms": [{"s": {"t": "m", "v": "\\text{CFO}"}, "d": "cash flow from operations"}, {"s": {"t": "m", "v": "\\text{Operating income}"}, "d": "operating income (EBIT)"}], "note": "Gauges the cash content of operating earnings (earnings quality)."}, {"type": "formula", "name": "Debt coverage", "tex": "\\text{Debt coverage}=\\frac{\\text{CFO}}{\\text{Total debt}}", "terms": [{"s": {"t": "m", "v": "\\text{CFO}"}, "d": "cash flow from operations"}, {"s": {"t": "m", "v": "\\text{Total debt}"}, "d": "total interest-bearing debt"}], "note": null}, {"type": "formula", "name": "Interest coverage (cash basis)", "tex": "\\text{Interest coverage}=\\frac{\\text{CFO}+\\text{Interest paid}+\\text{Taxes paid}}{\\text{Interest paid}}", "terms": [{"s": {"t": "m", "v": "\\text{CFO}"}, "d": "cash flow from operations"}, {"s": {"t": "m", "v": "\\text{Interest paid}"}, "d": "cash interest paid"}, {"s": {"t": "m", "v": "\\text{Taxes paid}"}, "d": "cash taxes paid"}], "note": "If interest paid is in CFO, add it back (with taxes) before dividing."}, {"type": "formula", "name": "Dividend payment / reinvestment", "tex": "\\text{Dividend coverage}=\\frac{\\text{CFO}}{\\text{Dividends paid}}", "terms": [{"s": {"t": "m", "v": "\\text{CFO}"}, "d": "cash flow from operations"}, {"s": {"t": "m", "v": "\\text{Dividends paid}"}, "d": "cash dividends paid"}], "note": "Measures ability to fund dividends from operating cash."}], "concepts": [{"type": "concept", "name": "Free cash flow to the firm (FCFF)", "def": "Cash available to all capital providers after operating needs and investment; FCFF = CFO + interest×(1−tax) − capex (from CFO).", "note": null}, {"type": "concept", "name": "Free cash flow to equity (FCFE)", "def": "Cash available to shareholders after debt payments; FCFE = CFO − capex + net borrowing.", "note": null}, {"type": "concept", "name": "Cash flow ratios: coverage", "def": "Ratios like CFO/total debt and CFO/interest gauge the ability to service obligations from operating cash rather than accounting earnings.", "note": null}, {"type": "concept", "name": "Cash flow ratios: performance", "def": "CFO/revenue (cash flow margin) and CFO per share indicate how efficiently sales convert to cash.", "note": null}, {"type": "concept", "name": "Common-size cash flow statement", "def": "Each inflow/outflow as a percentage of revenue (or total inflows), showing where cash is generated and used.", "note": null}, {"type": "concept", "name": "Sustainability of cash flows", "def": "High-quality firms fund investment and dividends from operating cash flow, not from continual borrowing or asset sales.", "note": null}]}, {"name": "Learning Module 6 — Analysis of Inventories", "cards": [{"type": "formula", "name": "Inventory turnover", "tex": "\\text{Inventory turnover}=\\frac{\\text{Cost of sales (COGS)}}{\\text{Average inventory}}", "terms": [{"s": {"t": "m", "v": "\\text{COGS}"}, "d": "cost of goods sold"}, {"s": {"t": "m", "v": "\\text{Average inventory}"}, "d": "(beginning + ending inventory) ÷ 2"}], "note": null}, {"type": "formula", "name": "Days of inventory on hand (DOH)", "tex": "\\text{DOH}=\\frac{\\text{Number of days in period}}{\\text{Inventory turnover}}", "terms": [{"s": {"t": "m", "v": "\\text{Days in period}"}, "d": "365 for a year"}, {"s": {"t": "m", "v": "\\text{Inventory turnover}"}, "d": "COGS ÷ average inventory"}], "note": null}, {"type": "formula", "name": "Ending inventory identity", "tex": "\\text{End. inv.}=\\text{Beg. inv.}+\\text{Purchases}-\\text{COGS}", "terms": [{"s": {"t": "m", "v": "\\text{Beg. inv.},\\;\\text{End. inv.}"}, "d": "beginning and ending inventory"}, {"s": {"t": "m", "v": "\\text{Purchases}"}, "d": "inventory purchased in the period"}, {"s": {"t": "m", "v": "\\text{COGS}"}, "d": "cost of goods sold"}], "note": null}, {"type": "formula", "name": "FIFO inventory from LIFO", "tex": "\\text{Inventory}_{\\text{FIFO}}=\\text{Inventory}_{\\text{LIFO}}+\\text{LIFO reserve}", "terms": [{"s": {"t": "m", "v": "\\text{Inventory}_{\\text{FIFO}}"}, "d": "inventory restated to FIFO"}, {"s": {"t": "m", "v": "\\text{Inventory}_{\\text{LIFO}}"}, "d": "reported LIFO inventory"}, {"s": {"t": "m", "v": "\\text{LIFO reserve}"}, "d": "disclosed FIFO − LIFO difference"}], "note": "Used to compare a LIFO reporter with FIFO peers."}, {"type": "formula", "name": "COGS FIFO from LIFO", "tex": "\\text{COGS}_{\\text{FIFO}}=\\text{COGS}_{\\text{LIFO}}-\\Delta\\text{LIFO reserve}", "terms": [{"s": {"t": "m", "v": "\\text{COGS}_{\\text{LIFO}}"}, "d": "reported LIFO cost of goods sold"}, {"s": {"t": "m", "v": "\\Delta\\text{LIFO reserve}"}, "d": "increase in the LIFO reserve during the year"}], "note": null}, {"type": "formula", "name": "Net income FIFO from LIFO", "tex": "\\text{NI}_{\\text{FIFO}}=\\text{NI}_{\\text{LIFO}}+\\Delta\\text{LIFO reserve}\\times(1-t)", "terms": [{"s": {"t": "m", "v": "\\text{NI}_{\\text{LIFO}}"}, "d": "reported LIFO net income"}, {"s": {"t": "m", "v": "\\Delta\\text{LIFO reserve}"}, "d": "increase in the LIFO reserve"}, {"s": {"t": "m", "v": "t"}, "d": "tax rate"}], "note": null}, {"type": "formula", "name": "Gross profit margin", "tex": "\\text{Gross profit margin}=\\frac{\\text{Gross profit}}{\\text{Sales}}", "terms": [{"s": {"t": "m", "v": "\\text{Gross profit}"}, "d": "sales − cost of goods sold"}, {"s": {"t": "m", "v": "\\text{Sales}"}, "d": "net revenue"}], "note": "FIFO generally raises gross margin in periods of rising prices."}, {"type": "formula", "name": "Net realizable value (IFRS write-down)", "tex": "\\text{NRV}=\\text{Selling price}-\\text{Costs to complete and sell}", "terms": [{"s": {"t": "m", "v": "\\text{Selling price}"}, "d": "estimated selling price in the ordinary course"}, {"s": {"t": "m", "v": "\\text{Costs to complete and sell}"}, "d": "remaining completion and selling costs"}], "note": "IFRS carries inventory at lower of cost and NRV; reversals allowed."}], "concepts": [{"type": "concept", "name": "Inventory cost flow methods", "def": "FIFO, LIFO (US GAAP only), and weighted average assign different costs to COGS and ending inventory, affecting income and balance sheet.", "note": null}, {"type": "concept", "name": "FIFO vs. LIFO in rising prices", "def": "With rising prices, FIFO gives lower COGS and higher income/inventory; LIFO gives higher COGS, lower income, and lower (older-cost) inventory.", "note": null}, {"type": "concept", "name": "LIFO reserve", "def": "The difference between FIFO and LIFO inventory; add it to LIFO inventory (and adjust COGS/equity) to compare a LIFO firm with FIFO peers.", "note": null}, {"type": "concept", "name": "Lower of cost and net realizable value", "def": "Under IFRS, inventory is written down to NRV if below cost, and can be reversed; US GAAP (for FIFO/avg) uses lower of cost or market with no reversal.", "note": null}, {"type": "concept", "name": "Inventory write-down effects", "def": "A write-down raises COGS, lowers gross margin, net income, and inventory — a signal of obsolescence or falling demand.", "note": null}, {"type": "concept", "name": "LIFO liquidation", "def": "When LIFO inventory quantities fall, old low costs flow to COGS, inflating margins temporarily — an unsustainable, low-quality boost.", "note": null}]}, {"name": "Learning Module 7 — Analysis of Long-Term Assets", "cards": [{"type": "formula", "name": "Net PP&E", "tex": "\\text{Net PP\\&E}=\\text{Gross PP\\&E}-\\text{Accumulated depreciation}", "terms": [{"s": {"t": "m", "v": "\\text{Gross PP\\&E}"}, "d": "historical cost of property, plant &amp; equipment"}, {"s": {"t": "m", "v": "\\text{Accumulated depreciation}"}, "d": "cumulative depreciation to date"}], "note": null}, {"type": "formula", "name": "Straight-line depreciation", "tex": "\\text{Dep.}=\\frac{\\text{Cost}-\\text{Residual value}}{\\text{Useful life}}", "terms": [{"s": {"t": "m", "v": "\\text{Cost}"}, "d": "acquisition cost"}, {"s": {"t": "m", "v": "\\text{Residual value}"}, "d": "estimated salvage value"}, {"s": {"t": "m", "v": "\\text{Useful life}"}, "d": "estimated years of service"}], "note": null}, {"type": "formula", "name": "Units-of-production depreciation", "tex": "\\text{Dep.}=(\\text{Cost}-\\text{Residual})\\times\\frac{\\text{Units this period}}{\\text{Total expected units}}", "terms": [{"s": {"t": "m", "v": "\\text{Cost}-\\text{Residual}"}, "d": "depreciable base"}, {"s": {"t": "m", "v": "\\text{Units this period}"}, "d": "output produced in the period"}, {"s": {"t": "m", "v": "\\text{Total expected units}"}, "d": "total lifetime output"}], "note": null}, {"type": "formula", "name": "Double-declining-balance depreciation", "tex": "\\text{Dep.}=\\frac{2}{\\text{Useful life}}\\times\\text{Beginning net book value}", "terms": [{"s": {"t": "m", "v": "\\text{Useful life}"}, "d": "estimated years of service"}, {"s": {"t": "m", "v": "\\text{Beginning NBV}"}, "d": "cost − accumulated depreciation at period start"}], "note": "An accelerated method; ignores residual value until NBV nears it."}, {"type": "formula", "name": "Estimated total useful life", "tex": "\\text{Total useful life}=\\frac{\\text{Gross PP\\&E}}{\\text{Annual depreciation expense}}", "terms": [{"s": {"t": "m", "v": "\\text{Gross PP\\&E}"}, "d": "historical cost of PP&amp;E"}, {"s": {"t": "m", "v": "\\text{Annual depreciation}"}, "d": "depreciation expense for the year"}], "note": null}, {"type": "formula", "name": "Estimated age (elapsed life)", "tex": "\\text{Age}=\\frac{\\text{Accumulated depreciation}}{\\text{Annual depreciation expense}}", "terms": [{"s": {"t": "m", "v": "\\text{Accumulated depreciation}"}, "d": "cumulative depreciation"}, {"s": {"t": "m", "v": "\\text{Annual depreciation}"}, "d": "depreciation expense for the year"}], "note": null}, {"type": "formula", "name": "Remaining useful life", "tex": "\\text{Remaining life}=\\frac{\\text{Net PP\\&E}}{\\text{Annual depreciation expense}}", "terms": [{"s": {"t": "m", "v": "\\text{Net PP\\&E}"}, "d": "gross PP&amp;E − accumulated depreciation"}, {"s": {"t": "m", "v": "\\text{Annual depreciation}"}, "d": "depreciation expense for the year"}], "note": null}, {"type": "formula", "name": "Impairment loss (IFRS)", "tex": "\\text{Impairment}=\\text{Carrying amount}-\\max(\\text{FV less costs to sell},\\;\\text{Value in use})", "terms": [{"s": {"t": "m", "v": "\\text{Carrying amount}"}, "d": "net book value before impairment"}, {"s": {"t": "m", "v": "\\text{FV less costs to sell}"}, "d": "fair value net of disposal costs"}, {"s": {"t": "m", "v": "\\text{Value in use}"}, "d": "PV of expected future cash flows"}], "note": "Recoverable amount is the higher of the two measures; IFRS allows reversals."}, {"type": "formula", "name": "Gain or loss on sale", "tex": "\\text{Gain/Loss}=\\text{Sale proceeds}-\\text{Carrying amount}", "terms": [{"s": {"t": "m", "v": "\\text{Sale proceeds}"}, "d": "cash received on disposal"}, {"s": {"t": "m", "v": "\\text{Carrying amount}"}, "d": "acquisition cost − accumulated depreciation"}], "note": null}, {"type": "formula", "name": "Fixed asset turnover", "tex": "\\text{Fixed asset turnover}=\\frac{\\text{Revenue}}{\\text{Average net fixed assets}}", "terms": [{"s": {"t": "m", "v": "\\text{Revenue}"}, "d": "net sales"}, {"s": {"t": "m", "v": "\\text{Average net fixed assets}"}, "d": "average net PP&amp;E"}], "note": "Higher turnover implies more efficient use of long-term assets."}], "concepts": [{"type": "concept", "name": "Capitalizing vs. expensing", "def": "Capitalizing spreads cost over future periods (higher early income, more assets); expensing hits income immediately. Choice affects trends and ratios.", "note": null}, {"type": "concept", "name": "Depreciation method effects", "def": "Straight-line spreads cost evenly; accelerated methods front-load expense, lowering early income and asset values, raising early ROA later.", "note": null}, {"type": "concept", "name": "Estimates in depreciation", "def": "Useful life and salvage value are estimates; longer lives or higher salvage lower annual depreciation and raise reported income.", "note": null}, {"type": "concept", "name": "Impairment of long-lived assets", "def": "When carrying value exceeds recoverable amount, an impairment loss is booked, reducing asset value and income; IFRS allows reversals, US GAAP generally does not.", "note": null}, {"type": "concept", "name": "Intangible assets: purchased vs. internal", "def": "Purchased intangibles are capitalized; most internally generated intangibles (R&amp;D under US GAAP) are expensed, understating asset value.", "note": null}, {"type": "concept", "name": "Revaluation model (IFRS)", "def": "IFRS permits carrying certain assets at fair value; US GAAP does not allow upward revaluation — a key comparability difference.", "note": null}, {"type": "concept", "name": "Investment property (IFRS)", "def": "May be measured at cost or fair value; fair value changes flow through profit or loss, unlike owner-occupied property.", "note": null}]}, {"name": "Learning Module 8 — Topics in Long-Term Liabilities and Equity", "cards": [{"type": "formula", "name": "Bond issue price", "tex": "P_0=\\textstyle\\sum_{t=1}^{N}\\frac{\\text{Coupon}}{(1+r)^t}+\\frac{\\text{Face}}{(1+r)^N}", "terms": [{"s": {"t": "m", "v": "P_{\\mathrm{0}}"}, "d": "issue price (carrying value at issuance)"}, {"s": {"t": "m", "v": "\\text{Coupon}"}, "d": "periodic coupon payment = coupon rate × face"}, {"s": {"t": "m", "v": "\\text{Face}"}, "d": "face (par) value"}, {"s": {"t": "m", "v": "r"}, "d": "market interest rate at issuance"}, {"s": {"t": "m", "v": "N"}, "d": "number of periods"}], "note": "Discount bond if coupon &lt; market rate; premium if coupon &gt; market rate."}, {"type": "formula", "name": "Effective interest expense", "tex": "\\text{Interest expense}_t=r\\times\\text{Carrying value}_{t-1}", "terms": [{"s": {"t": "m", "v": "r"}, "d": "market interest rate at issuance"}, {"s": {"t": "m", "v": "\\text{Carrying value}_{t-1}"}, "d": "bond carrying amount at the start of the period"}], "note": "Differs from the cash coupon; the gap amortizes the discount/premium."}, {"type": "formula", "name": "Bond carrying value roll-forward", "tex": "\\text{CV}_t=\\text{CV}_{t-1}+\\text{Interest expense}_t-\\text{Coupon}", "terms": [{"s": {"t": "m", "v": "\\text{CV}_t"}, "d": "ending carrying value"}, {"s": {"t": "m", "v": "\\text{CV}_{t-1}"}, "d": "beginning carrying value"}, {"s": {"t": "m", "v": "\\text{Interest expense}_t"}, "d": "effective interest for the period"}, {"s": {"t": "m", "v": "\\text{Coupon}"}, "d": "cash coupon paid"}], "note": "Discount bonds rise toward par; premium bonds fall toward par."}, {"type": "formula", "name": "Debt-to-capital", "tex": "\\text{Debt-to-capital}=\\frac{\\text{Total debt}}{\\text{Total debt}+\\text{Total equity}}", "terms": [{"s": {"t": "m", "v": "\\text{Total debt}"}, "d": "short- and long-term interest-bearing debt"}, {"s": {"t": "m", "v": "\\text{Total equity}"}, "d": "total shareholders' equity"}], "note": null}, {"type": "formula", "name": "Interest coverage ratio", "tex": "\\text{Interest coverage}=\\frac{\\text{EBIT}}{\\text{Interest payments}}", "terms": [{"s": {"t": "m", "v": "\\text{EBIT}"}, "d": "earnings before interest and taxes"}, {"s": {"t": "m", "v": "\\text{Interest payments}"}, "d": "interest expense for the period"}], "note": "Higher coverage means a larger cushion to service debt."}, {"type": "formula", "name": "Annual share-based compensation expense", "tex": "\\text{SBC expense}=\\frac{\\text{Grant-date fair value of award}}{\\text{Vesting period}}", "terms": [{"s": {"t": "m", "v": "\\text{Grant-date fair value}"}, "d": "total fair value of the equity award at grant"}, {"s": {"t": "m", "v": "\\text{Vesting period}"}, "d": "years over which the award vests"}], "note": "Expensed over the service (vesting) period."}, {"type": "formula", "name": "Lease liability (present value)", "tex": "\\text{Lease liability}=\\textstyle\\sum_{t=1}^{N}\\frac{\\text{Lease payment}_t}{(1+r)^t}", "terms": [{"s": {"t": "m", "v": "\\text{Lease payment}_t"}, "d": "periodic lease payment"}, {"s": {"t": "m", "v": "r"}, "d": "discount rate (implicit or incremental borrowing rate)"}, {"s": {"t": "m", "v": "N"}, "d": "number of lease payments"}], "note": "Both the right-of-use asset and lease liability are initially the PV of payments."}], "concepts": [{"type": "concept", "name": "Bond issued at premium/discount", "def": "A discount (coupon &lt; market rate) means carrying value rises to par over time; a premium (coupon &gt; market) means it falls to par. Interest expense uses the effective rate.", "note": null}, {"type": "concept", "name": "Effective interest method", "def": "Interest expense = beginning carrying value × market rate at issuance; it differs from the cash coupon, amortizing the discount/premium.", "note": null}, {"type": "concept", "name": "Finance vs. operating lease (lessee)", "def": "Under US GAAP, finance leases put an asset and liability on the books with interest + amortization; operating leases now also show a right-of-use asset but a single lease expense. IFRS treats nearly all leases as finance-type.", "note": null}, {"type": "concept", "name": "Deferred tax basics", "def": "Deferred tax liabilities/assets arise from temporary differences between accounting and tax treatment (e.g., depreciation), reversing over time.", "note": null}, {"type": "concept", "name": "Pension: DB vs. DC", "def": "In a defined-contribution plan the employer's obligation ends at the contribution; in a defined-benefit plan the employer bears investment and longevity risk.", "note": null}, {"type": "concept", "name": "Coverage and solvency ratios", "def": "Debt-to-equity, debt-to-capital, and interest coverage assess long-term solvency and the cushion for creditors.", "note": null}]}, {"name": "Learning Module 9 — Analysis of Income Taxes", "cards": [{"type": "formula", "name": "Income tax expense", "tex": "\\text{Tax expense}=\\text{Taxes payable}+\\Delta\\text{DTL}-\\Delta\\text{DTA}", "terms": [{"s": {"t": "m", "v": "\\text{Taxes payable}"}, "d": "current taxes owed to authorities"}, {"s": {"t": "m", "v": "\\Delta\\text{DTL}"}, "d": "increase in deferred tax liabilities"}, {"s": {"t": "m", "v": "\\Delta\\text{DTA}"}, "d": "increase in deferred tax assets"}], "note": "Accounting tax expense blends current taxes with changes in deferred items."}, {"type": "formula", "name": "Taxes payable (current)", "tex": "\\text{Taxes payable}=\\text{Taxable income}\\times\\text{Tax rate}", "terms": [{"s": {"t": "m", "v": "\\text{Taxable income}"}, "d": "income per the tax return"}, {"s": {"t": "m", "v": "\\text{Tax rate}"}, "d": "statutory tax rate"}], "note": null}, {"type": "formula", "name": "Deferred tax from a temporary difference", "tex": "\\text{DTL or DTA}=\\text{Temporary difference}\\times\\text{Tax rate}", "terms": [{"s": {"t": "m", "v": "\\text{Temporary difference}"}, "d": "carrying amount − tax base of an asset/liability"}, {"s": {"t": "m", "v": "\\text{Tax rate}"}, "d": "enacted (expected) future tax rate"}], "note": "Reverses over time; DTL when book &gt; tax income now, DTA when the reverse."}, {"type": "formula", "name": "Effective tax rate", "tex": "\\text{Effective tax rate}=\\frac{\\text{Income tax expense}}{\\text{Pretax income}}", "terms": [{"s": {"t": "m", "v": "\\text{Income tax expense}"}, "d": "total tax expense on the income statement"}, {"s": {"t": "m", "v": "\\text{Pretax income}"}, "d": "accounting profit before tax"}], "note": "Differs from the statutory rate due to permanent differences and credits."}, {"type": "formula", "name": "Deferred tax on depreciation difference", "tex": "\\text{Deferred tax}=(\\text{Carrying amount}-\\text{Tax base})\\times\\text{Tax rate}", "terms": [{"s": {"t": "m", "v": "\\text{Carrying amount}"}, "d": "asset's book value"}, {"s": {"t": "m", "v": "\\text{Tax base}"}, "d": "asset's value for tax purposes"}, {"s": {"t": "m", "v": "\\text{Tax rate}"}, "d": "enacted tax rate"}], "note": "Accelerated tax depreciation creates a deferred tax liability."}, {"type": "formula", "name": "Statutory tax reconciliation", "tex": "\\text{Statutory tax}=\\text{Pretax income}\\times\\text{Statutory rate}", "terms": [{"s": {"t": "m", "v": "\\text{Pretax income}"}, "d": "accounting profit before tax"}, {"s": {"t": "m", "v": "\\text{Statutory rate}"}, "d": "the legally enacted corporate tax rate"}], "note": "Permanent differences, foreign rates, and credits bridge statutory to effective."}], "concepts": [{"type": "concept", "name": "Accounting profit vs. taxable income", "def": "Accounting profit follows the standards; taxable income follows tax law. Differences create current and deferred tax effects.", "note": null}, {"type": "concept", "name": "Permanent vs. temporary differences", "def": "Permanent differences never reverse (affect the effective rate); temporary differences reverse over time and create deferred tax assets/liabilities.", "note": null}, {"type": "concept", "name": "Deferred tax liability source", "def": "Arises when taxable income is currently lower than accounting profit (e.g., accelerated tax depreciation); taxes are deferred to later periods.", "note": null}, {"type": "concept", "name": "Deferred tax asset source", "def": "Arises when taxes are paid earlier than expense is recognized in accounting (e.g., warranty accruals, tax-loss carryforwards).", "note": null}, {"type": "concept", "name": "Valuation allowance (US GAAP)", "def": "Reduces a deferred tax asset if it is more likely than not that some won't be realized; a rising allowance signals doubt about future profits.", "note": null}, {"type": "concept", "name": "Effective tax rate reconciliation", "def": "Explains why the effective rate differs from the statutory rate (permanent differences, foreign rates, credits) — useful for forecasting.", "note": null}]}, {"name": "Learning Module 11 — Financial Analysis Techniques", "cards": [{"type": "formula", "name": "Return on equity (ROE)", "tex": "\\text{ROE}=\\frac{\\text{Net income}}{\\text{Average shareholders' equity}}", "terms": [{"s": {"t": "m", "v": "\\text{Net income}"}, "d": "profit attributable to common shareholders"}, {"s": {"t": "m", "v": "\\text{Average equity}"}, "d": "average shareholders' equity"}], "note": null}, {"type": "formula", "name": "Return on assets (ROA)", "tex": "\\text{ROA}=\\frac{\\text{Net income}}{\\text{Average total assets}}", "terms": [{"s": {"t": "m", "v": "\\text{Net income}"}, "d": "net income for the period"}, {"s": {"t": "m", "v": "\\text{Average total assets}"}, "d": "average total assets"}], "note": null}, {"type": "formula", "name": "DuPont — two-way", "tex": "\\text{ROE}=\\text{ROA}\\times\\text{Financial leverage}", "terms": [{"s": {"t": "m", "v": "\\text{ROA}"}, "d": "net income ÷ average total assets"}, {"s": {"t": "m", "v": "\\text{Financial leverage}"}, "d": "average total assets ÷ average equity"}], "note": null}, {"type": "formula", "name": "DuPont — three-way", "tex": "\\text{ROE}=\\text{Net profit margin}\\times\\text{Total asset turnover}\\times\\text{Financial leverage}", "terms": [{"s": {"t": "m", "v": "\\text{Net profit margin}"}, "d": "net income ÷ revenue"}, {"s": {"t": "m", "v": "\\text{Total asset turnover}"}, "d": "revenue ÷ average total assets"}, {"s": {"t": "m", "v": "\\text{Financial leverage}"}, "d": "average total assets ÷ average equity"}], "note": "Splits ROE into profitability, efficiency, and leverage."}, {"type": "formula", "name": "DuPont — five-way", "tex": "\\text{ROE}=\\text{Tax burden}\\times\\text{Interest burden}\\times\\text{EBIT margin}\\times\\text{Asset turnover}\\times\\text{Leverage}", "terms": [{"s": {"t": "m", "v": "\\text{Tax burden}"}, "d": "net income ÷ EBT"}, {"s": {"t": "m", "v": "\\text{Interest burden}"}, "d": "EBT ÷ EBIT"}, {"s": {"t": "m", "v": "\\text{EBIT margin}"}, "d": "EBIT ÷ revenue"}, {"s": {"t": "m", "v": "\\text{Asset turnover}"}, "d": "revenue ÷ average total assets"}, {"s": {"t": "m", "v": "\\text{Leverage}"}, "d": "average total assets ÷ average equity"}], "note": null}, {"type": "formula", "name": "Receivables turnover & DSO", "tex": "\\text{Recv. turnover}=\\frac{\\text{Revenue}}{\\text{Avg. receivables}}\\;;\\;\\;\\text{DSO}=\\frac{365}{\\text{Recv. turnover}}", "terms": [{"s": {"t": "m", "v": "\\text{Revenue}"}, "d": "net credit sales"}, {"s": {"t": "m", "v": "\\text{Avg. receivables}"}, "d": "average accounts receivable"}, {"s": {"t": "m", "v": "\\text{DSO}"}, "d": "days sales outstanding"}], "note": null}, {"type": "formula", "name": "Inventory turnover & DOH", "tex": "\\text{Inv. turnover}=\\frac{\\text{COGS}}{\\text{Avg. inventory}}\\;;\\;\\;\\text{DOH}=\\frac{365}{\\text{Inv. turnover}}", "terms": [{"s": {"t": "m", "v": "\\text{COGS}"}, "d": "cost of goods sold"}, {"s": {"t": "m", "v": "\\text{Avg. inventory}"}, "d": "average inventory"}, {"s": {"t": "m", "v": "\\text{DOH}"}, "d": "days of inventory on hand"}], "note": null}, {"type": "formula", "name": "Payables turnover & DPO", "tex": "\\text{Pay. turnover}=\\frac{\\text{Purchases}}{\\text{Avg. payables}}\\;;\\;\\;\\text{DPO}=\\frac{365}{\\text{Pay. turnover}}", "terms": [{"s": {"t": "m", "v": "\\text{Purchases}"}, "d": "credit purchases from suppliers"}, {"s": {"t": "m", "v": "\\text{Avg. payables}"}, "d": "average accounts payable"}, {"s": {"t": "m", "v": "\\text{DPO}"}, "d": "days payables outstanding"}], "note": null}, {"type": "formula", "name": "Cash conversion cycle", "tex": "\\text{CCC}=\\text{DOH}+\\text{DSO}-\\text{DPO}", "terms": [{"s": {"t": "m", "v": "\\text{DOH}"}, "d": "days of inventory on hand"}, {"s": {"t": "m", "v": "\\text{DSO}"}, "d": "days sales outstanding"}, {"s": {"t": "m", "v": "\\text{DPO}"}, "d": "days payables outstanding"}], "note": "Shorter is better: less time cash is tied up in operations."}, {"type": "formula", "name": "Interest coverage", "tex": "\\text{Interest coverage}=\\frac{\\text{EBIT}}{\\text{Interest expense}}", "terms": [{"s": {"t": "m", "v": "\\text{EBIT}"}, "d": "earnings before interest and taxes"}, {"s": {"t": "m", "v": "\\text{Interest expense}"}, "d": "interest for the period"}], "note": null}], "concepts": [{"type": "concept", "name": "Purpose of ratio analysis", "def": "Ratios standardize data to assess profitability, liquidity, solvency, efficiency, and valuation, and to compare over time and across firms.", "note": null}, {"type": "concept", "name": "DuPont decomposition (3-part)", "def": "ROE = net profit margin × asset turnover × financial leverage; isolates whether returns come from profitability, efficiency, or leverage.", "note": null}, {"type": "concept", "name": "Five-part DuPont", "def": "Extends ROE into tax burden × interest burden × EBIT margin × asset turnover × leverage, separating operating and financing effects.", "note": null}, {"type": "concept", "name": "Liquidity ratios", "def": "Current, quick, and cash ratios measure the ability to meet short-term obligations; higher generally means more liquidity cushion.", "note": null}, {"type": "concept", "name": "Activity (efficiency) ratios", "def": "Inventory, receivables, and payables turnover (and days) measure how well the firm manages working capital and the cash conversion cycle.", "note": null}, {"type": "concept", "name": "Solvency ratios", "def": "Debt-to-equity, debt-to-assets, and coverage ratios assess long-term ability to meet obligations and financial risk.", "note": null}, {"type": "concept", "name": "Limitations of ratio analysis", "def": "Ratios need context: accounting differences, seasonality, and non-comparable peers can mislead; no single ratio is sufficient alone.", "note": null}, {"type": "concept", "name": "Segment and credit analysis uses", "def": "Ratios support business-segment evaluation, credit scoring, and screening; trends and peer benchmarks matter more than absolute levels.", "note": null}]}, {"name": "Learning Module 12 — Introduction to Financial Statement Modeling", "cards": [{"type": "formula", "name": "Forecasted revenue (growth)", "tex": "\\text{Revenue}_t=\\text{Revenue}_{t-1}\\times(1+g)", "terms": [{"s": {"t": "m", "v": "\\text{Revenue}_t"}, "d": "forecast revenue for the period"}, {"s": {"t": "m", "v": "\\text{Revenue}_{t-1}"}, "d": "prior-period revenue"}, {"s": {"t": "m", "v": "g"}, "d": "forecast revenue growth rate"}], "note": "Growth can be built from volume × price or market share × market size."}, {"type": "formula", "name": "Forecasted COGS from gross margin", "tex": "\\text{COGS}_t=\\text{Revenue}_t\\times(1-\\text{Gross margin})", "terms": [{"s": {"t": "m", "v": "\\text{Revenue}_t"}, "d": "forecast revenue"}, {"s": {"t": "m", "v": "\\text{Gross margin}"}, "d": "forecast gross profit margin"}], "note": null}, {"type": "formula", "name": "Forecasted gross profit", "tex": "\\text{Gross profit}_t=\\text{Revenue}_t-\\text{COGS}_t", "terms": [{"s": {"t": "m", "v": "\\text{Revenue}_t"}, "d": "forecast revenue"}, {"s": {"t": "m", "v": "\\text{COGS}_t"}, "d": "forecast cost of goods sold"}], "note": null}, {"type": "formula", "name": "Forecasted gross profit margin", "tex": "\\text{Gross margin}_t=\\frac{\\text{Gross profit}_t}{\\text{Revenue}_t}", "terms": [{"s": {"t": "m", "v": "\\text{Gross profit}_t"}, "d": "forecast gross profit"}, {"s": {"t": "m", "v": "\\text{Revenue}_t"}, "d": "forecast revenue"}], "note": null}, {"type": "formula", "name": "Operating margin", "tex": "\\text{Operating margin}=\\frac{\\text{Operating income}}{\\text{Revenue}}", "terms": [{"s": {"t": "m", "v": "\\text{Operating income}"}, "d": "forecast operating income (EBIT)"}, {"s": {"t": "m", "v": "\\text{Revenue}"}, "d": "forecast revenue"}], "note": "Operating leverage: margins expand as revenue grows over fixed costs."}, {"type": "formula", "name": "Retention ratio", "tex": "b=1-\\frac{\\text{Dividends}}{\\text{Net income}}", "terms": [{"s": {"t": "m", "v": "b"}, "d": "earnings retention (plowback) ratio"}, {"s": {"t": "m", "v": "\\text{Dividends}"}, "d": "dividends declared"}, {"s": {"t": "m", "v": "\\text{Net income}"}, "d": "net income"}], "note": null}, {"type": "formula", "name": "Sustainable growth rate", "tex": "g=b\\times\\text{ROE}", "terms": [{"s": {"t": "m", "v": "g"}, "d": "sustainable growth rate"}, {"s": {"t": "m", "v": "b"}, "d": "earnings retention ratio"}, {"s": {"t": "m", "v": "\\text{ROE}"}, "d": "return on equity"}], "note": "The growth achievable without issuing new equity, at constant leverage."}], "concepts": [{"type": "concept", "name": "Purpose of a financial model", "def": "To forecast future statements from driver assumptions (revenue growth, margins, capex) so analysts can value the firm and test scenarios.", "note": null}, {"type": "concept", "name": "Revenue build in a model", "def": "Revenue is projected from drivers — volume × price, market share × size, or growth rates — anchoring the rest of the model.", "note": null}, {"type": "concept", "name": "Linking the three statements", "def": "Income statement drives retained earnings; balance sheet and cash flow must tie out so cash and equity reconcile — a check on model integrity.", "note": null}, {"type": "concept", "name": "Behavioral biases in modeling", "def": "Overconfidence, anchoring, and illusion of control lead to overly precise or optimistic forecasts; scenario analysis mitigates them.", "note": null}, {"type": "concept", "name": "Competitive factors in forecasts", "def": "Porter's forces, pricing power, and the industry life-cycle stage discipline assumptions about future growth and margins.", "note": null}, {"type": "concept", "name": "Impact of inflation on models", "def": "Inflation affects revenue and costs unevenly; modeling pass-through and cost pressures avoids overstating real growth and margins.", "note": null}]}]}, {"id": "DE", "name": "Derivatives", "modules": [{"name": "Learning Module 1 — Derivative Instrument and Derivative Market Features", "cards": [], "concepts": [{"type": "concept", "name": "What a derivative is", "def": "A financial instrument whose value derives from the value of an underlying asset, rate, or index; it transfers risk without necessarily transferring the underlying.", "note": null}, {"type": "concept", "name": "Forward commitment vs. contingent claim", "def": "A forward commitment (forward, future, swap) obligates both parties to transact. A contingent claim (option) gives one party a right, exercised only if favorable.", "note": null}, {"type": "concept", "name": "Exchange-traded vs. OTC derivatives", "def": "Exchange-traded contracts are standardized, centrally cleared, and liquid. OTC contracts are customized and bilateral, with more flexibility but higher counterparty risk.", "note": null}, {"type": "concept", "name": "The underlying", "def": "The asset or reference (equity, bond, rate, currency, commodity, index, or even credit event) whose price drives the derivative's payoff.", "note": null}, {"type": "concept", "name": "Notional amount", "def": "The quantity of the underlying specified in the contract; payments are scaled to it even though the notional itself is usually not exchanged.", "note": null}, {"type": "concept", "name": "Central clearing and the clearinghouse", "def": "A central counterparty becomes buyer to every seller and seller to every buyer, guaranteeing performance and reducing counterparty risk via margin.", "note": null}, {"type": "concept", "name": "Initial vs. maintenance margin (futures)", "def": "Initial margin is posted to open a position; if the balance falls to the maintenance level, a margin call restores it to the initial level.", "note": null}, {"type": "concept", "name": "Settlement: physical vs. cash", "def": "Physical settlement delivers the underlying; cash settlement exchanges the net value difference. Many contracts are cash-settled for convenience.", "note": null}]}, {"name": "Learning Module 2 — Forward Commitment and Contingent Claim Features and Instruments", "cards": [{"type": "formula", "name": "Long forward — payoff and profit", "tex": "V_T(T)=S_T-F_0(T)", "terms": [{"s": {"t": "t", "v": "V<sub>T</sub>(T)"}, "d": "value (= profit) of the long forward at expiration"}, {"s": {"t": "m", "v": "S_{\\mathrm{T}}"}, "d": "spot price of the underlying at expiration"}, {"s": {"t": "t", "v": "F<sub>0</sub>(T)"}, "d": "forward price agreed at initiation"}], "note": "No cash is exchanged at inception, so payoff equals profit. Breakeven at S_T = F_0(T)."}, {"type": "formula", "name": "Short forward — payoff and profit", "tex": "V_T(T)=F_0(T)-S_T", "terms": [{"s": {"t": "t", "v": "V<sub>T</sub>(T)"}, "d": "value (= profit) of the short forward at expiration"}, {"s": {"t": "t", "v": "F<sub>0</sub>(T)"}, "d": "forward price agreed at initiation"}, {"s": {"t": "m", "v": "S_{\\mathrm{T}}"}, "d": "spot price at expiration"}], "note": "The short's profile is the mirror image of the long; symmetric (linear) payoff."}, {"type": "formula", "name": "Call option — payoff at expiration", "tex": "c_T=\\max(0,\\;S_T-X)", "terms": [{"s": {"t": "m", "v": "c_{\\mathrm{T}}"}, "d": "call payoff at expiration"}, {"s": {"t": "m", "v": "S_{\\mathrm{T}}"}, "d": "underlying price at expiration"}, {"s": {"t": "m", "v": "X"}, "d": "exercise (strike) price"}], "note": "Exercised only if S_T &gt; X; payoff is zero or positive (one-sided)."}, {"type": "formula", "name": "Put option — payoff at expiration", "tex": "p_T=\\max(0,\\;X-S_T)", "terms": [{"s": {"t": "m", "v": "p_{\\mathrm{T}}"}, "d": "put payoff at expiration"}, {"s": {"t": "m", "v": "X"}, "d": "exercise (strike) price"}, {"s": {"t": "m", "v": "S_{\\mathrm{T}}"}, "d": "underlying price at expiration"}], "note": "Exercised only if S_T &lt; X. Maximum payoff is X (when S_T = 0)."}, {"type": "formula", "name": "Long call — profit", "tex": "\\Pi=\\max(0,\\;S_T-X)-c_0", "terms": [{"s": {"t": "m", "v": "\\Pi"}, "d": "profit to the call buyer"}, {"s": {"t": "m", "v": "X"}, "d": "exercise price"}, {"s": {"t": "m", "v": "S_{\\mathrm{T}}"}, "d": "underlying price at expiration"}, {"s": {"t": "m", "v": "c_{\\mathrm{0}}"}, "d": "call premium paid at t = 0"}], "note": "Max loss = c_0 (p type": "concept", "name": "Benefits of derivatives", "def": "They allow risk transfer/hedging, price discovery, lower transaction costs, efficient use of capital (leverage), and access to otherwise hard-to-trade exposures.", "note": null}, {"type": "concept", "name": "Risks of derivatives", "def": "Leverage magnifies losses; they carry counterparty (OTC), liquidity, and basis risk, and complexity can obscure true exposure.", "note": null}, {"type": "concept", "name": "Hedging vs. speculation", "def": "Hedgers use derivatives to reduce an existing exposure; speculators take on exposure to profit from a view. Both add liquidity to markets.", "note": null}, {"type": "concept", "name": "Implicit leverage", "def": "A small margin or premium controls a large notional, so returns and losses are amplified relative to the cash outlay.", "note": null}, {"type": "concept", "name": "Issuer vs. investor uses", "def": "Issuers use derivatives to manage funding, rate, and currency risk on liabilities; investors use them to adjust portfolio exposures efficiently.", "note": null}, {"type": "concept", "name": "Counterparty credit risk", "def": "The risk the other side of an OTC contract fails to perform; mitigated by central clearing, collateral, and netting agreements.", "note": null}, {"type": "concept", "name": "Basis risk", "def": "The risk that the hedge instrument and the exposure do not move together perfectly, leaving residual gain or loss.", "note": null}]}, {"name": "Learning Module 4 — Arbitrage, Replication, and the Cost of Carry", "cards": [{"type": "formula", "name": "Future value (discrete and continuous)", "tex": "FV=PV(1+r)^N\\quad;\\quad FV=PV\\,e^{rT}", "terms": [{"s": {"t": "m", "v": "FV"}, "d": "future value at horizon"}, {"s": {"t": "m", "v": "PV"}, "d": "present value today"}, {"s": {"t": "m", "v": "r"}, "d": "risk-free rate (periodic or continuous)"}, {"s": {"t": "m", "v": "N,\\;T"}, "d": "number of periods / time in years"}], "note": "Compounding the spot at inus benefits (income, dividends, convenience yield).", "note": null}, {"type": "concept", "name": "Carry benefits lower the forward price", "def": "Income or convenience yield on the underlying reduces the no-arbitrage forward price; carry costs raise it.", "note": null}, {"type": "concept", "name": "Why the risk-free rate is used", "def": "A fully hedged (replicating) position bears no risk, so no-arbitrage pricing discounts at the risk-free rate regardless of risk preferences.", "note": null}, {"type": "concept", "name": "Convenience yield", "def": "The non-monetary benefit of physically holding a commodity (e.g., avoiding stockouts); it behaves like a carry benefit and lowers the forward price.", "note": null}]}, {"name": "Learning Module 5 — Pricing and Valuation of Forward Contracts", "cards": [{"type": "formula", "name": "Value at initiation", "tex": "V_0(T)=0", "terms": [{"s": {"t": "t", "v": "V<sub>0</sub>(T)"}, "d": "value of the forward when struck"}], "note": "The forward price is set so neither party pays the other at inception."}, {"type": "formula", "name": "Value at expiration (long)", "tex": "V_T(T)=S_T-F_0(T)", "terms": [{"s": {"t": "t", "v": "V<sub>T</sub>(T)"}, "d": "value of the long forward at expiration"}, {"s": {"t": "m", "v": "S_{\\mathrm{T}}"}, "d": "spot price at expiration"}, {"s": {"t": "t", "v": "F<sub>0</sub>(T)"}, "d": "forward price at initiation"}], "note": "The short is the mirror image, F_0(T) − S_T."}, {"type": "formula", "name": "Forward price (no carry)", "tex": "F_0(T)=S_0(1+r)^T", "terms": [{"s": {"t": "t", "v": "F<sub>0</sub>(T)"}, "d": "forward price"}, {"s": {"t": "m", "v": "S_{\\mathrm{0}}"}, "d": "spot price today"}, {"s": {"t": "m", "v": "r"}, "d": "risk-free rate"}, {"s": {"t": "m", "v": "T"}, "d": "time to expiration"}], "note": null}, {"type": "formula", "name": "Value during life — no carry", "tex": "V_t(T)=S_t-F_0(T)(1+r)^{-(T-t)}", "terms": [{"s": {"t": "t", "v": "V<sub>t</sub>(T)"}, "d": "mark-to-market value of ard is worth spot minus the contract price (S_T − F_0); the short is worth the mirror image.", "note": null}, {"type": "concept", "name": "Effect of carry on forward value", "def": "Income on the underlying accrues to the holder of the asset, not the long forward, which is why benefits reduce the forward price.", "note": null}, {"type": "concept", "name": "Marking a forward to market", "def": "Between inception and expiry, value equals the present value of the difference between the current and original forward prices.", "note": null}]}, {"name": "Learning Module 6 — Pricing and Valuation of Futures Contracts", "cards": [{"type": "formula", "name": "Value at initiation", "tex": "V_0(T)=0", "terms": [{"s": {"t": "t", "v": "V<sub>0</sub>(T)"}, "d": "value of the futures at inception"}], "note": "Daily settlement resets value to zero after each day's mark-to-market."}, {"type": "formula", "name": "Futures price — no carry", "tex": "f_0(T)=S_0(1+r)^T\\quad;\\quad f_0(T)=S_0\\,e^{rT}", "terms": [{"s": {"t": "t", "v": "f<sub>0</sub>(T)"}, "d": "futures price today"}, {"s": {"t": "m", "v": "S_{\\mathrm{0}}"}, "d": "spot price today"}, {"s": {"t": "m", "v": "r"}, "d": "risk-free rate"}, {"s": {"t": "m", "v": "T"}, "d": "time to expiration"}], "note": null}, {"type": "formula", "name": "Futures price — with carry", "tex": "f_0(T)=\\big[S_0-PV_0(I)+PV_0(C)\\big](1+r)^T", "terms": [{"s": {"t": "t", "v": "f<sub>0</sub>(T)"}, "d": "futures price today"}, {"s": {"t": "m", "v": "S_{\\mathrm{0}}"}, "d": "spot price today"}, {"s": {"t": "t", "v": "PV<sub>0</sub>(I)"}, "d": "PV of income/benefits"}, {"s": {"t": "t", "v": "PV<sub>0</sub>(C)"}, "d": "PV of carrying costs"}, {"s": {"t": "m", "v": "r"}, "d": "risk-free rate"}, {"s": {"t": "m", "v": "T"}, "d": "time to expiration"}], "note": null}, {"type": "formula", "name": "Mark-to-market value between settlements", "tex": "V_t(T)=S_t-F_0(T)(1+r)^{-(T-t)}", "terms": [{"s": {"t": "t", "v": "V<sub>t</sub>(T)"}, "d": "value accrued since n firm assets; risky debt = risk-free debt − a put."}], "concepts": [{"type": "concept", "name": "Protective put", "def": "Long the underlying plus a long put; it floors downside at the strike while keeping upside, replicating a fiduciary call's payoff.", "note": null}, {"type": "concept", "name": "Fiduciary call", "def": "Long a call plus a risk-free bond equal to the PV of the strike; guarantees at least the strike and shares the call's upside.", "note": null}, {"type": "concept", "name": "Put–call parity intuition", "def": "Protective put and fiduciary call have identical payoffs, so they must cost the same: S + p = c + PV(X).", "note": null}, {"type": "concept", "name": "Building synthetics", "def": "Rearranging parity creates any instrument from the others — e.g., a synthetic call = underlying + put − PV(strike).", "note": null}, {"type": "concept", "name": "Detecting mispricing", "def": "If parity does not hold, an arbitrageur buys the cheaper side and sells the richer side to lock in a riskless profit.", "note": null}, {"type": "concept", "name": "Put–call–forward parity", "def": "Replaces the underlying with the present value of the forward price, useful when the underlying is hard to hold or pays income.", "note": null}]}, {"name": "Learning Module 10 — Valuing a Derivative Using a One-Period Binomial Model", "cards": [{"type": "formula", "name": "Up and down gross returns", "tex": "R_u=\\frac{S_1^{u}}{S_0}\\;;\\;\\;R_d=\\frac{S_1^{d}}{S_0}", "terms": [{"s": {"t": "m", "v": "R_{\\mathrm{u}}"}, "d": "up-move gross return (&gt; 1)"}, {"s": {"t": "m", "v": "R_{\\mathrm{d}}"}, "d": "down-move gross return (&lt; 1)"}, {"s": {"t": "m", "v": "S_1^{u},\\;S_1^{d}"}, "d": "underlying price in the up / down state"}, {"s": {"t": "m", "v": "S_{\\mathrm{0}}"}, "d": "underlying price today"}], "note": null}, {"type": "formula", "name": "Node option payoffs", "tex": "c_1^{u}=\\max(0,S_1^{u}-X)\\;;\\;\\;c_1^{d}=\\max(0,S_1^{d}-X)", "terms": [{"s": {"t": "m", "v": "c_1^{u},\\;c_1^{d}"}, "d": "call value in the up / down state at t = 1"}, {"s": {"t": "m", "v": "S_1^{u},\\;S_1^{d}"}, "d": "underlying price at each node"}, {"s": {"t": "m", "v": "X"}, "d": "exercise price"}], "note": "For a put, use max(0, X − S_1) at each node."}, {"type": "formula", "name": "Hedge ratio (delta)", "tex": "h^{*}=\\frac{c_1^{u}-c_1^{d}}{S_1^{u}-S_1^{d}}", "terms": [{"s": {"t": "m", "v": "h^{*}"}, "d": "units of underlying that replicate/hedge one option"}, {"s": {"t": "m", "v": "c_1^{u},\\;c_1^{d}"}, "d": "option payoffs in the up/down states"}, {"s": {"t": "m", "v": "S_1^{u},\\;S_1^{d}"}, "d": "underlying prices in the up/down states"}], "note": "Positive for calls; negative for puts."}, {"type": "formula", "name": "Replicating portfolio value", "tex": "V_0=h S_0-c_0\\;;\\;\\;V_1=h S_1-c_1", "terms": [{"s": {"t": "m", "v": "V_0,\\;V_1"}, "d": "portfolio value now and at t = 1"}, {"s": {"t": "m", "v": "h"}, "d": "hedge ratio (units of underlying)"}, {"s": {"t": "m", "v": "S_0,\\;S_1"}, "d": "underlying price now / at t = 1"}, {"s": {"t": "m", "v": "c_0,\\;c_1"}, "d": "option value now / at t = 1"}], "note": "h is chosen so V_1 is identical in the up and down states (riskless)."}, {"type": "formula", "name": "Risk-free growth of the hedged portfolio", "tex": "V_1=V_0(1+r)", "terms": [{"s": {"t": "m", "v": "V_{\\mathrm{1}}"}, "d": "hedged portfolio value at t = 1 (same in both states)"}, {"s": {"t": "m", "v": "V_{\\mathrm{0}}"}, "d": "portfolio value today"}, {"s": {"t": "m", "v": "r"}, "d": "one-period risk-free rate"}], "note": "A riskless portfolio must earn the risk-free rate — the no-arbitrage anchor."}, {"type": "formula", "name": "Option value by replication", "tex": "c_0=h^{*}S_0-V_1(1+r)^{-1}", "terms": [{"s": {"t": "m", "v": "c_{\\mathrm{0}}"}, "d": "option value today"}, {"s": {"t": "m", "v": "h^{*}"}, "d": "hedge ratio"}, {"s": {"t": "m", "v": "S_{\\mathrm{0}}"}, "d": "underlying price today"}, {"s": {"t": "m", "v": "V_{\\mathrm{1}}"}, "d": "certa e": null}, {"type": "concept", "name": "No-arbitrage foundation", "def": "Because a riskless hedged portfolio must earn the risk-free rate, only one option value avoids arbitrage.", "note": null}, {"type": "concept", "name": "Real-world probabilities are irrelevant", "def": "The actual probability of an up move does not affect the option value, because it is already embedded in the underlying's current price.", "note": null}]}]}, {"id": "CI", "name": "Corporate Issuers", "modules": [{"name": "Learning Module 1 — Organizational Forms, Corporate Issuer Features, and Ownership", "cards": [], "concepts": [{"type": "concept", "name": "Sole proprietorship vs. partnership vs. corporation", "def": "Owners' liability and access to capital differ: proprietorships/partnerships have unlimited liability and limited capital; corporations offer limited liability and broad access to capital.", "note": null}, {"type": "concept", "name": "Limited liability of a corporation", "def": "Shareholders can lose only what they invested; the corporation is a separate legal person that owns assets and owes debts.", "note": null}, {"type": "concept", "name": "Separation of ownership and control", "def": "Shareholders (owners) delegate day-to-day control to managers, creating the potential principal–agent conflict.", "note": null}, {"type": "concept", "name": "Public vs. private company", "def": "Public companies have shares traded on exchanges with disclosure requirements and liquidity; private companies are illiquid with fewer disclosures.", "note": null}, {"type": "concept", "name": "Debt vs. equity claims", "def": "Debtholders have a fixed, senior, contractual claim; equity holders have a residual, junior claim with unlimited upside.", "note": null}, {"type": "concept", "name": "Financial vs. non-financial stakeholders", "def": "Beyond shareholders and creditors, stakeholders include employees, customers, suppliers, and governments — each with different interests.", "note": null}, {"type": " nd other stakeholders.", "note": null}, {"type": "concept", "name": "Governance mechanisms", "def": "Boards, independent directors, audits, shareholder voting, and market discipline (takeovers) align managers with owners.", "note": null}, {"type": "concept", "name": "Weak governance risks", "def": "Poor oversight can lead to value-destroying decisions, fraud, and expropriation of minority shareholders.", "note": null}, {"type": "concept", "name": "Benefits of strong governance", "def": "Lower cost of capital, better operating performance, reduced risk of scandal, and improved stakeholder trust.", "note": null}, {"type": "concept", "name": "Board independence", "def": "Independent directors, free of management ties, improve objective monitoring and reduce agency costs.", "note": null}, {"type": "concept", "name": "Say-on-pay and voting rights", "def": "Shareholder votes on compensation and key decisions are governance tools to hold management accountable.", "note": null}]}, {"name": "Learning Module 4 — Working Capital and Liquidity", "cards": [{"type": "formula", "name": "Current ratio", "tex": "\\text{Current ratio}=\\frac{\\text{Current assets}}{\\text{Current liabilities}}", "terms": [{"s": {"t": "m", "v": "\\text{Current assets}"}, "d": "assets convertible to cash within a year"}, {"s": {"t": "m", "v": "\\text{Current liabilities}"}, "d": "obligations due within a year"}], "note": null}, {"type": "formula", "name": "Quick ratio", "tex": "\\text{Quick ratio}=\\frac{\\text{Cash}+\\text{Short-term marketable inv.}+\\text{Receivables}}{\\text{Current liabilities}}", "terms": [{"s": {"t": "m", "v": "\\text{Cash}"}, "d": "cash and equivalents"}, {"s": {"t": "m", "v": "\\text{Short-term marketable inv.}"}, "d": "marketable securities"}, {"s": {"t": "m", "v": "\\text{Receivables}"}, "d": "accounts receivable"}], "note": "Excludes inventory (less liquid)."}, {"type": "formula", "name": "Cash ratio", "tex": "\\text{Cash ratio}=\\frac{\\text{Cash}+\\text{Short-term marketable inv.}}{\\text{Current liabilities}}", "terms": [{"s": {"t": "m", "v": "\\text{Cash}"}, "d": "cash and equivalents"}, {"s": {"t": "m", "v": "\\text{Short-term marketable inv.}"}, "d": "marketable securities"}, {"s": {"t": "m", "v": "\\text{Current liabilities}"}, "d": "obligations due within a year"}], "note": "The most conservative liquidity measure."}, {"type": "formula", "name": "Cash conversion cycle", "tex": "\\text{CCC}=\\text{DOH}+\\text{DSO}-\\text{DPO}", "terms": [{"s": {"t": "m", "v": "\\text{DOH}"}, "d": "days of inventory on hand"}, {"s": {"t": "m", "v": "\\text{DSO}"}, "d": "days sales outstanding"}, {"s": {"t": "m", "v": "\\text{DPO}"}, "d": "days payables outstanding"}], "note": "Shorter is better: less time cash is tied up in operations."}, {"type": "formula", "name": "Days ratios", "tex": "\\text{DSO}=\\frac{365}{\\text{Receivables turnover}}\\;;\\;\\;\\text{DOH}=\\frac{365}{\\text{Inventory turnover}}\\;;\\;\\;\\text{DPO}=\\frac{365}{\\text{Payables turnover}}", "terms": [{"s": {"t": "m", "v": "\\text{Receivables turnover}"}, "d": "revenue ÷ average receivables"}, {"s": {"t": "m", "v": "\\text{Inventory turnover}"}, "d": "COGS ÷ average inventory"}, {"s": {"t": "m", "v": "\\text{Payables turnover}"}, "d": "purchases ÷ average payables"}], "note": null}, {"type": "formula", "name": "Effective annual rate of trade credit (forgone discount)", "tex": "\\text{EAR}=\\Big(1+\\frac{\\text{Discount}\\%}{100\\%-\\text{Discount}\\%}\\Big)^{\\frac{365}{\\text{Days beyond discount}}}-1", "terms": [{"s": {"t": "m", "v": "\\text{Discount}\\%"}, "d": "the early-payment discount percentage"}, {"s": {"t": "m", "v": "\\text{Days beyond discount}"}, "d": "net days − discount days"}], "note": "The implicit cost of not taking a supplier's early-payment discount."}, {"type": "formula", "name": "Free cash flow", "tex": "\\text{FCF}=\\text{CFO}-\\text{Capital expenditures}", "terms": [{"s": {"t": "m", "v": "\\text{CFO}"}, "d": "cash flow from operations"}, {"s": {"t": " rn", "tex": "\\sum_{t=0}^{N}\\frac{CF_t}{(1+\\text{IRR})^t}=0", "terms": [{"s": {"t": "m", "v": "\\text{IRR}"}, "d": "rate that sets NPV to zero"}, {"s": {"t": "m", "v": "CF_{\\mathrm{t}}"}, "d": "after-tax cash flow at time t"}], "note": "Accept if IRR &gt; required rate of return."}, {"type": "formula", "name": "After-tax cash flow", "tex": "\\text{After-tax CF}_t=\\text{Gross cash flow}_t\\times(1-T)", "terms": [{"s": {"t": "m", "v": "\\text{Gross cash flow}_t"}, "d": "pre-tax operating cash flow"}, {"s": {"t": "m", "v": "T"}, "d": "tax rate"}], "note": null}, {"type": "formula", "name": "Return on invested capital (ROIC)", "tex": "\\text{ROIC}=\\frac{\\text{After-tax operating profit}}{\\text{Average invested capital}}=\\frac{\\text{NOPAT}}{\\text{Avg. invested capital}}", "terms": [{"s": {"t": "m", "v": "\\text{NOPAT}"}, "d": "net operating profit after tax = EBIT × (1 − T)"}, {"s": {"t": "m", "v": "\\text{Avg. invested capital}"}, "d": "average debt + equity capital"}], "note": "Value is created when ROIC exceeds the cost of capital (WACC)."}, {"type": "formula", "name": "Profitability index", "tex": "\\text{PI}=\\frac{\\text{PV of future cash flows}}{\\lvert CF_0\\rvert}=1+\\frac{\\text{NPV}}{\\lvert CF_0\\rvert}", "terms": [{"s": {"t": "m", "v": "\\text{PV of future cash flows}"}, "d": "present value of inflows"}, {"s": {"t": "m", "v": "CF_{\\mathrm{0}}"}, "d": "initial outlay"}], "note": "Accept if PI &gt; 1 (equivalent to NPV &gt; 0)."}, {"type": "formula", "name": "Project NPV with a real option", "tex": "\\text{NPV}=\\text{NPV (no option)}-\\text{Option cost}+\\text{Option value}", "terms": [{"s": {"t": "m", "v": "\\text{NPV (no option)}"}, "d": "base-case NPV without flexibility"}, {"s": {"t": "m", "v": "\\text{Option cost}"}, "d": "cost of acquiring the option"}, {"s": {"t": "m", "v": "\\text{Option value}"}, "d": "value added by the flexibility"}], "note": "Real options (timing, expansion, abandonment) add value to a project."}], "concepts": [{"type": "concept", "name": "Types of capital projects", "def": "Replacement, expansion, new products/markets, and regulatory/mandatory projects — each with different risk and analysis.", "note": null}, {"type": "concept", "name": "Capital allocation principles", "def": "Base decisions on incremental after-tax cash flows, ignore sunk costs, include opportunity costs and externalities.", "note": null}, {"type": "concept", "name": "NPV decision rule", "def": "Accept projects with positive NPV; NPV measures the value added at the required return.", "note": null}, {"type": "concept", "name": "IRR decision rule and pitfalls", "def": "Accept if IRR &gt; required return, but IRR can mislead with non-conventional cash flows or mutually exclusive projects — NPV dominates.", "note": null}, {"type": "concept", "name": "Real options in projects", "def": "Flexibility to delay, expand, abandon, or alter a project adds value beyond static NPV.", "note": null}, {"type": "concept", "name": "Behavioral and capital-allocation pitfalls", "def": "Overconfidence, inertia, internal politics, and pet projects distort sound allocation.", "note": null}, {"type": "concept", "name": "Return on invested capital (ROIC)", "def": "Compares after-tax operating profit to invested capital; creating value requires ROIC above the cost of capital.", "note": null}]}, {"name": "Learning Module 6 — Capital Structure", "cards": [{"type": "formula", "name": "Weighted average cost of capital", "tex": "\\text{WACC}=w_d\\,r_d(1-T)+w_e\\,r_e", "terms": [{"s": {"t": "m", "v": "w_d,\\;w_e"}, "d": "weights of debt and equity"}, {"s": {"t": "m", "v": "r_{\\mathrm{d}}"}, "d": "before-tax cost of debt"}, {"s": {"t": "m", "v": "r_{\\mathrm{e}}"}, "d": "cost of equity"}, {"s": {"t": "m", "v": "T"}, "d": "marginal tax rate"}], "note": "Uses market-value weights; the after-tax cost of debt reflects the tax shield."}, {"type": "formula", "name": "Capital structure weights", "tex": "w_d=\\frac{D}{D+E}\\;;\\;\\;w_e=\\frac{E}{D+E}", "terms": [{"s": {"t": "m", "v": "D"}, "d": "market value of debt"}, {"s": {"t": "m", "v": "E"}, "d": "market value of equity"}], "note": null}, {"type": "formula", "name": "After-tax cost of debt", "tex": "r_d^{\\text{after-tax}}=r_d(1-T)", "terms": [{"s": {"t": "m", "v": "r_{\\mathrm{d}}"}, "d": "before-tax cost of debt"}, {"s": {"t": "m", "v": "T"}, "d": "marginal tax rate"}], "note": "Interest is tax-deductible, lowering the effective cost of debt."}, {"type": "formula", "name": "MM Proposition I (no taxes)", "tex": "V_L=V_U", "terms": [{"s": {"t": "m", "v": "V_{\\mathrm{L}}"}, "d": "value of the levered firm"}, {"s": {"t": "m", "v": "V_{\\mathrm{U}}"}, "d": "value of the unlevered firm"}], "note": "Without taxes/frictions, capital structure does not affect firm value."}, {"type": "formula", "name": "MM Proposition II (no taxes)", "tex": "r_e=r_0+(r_0-r_d)\\frac{D}{E}", "terms": [{"s": {"t": "m", "v": "r_{\\mathrm{e}}"}, "d": "cost of equity"}, {"s": {"t": "m", "v": "r_{\\mathrm{0}}"}, "d": "cost of capital of the unlevered firm"}, {"s": {"t": "m", "v": "r_{\\mathrm{d}}"}, "d": "cost of debt"}, {"s": {"t": "t", "v": "D/E"}, "d": "debt-to-equity ratio"}], "note": "Cost of equity rises linearly with leverage."}, {"type": "formula", "name": "MM Proposition I (with taxes)", "tex": "V_L=V_U+tD", "terms": [{"s": {"t": "m", "v": "V_{\\mathrm{L}}"}, "d": "value of the levered firm"}, {"s": {"t": "m", "v": "V_{\\mathrm{U}}"}, "d": "value of the unlevered firm"}, {"s": {"t": "m", "v": "t"}, "d": "tax rate"}, {"s": {"t": "m", "v": "D"}, "d": "market value of debt"}], "note": "The interest tax shield adds value tD to the firm."}, {"type": "formula", "name": "MM Proposition II (with taxes)", "tex": "r_e=r_0+(r_0-r_d)(1-t)\\frac{D}{E}", "terms": [{"s": {"t": "m", "v": "r_{\\mathrm{e}}"}, "d": "cost of equity"}, {"s": {"t": "m", "v": "r_{\\mathrm{0}}"}, "d": "unlevered cost of capital"}, {"s": {"t": "m", "v": "r_{\\mathrm{d}}"}, "d": "cost of debt"}, {"s": {"t": "m", "v": "t"},
