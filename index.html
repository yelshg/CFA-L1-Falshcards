 "d": "tax rate"}, {"s": {"t": "t", "v": "D/E"}, "d": "debt-to-equity ratio"}], "note": null}, {"type": "formula", "name": "Firm value with distress costs", "tex": "V_L=V_U+tD-\\text{PV(costs of financial distress)}", "terms": [{"s": {"t": "m", "v": "V_{\\mathrm{L}}"}, "d": "value of the levered firm"}, {"s": {"t": "m", "v": "V_{\\mathrm{U}}"}, "d": "unlevered firm value"}, {"s": {"t": "m", "v": "tD"}, "d": "value of the interest tax shield"}, {"s": {"t": "m", "v": "\\text{PV(distress)}"}, "d": "present value of expected distress costs"}], "note": "Static trade-off theory: balance the tax shield against distress costs."}, {"type": "formula", "name": "Unlevered firm value", "tex": "V_U=\\frac{\\text{EBIT}(1-t)}{r_0}", "terms": [{"s": {"t": "m", "v": "\\text{EBIT}(1-t)"}, "d": "perpetual after-tax operating income (NOPAT)"}, {"s": {"t": "m", "v": "r_{\\mathrm{0}}"}, "d": "unlevered cost of capital"}], "note": "Values a firm's operations as a perpetuity of after-tax operating cash flow."}, {"type": "formula", "name": "Operating leverage and interest coverage", "tex": "\\text{Operating leverage}=\\frac{\\text{Fixed costs}}{\\text{Total costs}}\\;;\\;\\;\\text{Interest coverage}=\\frac{\\text{EBIT}}{\\text{Interest expense}}", "terms": [{"s": {"t": "m", "v": "\\text{Fixed costs}"}, "d": "costs that do not vary with output"}, {"s": {"t": "m", "v": "\\text{Total costs}"}, "d": "fixed + variable costs"}, {"s": {"t": "m", "v": "\\text{EBIT}"}, "d": "operating income"}], "note": null}], "concepts": [{"type": "concept", "name": "Capital structure defined", "def": "The mix of debt and equity a firm uses to finance its assets and operations.", "note": null}, {"type": "concept", "name": "MM without taxes", "def": "In a frictionless world, capital structure is irrelevant — firm value depends on assets, not financing.", "note": null}, {"type": "concept", "name": "MM with taxes", "def": "Interest tax deductibility makes debt valuable, raising firm value by the present value of the tax shield (tD).", "note": null}, {"type": "concept", "name": "Static trade-off theory", "def": "Optimal leverage balances the tax shield benefit of debt against the rising present value of financial distress costs.", "note": null}, {"type": "concept", "name": "Cost of equity rises with leverage", "def": "More debt increases the risk borne by equity holders, so the required return on equity increases (MM Proposition II).", "note": null}, {"type": "concept", "name": "Pecking order theory", "def": "Firms prefer internal funds first, then debt, and issue equity last, due to asymmetric information signaling.", "note": null}, {"type": "concept", "name": "Financial distress costs", "def": "Direct (legal, administrative) and indirect (lost customers, forced asset sales) costs that offset debt's tax benefit.", "note": null}, {"type": "concept", "name": "Target vs. actual capital structure", "def": "Firms aim for a target weight of debt/equity but deviate temporarily due to market conditions and financing needs.", "note": null}]}, {"name": "Learning Module 7 — Business Models", "cards": [], "concepts": [{"type": "concept", "name": "What a business model describes", "def": "How a firm creates, delivers, and captures value — its customers, offering, pricing, channels, and cost structure.", "note": null}, {"type": "concept", "name": "Value proposition", "def": "The product/service benefit that makes customers choose the firm; the foundation of the model.", "note": null}, {"type": "concept", "name": "Revenue model", "def": "How the firm charges (unit sales, subscription, licensing, freemium, advertising) shapes growth and stability.", "note": null}, {"type": "concept", "name": "Pricing strategies", "def": "Value-based, cost-plus, penetration, and price discrimination affect margins and volume.", "note": null}, {"type": "concept", "name": "Network effects and platforms", "def": "Value grows with the user base; platform businesses connect groups and can win-take-most.", "note": null}, {"type": "concept", "name": "Cost structure and scalability", "def": "Fixed vs. variable costs determine operating leverage and how profit scales with revenue.", "note": null}]}]}, {"id": "AI", "name": "Alternative Investments", "modules": [{"name": "Learning Module 1 — Alternative Investment Features, Methods, and Structures", "cards": [], "concepts": [{"type": "concept", "name": "Alternative investments defined", "def": "Assets outside traditional stocks, bonds, and cash — private capital, real assets, hedge funds, and digital assets — often illiquid and less regulated.", "note": null}, {"type": "concept", "name": "Common features of alternatives", "def": "Illiquidity, limited transparency, complex structures, higher fees, and the need for specialized due diligence.", "note": null}, {"type": "concept", "name": "Three investment methods", "def": "Fund investing (invest in a manager's fund), co-investing (alongside a fund), and direct investing (own the asset directly).", "note": null}, {"type": "concept", "name": "Trade-offs across methods", "def": "Direct investing gives control but demands expertise; fund investing gives diversification and access but higher fees and less control.", "note": null}, {"type": "concept", "name": "Partnership structure (GP/LP)", "def": "A general partner manages the fund and bears liability; limited partners provide capital with liability capped at their commitment.", "note": null}, {"type": "concept", "name": "Committed vs. drawn (called) capital", "def": "LPs commit capital that the GP draws down over time via capital calls as investments are made.", "note": null}, {"type": "concept", "name": "Diversification rationale", "def": "Alternatives can offer low correlation with traditional assets, potentially improving portfolio risk-adjusted returns.", "note": null}]}, {"name": "Learning Module 2 — Alternative Investment Performance and Returns", "cards": [{"type": "formula", "name": "Management fee", "tex": "\\text{Management fee}=\\text{Fee rate}\\times\\text{AUM (or committed/invested capital)}", "terms": [{"s": {"t": "m", "v": "\\text{Fee rate}"}, "d": "annual management fee percentage"}, {"s": {"t": "m", "v": "\\text{AUM}"}, "d": "assets under management (or the fee base in the LPA)"}], "note": "Charged on committed capital (early) or invested/NAV (later) depending on terms."}, {"type": "formula", "name": "Performance (incentive) fee", "tex": "\\text{Performance fee}=p\\times[\\text{Profit above hurdle / high-water mark}]", "terms": [{"s": {"t": "m", "v": "p"}, "d": "incentive (carried-interest) rate, e.g., 20%"}, {"s": {"t": "m", "v": "\\text{Profit}"}, "d": "gain in excess of the hurdle and/or high-water mark"}], "note": "Only profits above the required threshold are subject to the fee."}, {"type": "formula", "name": "Net investor return", "tex": "r_i=\\frac{\\text{End value}-\\text{Begin value}-\\text{Total fees}}{\\text{Begin value}}", "terms": [{"s": {"t": "m", "v": "\\text{End value}"}, "d": "ending capital / NAV"}, {"s": {"t": "m", "v": "\\text{Begin value}"}, "d": "beginning capital"}, {"s": {"t": "m", "v": "\\text{Total fees}"}, "d": "management + incentive fees"}], "note": null}, {"type": "formula", "name": "Multiple on invested capital (MOIC)", "tex": "\\text{MOIC}=\\frac{\\text{Realized value}+\\text{Unrealized value}}{\\text{Total invested capital}}", "terms": [{"s": {"t": "m", "v": "\\text{Realized value}"}, "d": "distributions received"}, {"s": {"t": "m", "v": "\\text{Unrealized value}"}, "d": "current value of remaining holdings"}, {"s": {"t": "m", "v": "\\text{Total invested capital}"}, "d": "capital deployed (net of fees)"}], "note": "Also called the investment multiple; ignores the time value of money."}, {"type": "formula", "name": "Internal rate of return", "tex": "\\sum_{i=0}^{N}\\frac{CF_i}{(1+r)^i}=0", "terms": [{"s": {"t": "m", "v": "CF_{\\mathrm{i}}"}, "d": "net cash flow (capital calls negative, distributions positive)"}, {"s": {"t": "m", "v": "r"}, "d": "internal rate of return"}], "note": "The money-weighted return; standard for private capital performance."}, {"type": "formula", "name": "Leveraged (borrowed-funds) return", "tex": "r_L=r+\\frac{V_b}{V_c}\\,(r-r_b)", "terms": [{"s": {"t": "m", "v": "r_{\\mathrm{L}}"}, "d": "return on the leveraged position"}, {"s": {"t": "m", "v": "r"}, "d": "unleveraged asset return"}, {"s": {"t": "m", "v": "V_{\\mathrm{b}}"}, "d": "borrowed funds"}, {"s": {"t": "m", "v": "V_{\\mathrm{c}}"}, "d": "cash (equity) invested"}, {"s": {"t": "m", "v": "r_{\\mathrm{b}}"}, "d": "borrowing cost"}], "note": "Leverage amplifies returns when r &gt; r_b and losses when r &lt; r_b."}, {"type": "formula", "name": "GP return with an incentive fee (hard hurdle)", "tex": "R_{GP}=(P_1\\times r_m)+\\max\\!\\big[0,\\,(P_1-P_0)\\times p\\big]", "terms": [{"s": {"t": "m", "v": "P_0,\\;P_1"}, "d": "beginning and ending capital position"}, {"s": {"t": "m", "v": "r_{\\mathrm{m}}"}, "d": "management fee rate"}, {"s": {"t": "m", "v": "p"}, "d": "incentive fee rate"}], "note": "The incentive portion applies only to positive gains."}, {"type": "formula", "name": "GP incentive fee with a high-water mark", "tex": "R_{GP}=(P_2\\times r_m)+\\max\\!\\big[0,\\,(P_2-P_{HWM})\\times p\\big]", "terms": [{"s": {"t": "m", "v": "P_{\\mathrm{2}}"}, "d": "current period capital position"}, {"s": {"t": "m", "v": "P_{HWM}"}, "d": "high-water mark (previous peak)"}, {"s": {"t": "m", "v": "r_{\\mathrm{m}}"}, "d": "management fee rate"}, {"s": {"t": "m", "v": "p"}, "d": "incentive rate"}], "note": "No incentive fee until the value exceeds the prior peak (high-water mark)."}], "concepts": [{"type": "concept", "name": "Management fee vs. incentive fee", "def": "The management fee is charged on assets/committed capital; the incentive (performance) fee is a share of profits above a threshold.", "note": null}, {"type": "concept", "name": "Hurdle rate", "def": "A minimum return the fund must earn before the GP collects an incentive fee; hard vs. soft determines the base.", "note": null}, {"type": "concept", "name": "High-water mark", "def": "The prior peak value; incentive fees apply only on gains above it, preventing double-charging after losses.", "note": null}, {"type": "concept", "name": "Catch-up clause", "def": "After LPs receive their preferred return, the GP 'catches up' to its full profit share on prior gains.", "note": null}, {"type": "concept", "name": "Why IRR and MOIC differ", "def": "IRR is time-weighted (money-weighted) and reflects timing; MOIC is a simple multiple that ignores the time value of money.", "note": null}, {"type": "concept", "name": "Clawback provision", "def": "Requires the GP to return excess incentive fees if later losses mean it was overpaid across the fund's life.", "note": null}, {"type": "concept", "name": "Gross vs. net returns", "def": "Net returns deduct all fees and expenses; investors' realized performance is measured net of fees.", "note": null}, {"type": "concept", "name": "Leverage effect on returns", "def": "Borrowing amplifies both gains and losses relative to the equity invested.", "note": null}]}, {"name": "Learning Module 3 — Investments in Private Capital: Equity and Debt", "cards": [], "concepts": [{"type": "concept", "name": "Private equity strategies", "def": "Leveraged buyouts (mature firms with debt) and venture capital (early-stage growth) are the main private equity forms.", "note": null}, {"type": "concept", "name": "How LBOs create value", "def": "Operational improvements, financial leverage, and multiple expansion at exit drive buyout returns.", "note": null}, {"type": "concept", "name": "Venture capital stages", "def": "Seed, early, and later-stage financing; earlier stages carry higher risk and higher potential return.", "note": null}, {"type": "concept", "name": "Private debt", "def": "Direct lending, mewzzanine, distressed, and venture debt provide credit outside public markets, often with higher yields.", "note": null}, {"type": "concept", "name": "Exit routes", "def": "Trade sale, secondary sale, IPO, or recapitalization realize value for private equity investors.", "note": null}, {"type": "concept", "name": "J-curve effect", "def": "Early fees and write-downs depress returns before value creation lifts them later in the fund's life.", "note": null}, {"type": "concept", "name": "Illiquidity and lock-up", "def": "Private capital ties up money for years; investors demand an illiquidity premium.", "note": null}]}, {"name": "Learning Module 4 — Real Estate and Infrastructure", "cards": [{"type": "formula", "name": "Net operating income (NOI)", "tex": "\\text{NOI}=\\text{Rental income}-\\text{Operating expenses}", "terms": [{"s": {"t": "m", "v": "\\text{Rental income}"}, "d": "gross rental and other property income"}, {"s": {"t": "m", "v": "\\text{Operating expenses}"}, "d": "property operating costs (excl. financing and taxes)"}], "note": "The core cash-flow measure for income-producing real estate."}, {"type": "formula", "name": "Capitalization rate", "tex": "\\text{Cap rate}=\\frac{\\text{NOI}}{\\text{Property value}}", "terms": [{"s": {"t": "m", "v": "\\text{NOI}"}, "d": "net operating income"}, {"s": {"t": "m", "v": "\\text{Property value}"}, "d": "current market value of the property"}], "note": "A higher cap rate implies higher required return or higher risk."}, {"type": "formula", "name": "Property value from NOI", "tex": "\\text{Property value}=\\frac{\\text{NOI}}{\\text{Cap rate}}", "terms": [{"s": {"t": "m", "v": "\\text{NOI}"}, "d": "net operating income"}, {"s": {"t": "m", "v": "\\text{Cap rate}"}, "d": "capitalization rate"}], "note": "Direct capitalization: value the property as an NOI perpetuity."}, {"type": "formula", "name": "Loan-to-value ratio", "tex": "\\text{LTV}=\\frac{\\text{Mortgage liability}}{\\text{Property value}}", "terms": [{"s": {"t": "m", "v": "\\text{Mortgage liability}"}, "d": "outstanding mortgage debt"}, {"s": {"t": "m", "v": "\\text{Property value}"}, "d": "current market value of the property"}], "note": "Higher LTV means more leverage and higher risk to the lender."}], "concepts": [{"type": "concept", "name": "Real estate investment forms", "def": "Equity vs. debt, and public (REITs) vs. private (direct property, funds) — each with different liquidity and risk.", "note": null}, {"type": "concept", "name": "Sources of real estate return", "def": "Rental income (NOI), property appreciation, and leverage; plus diversification and inflation-hedging benefits.", "note": null}, {"type": "concept", "name": "Capitalization rate meaning", "def": "NOI divided by property value; a market-implied required return that inverts to a value multiple.", "note": null}, {"type": "concept", "name": "REIT characteristics", "def": "Liquid, exchange-traded, must distribute most income as dividends; offer real-estate exposure without direct ownership.", "note": null}, {"type": "concept", "name": "Infrastructure investing", "def": "Long-lived physical assets (roads, utilities) with stable, often inflation-linked cash flows and low correlation to markets.", "note": null}, {"type": "concept", "name": "Brownfield vs. greenfield", "def": "Brownfield: existing assets with track records (lower risk). Greenfield: new construction (higher risk, development upside).", "note": null}, {"type": "concept", "name": "Leverage and LTV in real estate", "def": "Mortgage debt magnifies equity returns; higher loan-to-value raises both return potential and risk.", "note": null}]}, {"name": "Learning Module 5 — Natural Resources", "cards": [], "concepts": [{"type": "concept", "name": "Categories of natural resources", "def": "Commodities, farmland, and timberland — real assets whose value ties to physical output and prices.", "note": null}, {"type": "concept", "name": "Commodity investment methods", "def": "Direct (physical), derivatives (futures), and indirect (commodity producers or ETFs).", "note": null}, {"type": "concept", "name": "Commodity futures return components", "def": "Spot price change, roll yield (contango/backwardation), and collateral yield combine to total return.", "note": null}, {"type": "concept", "name": "Contango vs. backwardation", "def": "Contango (futures &gt; spot) creates negative roll yield; backwardation (futures &lt; spot) creates positive roll yield.", "note": null}, {"type": "concept", "name": "Timberland and farmland features", "def": "Provide income (crops/harvest), price appreciation, and biological growth; act as inflation hedges.", "note": null}, {"type": "concept", "name": "Inflation-hedging role", "def": "Real assets tend to hold value as prices rise, diversifying portfolios against inflation.", "note": null}]}, {"name": "Learning Module 6 — Hedge Funds", "cards": [{"type": "formula", "name": "Management fee", "tex": "\\text{Management fee}=r_m\\times\\text{AUM}", "terms": [{"s": {"t": "m", "v": "r_{\\mathrm{m}}"}, "d": "management fee rate (e.g., 1%–2%)"}, {"s": {"t": "m", "v": "\\text{AUM}"}, "d": "assets under management / NAV"}], "note": "The '2' in the classic '2-and-20' fee structure."}, {"type": "formula", "name": "Performance (incentive) fee", "tex": "\\text{Performance fee}=p\\times[\\text{Return above hurdle and high-water mark}]", "terms": [{"s": {"t": "m", "v": "p"}, "d": "incentive fee rate (e.g., 20%)"}, {"s": {"t": "m", "v": "\\text{Return above hurdle}"}, "d": "gain in excess of the hurdle / prior peak"}], "note": "The '20' in '2-and-20'; hurdle and high-water mark reduce the fee."}, {"type": "formula", "name": "Excess return over a hurdle", "tex": "\\text{Excess}=\\text{Growth}-(\\text{Begin AUM}\\times\\text{Hurdle})-\\text{Management fee}", "terms": [{"s": {"t": "m", "v": "\\text{Growth}"}, "d": "increase in fund value over the year"}, {"s": {"t": "m", "v": "\\text{Begin AUM}"}, "d": "beginning assets under management"}, {"s": {"t": "m", "v": "\\text{Hurdle}"}, "d": "minimum return before incentive fees apply"}], "note": "The base to which the incentive rate is applied (with a hard hurdle)."}, {"type": "formula", "name": "Net return to investors", "tex": "r_i=\\frac{\\text{Gain}-\\text{Total fees}}{\\text{Begin AUM}}", "terms": [{"s": {"t": "m", "v": "\\text{Gain}"}, "d": "gross increase in fund value"}, {"s": {"t": "m", "v": "\\text{Total fees}"}, "d": "management + performance fees"}, {"s": {"t": "m", "v": "\\text{Begin AUM}"}, "d": "beginning assets under management"}], "note": null}], "concepts": [{"type": "concept", "name": "Hedge fund defined", "def": "A privately pooled, actively managed vehicle using flexible strategies (leverage, shorting, derivatives) seeking absolute returns.", "note": null}, {"type": "concept", "name": "Main strategy categories", "def": "Equity hedge, event-driven, relative value, macro, and multi-strategy; each has distinct risk and return drivers.", "note": null}, {"type": "concept", "name": "2-and-20 fee structure", "def": "A ~2% management fee plus ~20% incentive fee, often with a hurdle and high-water mark.", "note": null}, {"type": "concept", "name": "Long/short equity", "def": "Buys undervalued and shorts overvalued stocks to profit from relative performance and reduce market exposure.", "note": null}, {"type": "concept", "name": "Lock-ups, gates, and redemptions", "def": "Restrictions that limit investor withdrawals, protecting the fund from forced liquidations.", "note": null}, {"type": "concept", "name": "Fund of hedge funds", "def": "Invests across multiple hedge funds for diversification, adding a second layer of fees.", "note": null}, {"type": "concept", "name": "Role in a portfolio", "def": "Potential for lower correlation and downside protection, at the cost of higher fees and complexity.", "note": null}]}, {"name": "Learning Module 7 — Introduction to Digital Assets", "cards": [], "concepts": [{"type": "concept", "name": "Digital assets defined", "def": "Assets recorded on a distributed ledger (blockchain), including cryptocurrencies, tokens, and stablecoins.", "note": null}, {"type": "concept", "name": "Distributed ledger technology (DLT)", "def": "A shared, cryptographically secured database that records transactions across many nodes without a central authority.", "note": null}, {"type": "concept", "name": "Cryptocurrencies", "def": "Digital mediums of exchange (e.g., proof-of-work/stake coins) with no central issuer; highly volatile.", "note": null}, {"type": "concept", "name": "Tokens: utility, security, NFTs", "def": "Tokens can grant access (utility), represent investment claims (security), or unique ownership (non-fungible).", "note": null}, {"type": "concept", "name": "Stablecoins", "def": "Digital assets pegged to a reference (fiat, commodity) to reduce volatility; peg maintenance is a key risk.", "note": null}, {"type": "concept", "name": "Investment forms and risks", "def": "Direct holdings, coins/tokens, or funds/ETPs; risks include custody, regulation, fraud, and extreme volatility.", "note": null}]}]}, {"id": "QM", "name": "Quantitative Methods", "modules": [{"name": "Learning Module 1 — Rates and Returns", "cards": [{"type": "formula", "name": "Holding period return", "tex": "R=\\frac{P_1-P_0+I_1}{P_0}", "terms": [{"s": {"t": "m", "v": "R"}, "d": "holding period return"}, {"s": {"t": "m", "v": "P_0,\\;P_1"}, "d": "beginning and ending price"}, {"s": {"t": "m", "v": "I_{\\mathrm{1}}"}, "d": "income (dividend/interest) received over the period"}], "note": "Combines price appreciation and income yield."}, {"type": "formula", "name": "Required return (nominal rate build-up)", "tex": "r=\\text{Real RF}+\\text{Inflation prem.}+\\text{Default}+\\text{Liquidity}+\\text{Maturity prem.}", "terms": [{"s": {"t": "m", "v": "r"}, "d": "required nominal rate of return"}, {"s": {"t": "m", "v": "\\text{Real RF}"}, "d": "real risk-free rate"}, {"s": {"t": "m", "v": "\\text{Inflation prem.}"}, "d": "compensation for expected inflation"}, {"s": {"t": "m", "v": "\\text{Default/Liquidity/Maturity}"}, "d": "risk premia for the security"}], "note": null}, {"type": "formula", "name": "Fisher relation (nominal vs. real)", "tex": "(1+\\text{nominal})=(1+\\text{real})(1+\\text{inflation})", "terms": [{"s": {"t": "m", "v": "\\text{nominal}"}, "d": "nominal rate of return"}, {"s": {"t": "m", "v": "\\text{real}"}, "d": "real rate of return"}, {"s": {"t": "m", "v": "\\text{inflation}"}, "d": "inflation rate"}], "note": "Real return = (1 + nominal)/(1 + inflation) − 1."}, {"type": "formula", "name": "Arithmetic mean return", "tex": "\\bar{R}=\\frac{1}{T}\\sum_{t=1}^{T}R_t", "terms": [{"s": {"t": "m", "v": "\\bar{R}"}, "d": "arithmetic mean return"}, {"s": {"t": "m", "v": "R_{\\mathrm{t}}"}, "d": "return in period t"}, {"s": {"t": "m", "v": "T"}, "d": "number of periods"}], "note": null}, {"type": "formula", "name": "Geometric mean return", "tex": "\\bar{R}_G=\\Big[\\textstyle\\prod_{t=1}^{T}(1+R_t)\\Big]^{1/T}-1", "terms": [{"s": {"t": "m", "v": "\\bar{R}_G"}, "d": "geometric mean (compound) return"}, {"s": {"t": "m", "v": "R_{\\mathrm{t}}"}, "d": "return in period t"}, {"s": {"t": "m", "v": "T"}, "d": "number of periods"}], "note": "Always ≤ arithmetic mean; captures actual compound growth."}, {"type": "formula", "name": "Harmonic mean", "tex": "\\bar{X}_H=\\frac{n}{\\sum_{i=1}^{n}(1/X_i)}", "terms": [{"s": {"t": "m", "v": "\\bar{X}_H"}, "d": "harmonic mean"}, {"s": {"t": "m", "v": "X_{\\mathrm{i}}"}, "d": "each positive observation"}, {"s": {"t": "m", "v": "n"}, "d": "number of observations"}], "note": "Used for average cost per share (e.g., cost averaging)."}, {"type": "formula", "name": "Money-weighted return (IRR)", "tex": "\\sum_{t=0}^{N}\\frac{CF_t}{(1+\\text{IRR})^t}=0", "terms": [{"s": {"t": "m", "v": "CF_{\\mathrm{t}}"}, "d": "net cash flow at time t (sign-sensitive)"}, {"s": {"t": "m", "v": "\\text{IRR}"}, "d": "money-weighted rate of return"}, {"s": {"t": "m", "v": "N"}, "d": "number of periods"}], "note": "Sensitive to the timing and size of cash flows in and out."}, {"type": "formula", "name": "Time-weighted return", "tex": "R_{TW}=\\Big[\\textstyle\\prod_{i=1}^{N}(1+R_i)\\Big]^{1/N}-1", "terms": [{"s": {"t": "m", "v": "R_{TW}"}, "d": "time-weighted rate of return"}, {"s": {"t": "m", "v": "R_{\\mathrm{i}}"}, "d": "holding period return of each sub-period"}, {"s": {"t": "m", "v": "N"}, "d": "number of sub-periods"}], "note": "Removes the effect of cash-flow timing; the standard for manager performance."}, {"type": "formula", "name": "Annualizing a return", "tex": "R_{\\text{annual}}=(1+R_{\\text{period}})^{c}-1", "terms": [{"s": {"t": "m", "v": "R_{\\text{period}}"}, "d": "return over the sub-period"}, {"s": {"t": "m", "v": "c"}, "d": "number of periods per year (e.g., 52 weekly, 12 monthly)"}], "note": null}, {"type": "formula", "name": "Continuously compounded return", "tex": "r=\\ln\\!\\Big(\\frac{P_1}{P_0}\\Big)=\\ln(1+R)", "terms": [{"s": {"t": "m", "v": "r"}, "d": "continuously compounded return"}, {"s": {"t": "m", "v": "P_0,\\;P_1"}, "d": "beginning and ending price"}, {"s": {"t": "m", "v": "R"}, "d": "holding period (simple) return"}], "note": "Continuously compounded returns are additive across time."}], "concepts": [{"type": "concept", "name": "Interest rate as three things", "def": "A required rate of return, a discount rate, or an opportunity cost — all views of the same time-value price.", "note": null}, {"type": "concept", "name": "Components of a required return", "def": "Real risk-free rate plus premiums for inflation, default, liquidity, and maturity.", "note": null}, {"type": "concept", "name": "Arithmetic vs. geometric mean", "def": "Arithmetic mean is the best estimate of next-period return; geometric mean measures actual compound growth over time.", "note": null}, {"type": "concept", "name": "Money-weighted vs. time-weighted return", "def": "Money-weighted (IRR) reflects cash-flow timing; time-weighted removes it and is the standard for comparing managers.", "note": null}, {"type": "concept", "name": "Gross vs. net return", "def": "Net return subtracts fees and expenses; after-tax return further removes taxes.", "note": null}, {"type": "concept", "name": "Nominal vs. real return", "def": "Real return strips out inflation: (1 + nominal)/(1 + inflation) − 1.", "note": null}, {"type": "concept", "name": "Leveraged return", "def": "Borrowing to invest magnifies the portfolio return (and risk) relative to equity invested.", "note": null}, {"type": "concept", "name": "Continuously compounded return", "def": "The natural log of the price relative; these returns are additive across periods.", "note": null}]}, {"name": "Learning Module 2 — Time Value of Money in Finance", "cards": [{"type": "formula", "name": "Future and present value", "tex": "FV_t=PV(1+r)^t\\;;\\;\\;PV=FV_t(1+r)^{-t}", "terms": [{"s": {"t": "m", "v": "FV_{\\mathrm{t}}"}, "d": "future value at time t"}, {"s": {"t": "m", "v": "PV"}, "d": "present value today"}, {"s": {"t": "m", "v": "r"}, "d": "interest rate per period"}, {"s": {"t": "m", "v": "t"}, "d": "number of periods"}], "note": "Continuous form: FV = PV·e^{rt}."}, {"type": "formula", "name": "Present value of a coupon bond", "tex": "PV=\\sum_{t=1}^{N}\\frac{PMT}{(1+r)^t}+\\frac{FV}{(1+r)^N}", "terms": [{"s": {"t": "m", "v": "PMT"}, "d": "periodic coupon payment"}, {"s": {"t": "m", "v": "FV"}, "d": "face value repaid at maturity"}, {"s": {"t": "m", "v": "r"}, "d": "market discount rate per period"}, {"s": {"t": "m", "v": "N"}, "d": "number of periods"}], "note": null}, {"type": "formula", "name": "Present value of a perpetual bond", "tex": "PV=\\frac{PMT}{r}", "terms": [{"s": {"t": "m", "v": "PMT"}, "d": "level periodic payment (perpetual)"}, {"s": {"t": "m", "v": "r"}, "d": "discount rate per period"}], "note": "A perpetuity: constant payments forever."}, {"type": "formula", "name": "Amortizing loan/annuity payment", "tex": "A=\\frac{r\\,(PV)}{1-(1+r)^{-t}}", "terms": [{"s": {"t": "m", "v": "A"}, "d": "periodic payment (interest + principal)"}, {"s": {"t": "m", "v": "r"}, "d": "interest rate per period"}, {"s": {"t": "m", "v": "PV"}, "d": "loan principal (present value)"}, {"s": {"t": "m", "v": "t"}, "d": "number of payment periods"}], "note": null}, {"type": "formula", "name": "Gordon (constant) growth value", "tex": "PV=\\frac{D_1}{r-g}\\;,\\quad D_1=D_0(1+g)", "terms": [{"s": {"t": "m", "v": "PV"}, "d": "present value of the equity"}, {"s": {"t": "m", "v": "D_{\\mathrm{1}}"}, "d": "next period's dividend"}, {"s": {"t": "m", "v": "r"}, "d": "required return"}, {"s": {"t": "m", "v": "g"}, "d": "constant growth rate (g &lt; r)"}], "note": null}, {"type": "formula", "name": "Implied return from Gordon growth", "tex": "r=\\frac{D_1}{PV}+g", "terms": [{"s": {"t": "m", "v": "r"}, "d": "required (implied) return"}, {"s": {"t": "m", "v": "D_{\\mathrm{1}}"}, "d": "next period's dividend"}, {"s": {"t": "m", "v": "PV"}, "d": "current price"}, {"s": {"t": "m", "v": "g"}, "d": "growth rate"}], "note": "Dividend yield plus growth."}, {"type": "formula", "name": "Implied growth from Gordon growth", "tex": "g=r-\\frac{D_1}{PV}", "terms": [{"s": {"t": "m", "v": "g"}, "d": "implied growth rate"}, {"s": {"t": "m", "v": "r"}, "d": "required return"}, {"s": {"t": "m", "v": "D_{\\mathrm{1}}"}, "d": "next period's dividend"}, {"s": {"t": "m", "v": "PV"}, "d": "current price"}], "note": null}, {"type": "formula", "name": "Implied forward rate", "tex": "F_{1,1}=\\frac{(1+r_2)^2}{(1+r_1)}-1", "terms": [{"s": {"t": "m", "v": "F_{1,1}"}, "d": "one-year rate, one year forward"}, {"s": {"t": "m", "v": "r_{\\mathrm{1}}"}, "d": "one-year spot rate"}, {"s": {"t": "m", "v": "r_{\\mathrm{2}}"}, "d": "two-year spot rate"}], "note": "From (1+r_2)^2 = (1+r_1)(1+F_{1,1})."}], "concepts": [{"type": "concept", "name": "Time value of money principle", "def": "A dollar today is worth more than a dollar later; cash flows are compared by discounting to a common date.", "note": null}, {"type": "concept", "name": "Valuing a bond", "def": "A bond's price is the present value of its coupons plus the present value of its face value at the market rate.", "note": null}, {"type": "concept", "name": "Perpetuity", "def": "A constant cash flow forever; its value is the payment divided by the discount rate.", "note": null}, {"type": "concept", "name": "Annuity vs. perpetuity", "def": "An annuity pays for a fixed number of periods; a perpetuity pays forever.", "note": null}, {"type": "concept", "name": "Gordon growth model", "def": "Values a stock as next year's dividend divided by (required return − constant growth); requires g &lt; r.", "note": null}, {"type": "concept", "name": "Required return and growth are linked to price", "def": "From the Gordon model, price implies a required return (dividend yield + growth) or an implied growth rate.", "note": null}, {"type": "concept", "name": "Spot vs. forward rates", "def": "Spot rates apply from today; forward rates are implied future rates that keep the term structure arbitrage-free.", "note": null}, {"type": "concept", "name": "Amortizing loan structure", "def": "Level payments cover interest on the declining balance plus principal, retiring the loan by maturity.", "note": null}]}, {"name": "Learning Module 3 — Statistical Measures of Asset Returns", "cards": [{"type": "formula", "name": "Sample mean", "tex": "\\bar{X}=\\frac{1}{n}\\sum_{i=1}^{n}X_i", "terms": [{"s": {"t": "m", "v": "\\bar{X}"}, "d": "sample mean"}, {"s": {"t": "m", "v": "X_{\\mathrm{i}}"}, "d": "each observation"}, {"s": {"t": "m", "v": "n"}, "d": "sample size"}], "note": null}, {"type": "formula", "name": "Sample variance", "tex": "s^2=\\frac{\\sum_{i=1}^{n}(X_i-\\bar{X})^2}{n-1}", "terms": [{"s": {"t": "m", "v": "s^2"}, "d": "sample variance"}, {"s": {"t": "m", "v": "X_{\\mathrm{i}}"}, "d": "each observation"}, {"s": {"t": "m", "v": "\\bar{X}"}, "d": "sample mean"}, {"s": {"t": "t", "v": "n-1"}, "d": "degrees of freedom"}], "note": "Divide by n − 1 (Bessel's correction) for a sample."}, {"type": "formula", "name": "Sample standard deviation", "tex": "s=\\sqrt{\\frac{\\sum_{i=1}^{n}(X_i-\\bar{X})^2}{n-1}}", "terms": [{"s": {"t": "m", "v": "s"}, "d": "sample standard deviation"}, {"s": {"t": "m", "v": "X_{\\mathrm{i}}"}, "d": "each observation"}, {"s": {"t": "m", "v": "\\bar{X}"}, "d": "sample mean"}], "note": null}, {"type": "formula", "name": "Mean absolute deviation", "tex": "\\text{MAD}=\\frac{\\sum_{i=1}^{n}\\lvert X_i-\\bar{X}\\rvert}{n}", "terms": [{"s": {"t": "m", "v": "X_{\\mathrm{i}}"}, "d": "each observation"}, {"s": {"t": "m", "v": "\\bar{X}"}, "d": "sample mean"}, {"s": {"t": "m", "v": "n"}, "d": "sample size"}], "note": null}, {"type": "formula", "name": "Range", "tex": "\\text{Range}=\\text{Maximum}-\\text{Minimum}", "terms": [{"s": {"t": "m", "v": "\\text{Maximum}"}, "d": "largest observation"}, {"s": {"t": "m", "v": "\\text{Minimum}"}, "d": "smallest observation"}], "note": null}, {"type": "formula", "name": "Coefficient of variation", "tex": "\\text{CV}=\\frac{s}{\\bar{X}}", "terms": [{"s": {"t": "m", "v": "s"}, "d": "standard deviation"}, {"s": {"t": "m", "v": "\\bar{X}"}, "d": "mean"}], "note": "Risk per unit of return; lower is better. Unit-free."}, {"type": "formula", "name": "Target (downside) semideviation", "tex": "s_{\\text{Target}}=\\sqrt{\\frac{\\sum_{X_i<B}(X_i-B)^2}{n-1}}", "terms": [{"s": {"t": "m", "v": "B"}, "d": "target (minimum acceptable) return"}, {"s": {"t": "m", "v": "X_{\\mathrm{i}}"}, "d": "observations below the target"}, {"s": {"t": "m", "v": "n"}, "d": "total number of observations"}], "note": "Only deviations below the target enter the sum."}, {"type": "formula", "name": "Location of a percentile", "tex": "L_y=(n+1)\\times\\frac{y}{100}", "terms": [{"s": {"t": "m", "v": "L_{\\mathrm{y}}"}, "d": "position of the y-th percentile in sorted data"}, {"s": {"t": "m", "v": "n"}, "d": "number of observations"}, {"s": {"t": "m", "v": "y"}, "d": "percentile (0–100)"}], "note": "Interpolate between adjacent observations if L_y is not an integer."}, {"type": "formula", "name": "Interquartile range", "tex": "\\text{IQR}=Q_3-Q_1", "terms": [{"s": {"t": "m", "v": "Q_{\\mathrm{3}}"}, "d": "third quartile (75th percentile)"}, {"s": {"t": "m", "v": "Q_{\\mathrm{1}}"}, "d": "first quartile (25th percentile)"}], "note": null}, {"type": "formula", "name": "Sample correlation", "tex": "r_{XY}=\\frac{s_{XY}}{s_X\\,s_Y}", "terms": [{"s": {"t": "m", "v": "r_{XY}"}, "d": "sample correlation coefficient (−1 to +1)"}, {"s": {"t": "m", "v": "s_{XY}"}, "d": "sample covariance of X and Y"}, {"s": {"t": "m", "v": "s_X,\\;s_Y"}, "d": "sample standard deviations"}], "note": null}], "concepts": [{"type": "concept", "name": "Population vs. sample", "def": "A population includes all members; a sample is a subset used to estimate population parameters.", "note": null}, {"type": "concept", "name": "Measures of central tendency", "def": "Mean, median, and mode summarize a distribution's center; the median resists outliers.", "note": null}, {"type": "concept", "name": "Dispersion measures", "def": "Range, mean absolute deviation, variance, and standard deviation quantify how spread out returns are.", "note": null}, {"type": "concept", "name": "Why sample variance divides by n−1", "def": "Using n−1 (degrees of freedom) makes the sample variance an unbiased estimator of the population variance.", "note": null}, {"type": "concept", "name": "Coefficient of variation", "def": "Standard deviation per unit of mean; lets you compare relative risk across series with different scales.", "note": null}, {"type": "concept", "name": "Downside deviation (target semideviation)", "def": "Measures dispersion of returns below a target, capturing downside risk that standard deviation treats symmetrically.", "note": null}, {"type": "concept", "name": "Skewness", "def": "Asymmetry of a distribution; positive skew has a long right tail, negative skew a long left tail.", "note": null}, {"type": "concept", "name": "Kurtosis", "def": "Peakedness/tail weight; leptokurtic (excess kurtosis &gt; 0) distributions have fatter tails and more outliers.", "note": null}, {"type": "concept", "name": "Quantiles", "def": "Quartiles, quintiles, and percentiles split ordered data into groups; the IQR measures middle spread.", "note": null}, {"type": "concept", "name": "Correlation vs. covariance", "def": "Both measure co-movement; correlation standardizes covariance to a −1 to +1 scale.", "note": null}]}, {"name": "Learning Module 4 — Probability Trees and Conditional Expectations", "cards": [{"type": "formula", "name": "Expected value", "tex": "E(X)=\\sum_{i=1}^{n}P(X_i)\\,X_i", "terms": [{"s": {"t": "t", "v": "E(X)"}, "d": "expected value of X"}, {"s": {"t": "t", "v": "P(X<sub>i</sub>)"}, "d": "probability of outcome X_i"}, {"s": {"t": "m", "v": "X_{\\mathrm{i}}"}, "d": "each possible outcome"}], "note": null}, {"type": "formula", "name": "Variance of a random variable", "tex": "\\sigma^2(X)=\\sum_{i=1}^{n}P(X_i)\\,[X_i-E(X)]^2", "terms": [{"s": {"t": "m", "v": "\\sigma^2(X)"}, "d": "variance"}, {"s": {"t": "t", "v": "P(X<sub>i</sub>)"}, "d": "probability of outcome X_i"}, {"s": {"t": "t", "v": "E(X)"}, "d": "expected value"}], "note": null}, {"type": "formula", "name": "Conditional expected value", "tex": "E(X\\mid S)=\\sum_{i}P(X_i\\mid S)\\,X_i", "terms": [{"s": {"t": "m", "v": "E(X\\mid S)"}, "d": "expected value of X given scenario S"}, {"s": {"t": "m", "v": "P(X_i\\mid S)"}, "d": "conditional probability of X_i given S"}], "note": null}, {"type": "formula", "name": "Total probability rule for expected value", "tex": "E(X)=\\sum_{i}E(X\\mid S_i)\\,P(S_i)", "terms": [{"s": {"t": "m", "v": "E(X\\mid S_i)"}, "d": "expected value in scenario i"}, {"s": {"t": "t", "v": "P(S<sub>i</sub>)"}, "d": "probability of scenario i (mutually exclusive, exhaustive)"}], "note": null}, {"type": "formula", "name": "Conditional probability", "tex": "P(A\\mid B)=\\frac{P(AB)}{P(B)}\\;,\\quad P(B)\\ne 0", "terms": [{"s": {"t": "m", "v": "P(A\\mid B)"}, "d": "probability of A given B"}, {"s": {"t": "t", "v": "P(AB)"}, "d": "joint probability of A and B"}, {"s": {"t": "t", "v": "P(B)"}, "d": "probability of B"}], "note": null}, {"type": "formula", "name": "Multiplication rule", "tex": "P(AB)=P(A\\mid B)\\,P(B)", "terms": [{"s": {"t": "t", "v": "P(AB)"}, "d": "joint probability of A and B"}, {"s": {"t": "m", "v": "P(A\\mid B)"}, "d": "conditional probability"}, {"s": {"t": "t", "v": "P(B)"}, "d": "probability of B"}], "note": null}, {"type": "formula", "name": "Total probability rule", "tex": "P(A)=\\sum_{i}P(A\\mid S_i)\\,P(S_i)", "terms": [{"s": {"t": "t", "v": "P(A)"}, "d": "unconditional probability of A"}, {"s": {"t": "m", "v": "P(A\\mid S_i)"}, "d": "probability of A given scenario i"}, {"s": {"t": "t", "v": "P(S<sub>i</sub>)"}, "d": "probability of scenario i"}], "note": null}, {"type": "formula", "name": "Bayes' formula", "tex": "P(B\\mid A)=\\frac{P(A\\mid B)}{P(A)}\\,P(B)", "terms": [{"s": {"t": "m", "v": "P(B\\mid A)"}, "d": "updated (posterior) probability of B given A"}, {"s": {"t": "m", "v": "P(A\\mid B)"}, "d": "likelihood of A given B"}, {"s": {"t": "t", "v": "P(B)"}, "d": "prior probability of B"}, {"s": {"t": "t", "v": "P(A)"}, "d": "unconditional probability of A"}], "note": "Updates a prior belief with new information."}], "concepts": [{"type": "concept", "name": "Expected value", "def": "The probability-weighted average of a random variable's possible outcomes.", "note": null}, {"type": "concept", "name": "Conditional vs. unconditional probability", "def": "Conditional probability accounts for given information; unconditional (marginal) ignores it.", "note": null}, {"type": "concept", "name": "Multiplication rule", "def": "The joint probability of two events equals the conditional times the unconditional: P(AB) = P(A|B)P(B).", "note": null}, {"type": "concept", "name": "Total probability rule", "def": "Unconditional probability (or expected value) is the weighted average across mutually exclusive, exhaustive scenarios.", "note": null}, {"type": "concept", "name": "Bayes' formula", "def": "Updates a prior probability with new evidence to a posterior; central to belief revision.", "note": null}, {"type": "concept", "name": "Probability tree", "def": "A diagram of sequential outcomes and probabilities used to compute expected values and update beliefs.", "note": null}, {"type": "concept", "name": "Independent vs. mutually exclusive", "def": "Independent events don't affect each other's probability; mutually exclusive events cannot both occur.", "note": null}]}, {"name": "Learning Module 5 — Portfolio Mathematics", "cards": [{"type": "formula", "name": "Portfolio expected return", "tex": "E(R_p)=\\sum_{i=1}^{n}w_i\\,E(R_i)", "terms": [{"s": {"t": "t", "v": "E(R<sub>p</sub>)"}, "d": "portfolio expected return"}, {"s": {"t": "m", "v": "w_{\\mathrm{i}}"}, "d": "weight of asset i"}, {"s": {"t": "t", "v": "E(R<sub>i</sub>)"}, "d": "expected return of asset i"}], "note": "A weighted average of the component expected returns."}, {"type": "formula", "name": "Portfolio variance (general)", "tex": "\\sigma^2(R_p)=\\sum_{i=1}^{n}\\sum_{j=1}^{n}w_i\\,w_j\\,\\text{Cov}(R_i,R_j)", "terms": [{"s": {"t": "m", "v": "\\sigma^2(R_p)"}, "d": "portfolio variance"}, {"s": {"t": "m", "v": "w_i,\\;w_j"}, "d": "asset weights"}, {"s": {"t": "m", "v": "\\text{Cov}(R_i,R_j)"}, "d": "covariance of returns (own variance when i = j)"}], "note": null}, {"type": "formula", "name": "Two-asset portfolio variance", "tex": "\\sigma^2(R_p)=w_1^2\\sigma_1^2+w_2^2\\sigma_2^2+2w_1w_2\\,\\text{Cov}(R_1,R_2)", "terms": [{"s": {"t": "m", "v": "w_1,\\;w_2"}, "d": "asset weights"}, {"s": {"t": "m", "v": "\\sigma_1^2,\\;\\sigma_2^2"}, "d": "asset variances"}, {"s": {"t": "m", "v": "\\text{Cov}(R_1,R_2)"}, "d": "covariance between the two assets"}], "note": null}, {"type": "formula", "name": "Covariance of returns", "tex": "\\text{Cov}(R_i,R_j)=E\\big[(R_i-ER_i)(R_j-ER_j)\\big]", "terms": [{"s": {"t": "m", "v": "R_i,\\;R_j"}, "d": "returns of assets i and j"}, {"s": {"t": "m", "v": "ER_i,\\;ER_j"}, "d": "expected returns"}], "note": "Own covariance equals variance: Cov(R,R) = σ²(R)."}, {"type": "formula", "name": "Correlation", "tex": "\\rho(R_i,R_j)=\\frac{\\text{Cov}(R_i,R_j)}{\\sigma(R_i)\\,\\sigma(R_j)}", "terms": [{"s": {"t": "m", "v": "\\rho"}, "d": "correlation coefficient (−1 to +1)"}, {"s": {"t": "m", "v": "\\text{Cov}(R_i,R_j)"}, "d": "covariance"}, {"s": {"t": "m", "v": "\\sigma(R_i),\\;\\sigma(R_j)"}, "d": "standard deviations"}], "note": null}, {"type": "formula", "name": "Covariance from a joint probability table", "tex": "\\text{Cov}(R_A,R_B)=\\sum_i\\sum_j P(R_{A,i},R_{B,j})(R_{A,i}-ER_A)(R_{B,j}-ER_B)", "terms": [{"s": {"t": "m", "v": "P(R_{A,i},R_{B,j})"}, "d": "joint probability of the return pair"}, {"s": {"t": "m", "v": "ER_A,\\;ER_B"}, "d": "expected returns"}], "note": null}, {"type": "formula", "name": "Number of distinct covariances", "tex": "\\text{Off-diagonal}=n(n-1)\\;;\\;\\;\\text{Distinct}=\\frac{n(n-1)}{2}", "terms": [{"s": {"t": "m", "v": "n"}, "d": "number of assets in the portfolio"}], "note": "An n-asset covariance matrix has n variances and n(n−1) covariances."}, {"type": "formula", "name": "Safety-first ratio (Roy's)", "tex": "\\text{SFRatio}=\\frac{E(R_p)-R_L}{\\sigma_p}", "terms": [{"s": {"t": "t", "v": "E(R<sub>p</sub>)"}, "d": "portfolio expected return"}, {"s": {"t": "m", "v": "R_{\\mathrm{L}}"}, "d": "threshold (minimum acceptable) return"}, {"s": {"t": "m", "v": "\\sigma_p"}, "d": "portfolio standard deviation"}], "note": "Maximize it: it minimizes the probability of returns below the threshold."}], "concepts": [{"type": "concept", "name": "Portfolio expected return", "def": "A weighted average of component expected returns — it does not depend on correlations.", "note": null}, {"type": "concept", "name": "Portfolio variance depends on covariance", "def": "Unlike return, portfolio risk depends on how assets co-move; low correlation reduces risk.", "note": null}, {"type": "concept", "name": "Diversification benefit", "def": "Combining assets with correlation below +1 lowers portfolio standard deviation below the weighted average.", "note": null}, {"type": "concept", "name": "Covariance and correlation", "def": "Covariance measures joint variation; correlation standardizes it between −1 and +1.", "note": null}, {"type": "concept", "name": "Number of terms in the covariance matrix", "def": "For n assets there are n variances and n(n−1) covariances; covariances dominate risk as n grows.", "note": null}, {"type": "concept", "name": "Safety-first (Roy's criterion)", "def": "Choose the portfolio that minimizes the probability of returning below a threshold; maximize the safety-first ratio.", "note": null}, {"type": "concept", "name": "Correlation of 1, 0, and −1", "def": "At +1 no diversification; at 0 substantial risk reduction; at −1 risk can be eliminated with the right weights.", "note": null}]}, {"name": "Learning Module 6 — Simulation Methods", "cards": [], "concepts": [{"type": "concept", "name": "Monte Carlo simulation", "def": "Generates many random outcomes from assumed distributions to estimate the distribution of a result (e.g., option value).", "note": null}, {"type": "concept", "name": "Bootstrap resampling", "def": "Repeatedly resamples (with replacement) from observed data to estimate a statistic's sampling distribution without assuming a form.", "note": null}, {"type": "concept", "name": "Why simulate", "def": "Useful when analytical solutions are intractable, for path-dependent payoffs, or to stress-test assumptions.", "note": null}, {"type": "concept", "name": "Lognormal prices", "def": "If continuously compounded returns are normal, prices are lognormally distributed (cannot go below zero).", "note": null}, {"type": "concept", "name": "Limitations of simulation", "def": "Results are only as good as the input assumptions ('garbage in, garbage out'); they don't add real-world information.", "note": null}, {"type": "concept", "name": "Specifying the model", "def": "Choose variables, their distributions, and correlations; then run many trials and analyze the output distribution.", "note": null}]}, {"name": "Learning Module 7 — Estimation and Inference", "cards": [{"type": "formula", "name": "Standard error of the sample mean (σ known)", "tex": "\\sigma_{\\bar{X}}=\\frac{\\sigma}{\\sqrt{n}}", "terms": [{"s": {"t": "m", "v": "\\sigma_{\\bar{X}}"}, "d": "standard error of the mean"}, {"s": {"t": "m", "v": "\\sigma"}, "d": "population standard deviation"}, {"s": {"t": "m", "v": "n"}, "d": "sample size"}], "note": null}, {"type": "formula", "name": "Standard error of the sample mean (σ unknown)", "tex": "s_{\\bar{X}}=\\frac{s}{\\sqrt{n}}", "terms": [{"s": {"t": "m", "v": "s_{\\bar{X}}"}, "d": "estimated standard error"}, {"s": {"t": "m", "v": "s"}, "d": "sample standard deviation"}, {"s": {"t": "m", "v": "n"}, "d": "sample size"}], "note": null}, {"type": "formula", "name": "Confidence interval for the mean", "tex": "\\bar{X}\\pm z_{\\alpha/2}\\,\\frac{s}{\\sqrt{n}}", "terms": [{"s": {"t": "m", "v": "\\bar{X}"}, "d": "sample mean"}, {"s": {"t": "m", "v": "z_{\\alpha/2}"}, "d": "reliability factor (z or t)"}, {"s": {"t": "m", "v": "s/\\sqrt{n}"}, "d": "standard error of the mean"}], "note": "Use t when σ is unknown and the sample is small."}, {"type": "formula", "name": "Bootstrap standard error", "tex": "s_{\\bar{X}}=\\sqrt{\\frac{1}{B-1}\\sum_{b=1}^{B}(\\hat{\\theta}_b-\\bar{\\theta})^2}", "terms": [{"s": {"t": "m", "v": "B"}, "d": "number of resamples"}, {"s": {"t": "m", "v": "\\hat{\\theta}_b"}, "d": "statistic from resample b"}, {"s": {"t": "m", "v": "\\bar{\\theta}"}, "d": "mean of the resample statistics"}], "note": "Resampling estimates the sampling distribution empirically."}, {"type": "formula", "name": "Sharpe ratio", "tex": "\\text{Sharpe}=\\frac{R_p-R_f}{\\sigma_p}", "terms": [{"s": {"t": "m", "v": "R_{\\mathrm{p}}"}, "d": "portfolio return"}, {"s": {"t": "m", "v": "R_{\\mathrm{f}}"}, "d": "risk-free rate"}, {"s": {"t": "m", "v": "\\sigma_p"}, "d": "portfolio standard deviation"}], "note": "Excess return earned per unit of total risk."}], "concepts": [{"type": "concept", "name": "Sampling distribution", "def": "The distribution of a statistic (e.g., the sample mean) over many samples; its spread is the standard error.", "note": null}, {"type": "concept", "name": "Standard error of the mean", "def": "Measures the precision of the sample mean; it shrinks with the square root of the sample size.", "note": null}, {"type": "concept", "name": "Central limit theorem", "def": "For large samples, the distribution of the sample mean is approximately normal regardless of the population's shape.", "note": null}, {"type": "concept", "name": "Confidence interval", "def": "A range that, with a stated probability, contains the true parameter; wider for higher confidence or more variability.", "note": null}, {"type": "concept", "name": "t-distribution vs. normal", "def": "Use the t-distribution (fatter tails) when the population variance is unknown and the sample is small.", "note": null}, {"type": "concept", "name": "Resampling (bootstrap/jackknife)", "def": "Data-driven methods to estimate standard errors and confidence intervals without distributional assumptions.", "note": null}, {"type": "concept", "name": "Sampling error and bias", "def": "Sampling error is random variation; biases (survivorship, data-snooping, look-ahead) systematically distort inference.", "note": null}]}, {"name": "Learning Module 8 — Hypothesis Testing", "cards": [{"type": "formula", "name": "Test of a single mean", "tex": "t=\\frac{\\bar{X}-\\mu_0}{s/\\sqrt{n}}", "terms": [{"s": {"t": "m", "v": "\\bar{X}"}, "d": "sample mean"}, {"s": {"t": "m", "v": "\\mu_0"}, "d": "hypothesized mean"}, {"s": {"t": "m", "v": "s"}, "d": "sample standard deviation"}, {"s": {"t": "m", "v": "n"}, "d": "sample size (df = n − 1)"}], "note": "Use z if the population variance is known."}, {"type": "formula", "name": "Difference in means (pooled variance)", "tex": "t=\\frac{(\\bar{X}_1-\\bar{X}_2)-0}{\\sqrt{s_p^2/n_1+s_p^2/n_2}}", "terms": [{"s": {"t": "m", "v": "\\bar{X}_1,\\;\\bar{X}_2"}, "d": "sample means"}, {"s": {"t": "m", "v": "s_p^2"}, "d": "pooled variance"}, {"s": {"t": "m", "v": "n_1,\\;n_2"}, "d": "sample sizes"}], "note": "Assumes equal, unknown population variances (independent samples)."}, {"type": "formula", "name": "Pooled variance", "tex": "s_p^2=\\frac{(n_1-1)s_1^2+(n_2-1)s_2^2}{n_1+n_2-2}", "terms": [{"s": {"t": "m", "v": "s_1^2,\\;s_2^2"}, "d": "sample variances"}, {"s": {"t": "m", "v": "n_1,\\;n_2"}, "d": "sample sizes"}], "note": null}, {"type": "formula", "name": "Test of mean of differences (paired)", "tex": "t=\\frac{\\bar{d}-0}{s_{\\bar{d}}}", "terms": [{"s": {"t": "m", "v": "\\bar{d}"}, "d": "mean of the paired differences"}, {"s": {"t": "m", "v": "s_{\\bar{d}}"}, "d": "standard error of the differences"}], "note": "For dependent (paired) observations; df = n − 1."}, {"type": "formula", "name": "Test of a single variance", "tex": "\\chi^2=\\frac{(n-1)s^2}{\\sigma_0^2}", "terms": [{"s": {"t": "m", "v": "\\chi^2"}, "d": "chi-square statistic (df = n − 1)"}, {"s": {"t": "m", "v": "s^2"}, "d": "sample variance"}, {"s": {"t": "m", "v": "\\sigma_0^2"}, "d": "hypothesized variance"}], "note": null}, {"type": "formula", "name": "Test of equality of two variances", "tex": "F=\\frac{s_1^2}{s_2^2}", "terms": [{"s": {"t": "m", "v": "F"}, "d": "F-statistic (larger variance on top)"}, {"s": {"t": "m", "v": "s_1^2,\\;s_2^2"}, "d": "sample variances"}], "note": "df = n₁ − 1 (numerator) and n₂ − 1 (denominator)."}], "concepts": [{"type": "concept", "name": "Null vs. alternative hypothesis", "def": "The null is the statement tested (often 'no effect'); the alternative is what you conclude if the null is rejected.", "note": null}, {"type": "concept", "name": "Type I vs. Type II error", "def": "Type I: rejecting a true null (probability = significance level α). Type II: failing to reject a false null (probability β).", "note": null}, {"type": "concept", "name": "Test statistic and critical value", "def": "Compare the standardized test statistic to a critical value (or the p-value to α) to decide on the null.", "note": null}, {"type": "concept", "name": "One-tailed vs. two-tailed test", "def": "A one-tailed test checks direction; a two-tailed test checks for any difference. The hypothesis wording sets this.", "note": null}, {"type": "concept", "name": "p-value", "def": "The smallest significance level at which the null can be rejected; smaller p-values are stronger evidence against the null.", "note": null}, {"type": "concept", "name": "Choosing the test statistic", "def": "t for means, chi-square for a single variance, F for equality of two variances; depends on the parameter and assumptions.", "note": null}, {"type": "concept", "name": "Statistical vs. economic significance", "def": "A result can be statistically significant yet too small (after costs/taxes) to matter economically.", "note": null}]}, {"name": "Learning Module 9 — Parametric and Non-Parametric Tests of Independence", "cards": [{"type": "formula", "name": "Test of a correlation coefficient", "tex": "t=\\frac{r\\sqrt{n-2}}{\\sqrt{1-r^2}}", "terms": [{"s": {"t": "m", "v": "r"}, "d": "sample correlation"}, {"s": {"t": "m", "v": "n"}, "d": "sample size (df = n − 2)"}], "note": "Tests H₀: ρ = 0 (no linear relationship)."}, {"type": "formula", "name": "Spearman rank correlation", "tex": "r_s=1-\\frac{6\\sum_{i=1}^{n}d_i^2}{n(n^2-1)}", "terms": [{"s": {"t": "m", "v": "r_{\\mathrm{s}}"}, "d": "Spearman rank correlation"}, {"s": {"t": "m", "v": "d_{\\mathrm{i}}"}, "d": "difference in ranks for observation i"}, {"s": {"t": "m", "v": "n"}, "d": "number of observations"}], "note": "A non-parametric measure based on ranks."}, {"type": "formula", "name": "Chi-square test of independence", "tex": "\\chi^2=\\sum_{i=1}^{m}\\frac{(O_i-E_i)^2}{E_i}", "terms": [{"s": {"t": "m", "v": "O_{\\mathrm{i}}"}, "d": "observed frequency in a cell"}, {"s": {"t": "m", "v": "E_{\\mathrm{i}}"}, "d": "expected frequency in a cell"}, {"s": {"t": "m", "v": "m"}, "d": "number of cells"}], "note": "df = (rows − 1)(columns − 1)."}, {"type": "formula", "name": "Expected cell frequency", "tex": "E_{ij}=\\frac{(\\text{Row total}_i)\\times(\\text{Column total}_j)}{\\text{Overall total}}", "terms": [{"s": {"t": "m", "v": "E_{ij}"}, "d": "expected count in cell (i, j)"}, {"s": {"t": "m", "v": "\\text{Row/Column total}"}, "d": "marginal totals"}, {"s": {"t": "m", "v": "\\text{Overall total}"}, "d": "sample size"}], "note": null}, {"type": "formula", "name": "Standardized residual", "tex": "\\text{Std. residual}=\\frac{O_{ij}-E_{ij}}{\\sqrt{E_{ij}}}", "terms": [{"s": {"t": "m", "v": "O_{ij}"}, "d": "observed frequency"}, {"s": {"t": "m", "v": "E_{ij}"}, "d": "expected frequency"}], "note": "Identifies which cells drive a significant chi-square."}], "concepts": [{"type": "concept", "name": "Testing a correlation coefficient", "def": "A t-test checks whether a sample correlation is significantly different from zero (linear association).", "note": null}, {"type": "concept", "name": "Parametric vs. non-parametric tests", "def": "Parametric tests assume a distribution; non-parametric tests (ranks, counts) make fewer assumptions and suit ordinal data.", "note": null}, {"type": "concept", "name": "Spearman rank correlation", "def": "A non-parametric correlation on ranks; robust to outliers and non-linear monotonic relationships.", "note": null}, {"type": "concept", "name": "Chi-square test of independence", "def": "Compares observed vs. expected frequencies in a contingency table to test whether two categorical variables are related.", "note": null}, {"type": "concept", "name": "Expected frequencies", "def": "Under independence, each cell's expected count is (row total × column total) / overall total.", "note": null}, {"type": "concept", "name": "Degrees of freedom in a contingency table", "def": "(rows − 1) × (columns − 1); determines the chi-square critical value.", "note": null}]}, {"name": "Learning Module 10 — Simple Linear Regression", "cards": [{"type": "formula", "name": "Simple linear regression model", "tex": "Y_i=b_0+b_1 X_i+\\varepsilon_i", "terms": [{"s": {"t": "m", "v": "Y_{\\mathrm{i}}"}, "d": "dependent variable"}, {"s": {"t": "m", "v": "X_{\\mathrm{i}}"}, "d": "independent variable"}, {"s": {"t": "m", "v": "b_{\\mathrm{0}}"}, "d": "intercept"}, {"s": {"t": "m", "v": "b_{\\mathrm{1}}"}, "d": "slope"}, {"s": {"t": "m", "v": "\\varepsilon_i"}, "d": "residual (error) term"}], "note": null}, {"type": "formula", "name": "Slope coefficient", "tex": "\\hat{b}_1=\\frac{\\text{Cov}(X,Y)}{\\text{Var}(X)}=\\frac{\\sum(X_i-\\bar{X})(Y_i-\\bar{Y})}{\\sum(X_i-\\bar{X})^2}", "terms": [{"s": {"t": "m", "v": "\\hat{b}_1"}, "d": "estimated slope"}, {"s": {"t": "m", "v": "\\text{Cov}(X,Y)"}, "d": "sample covariance"}, {"s": {"t": "m", "v": "\\text{Var}(X)"}, "d": "variance of X"}], "note": null}, {"type": "formula", "name": "Intercept coefficient", "tex": "\\hat{b}_0=\\bar{Y}-\\hat{b}_1\\bar{X}", "terms": [{"s": {"t": "m", "v": "\\hat{b}_0"}, "d": "estimated intercept"}, {"s": {"t": "m", "v": "\\bar{X},\\;\\bar{Y}"}, "d": "sample means"}, {"s": {"t": "m", "v": "\\hat{b}_1"}, "d": "estimated slope"}], "note": "The regression line passes through (X̄, Ȳ)."}, {"type": "formula", "name": "Decomposition of variation", "tex": "\\text{SST}=\\text{SSR}+\\text{SSE}", "terms": [{"s": {"t": "m", "v": "\\text{SST}"}, "d": "total sum of squares (total variation in Y)"}, {"s": {"t": "m", "v": "\\text{SSR}"}, "d": "regression (explained) sum of squares"}, {"s": {"t": "m", "v": "\\text{SSE}"}, "d": "error (unexplained) sum of squares"}], "note": null}, {"type": "formula", "name": "Coefficient of determination", "tex": "R^2=\\frac{\\text{SSR}}{\\text{SST}}=1-\\frac{\\text{SSE}}{\\text{SST}}", "terms": [{"s": {"t": "m", "v": "R^2"}, "d": "fraction of variation in Y explained by X"}, {"s": {"t": "m", "v": "\\text{SSR}"}, "d": "explained variation"}, {"s": {"t": "m", "v": "\\text{SST}"}, "d": "total variation"}], "note": "In simple regression, R² = r²."}, {"type": "formula", "name": "Standard error of the estimate", "tex": "s_e=\\sqrt{\\text{MSE}}=\\sqrt{\\frac{\\text{SSE}}{n-2}}", "terms": [{"s": {"t": "m", "v": "s_{\\mathrm{e}}"}, "d": "standard error of the estimate"}, {"s": {"t": "m", "v": "\\text{SSE}"}, "d": "sum of squared errors"}, {"s": {"t": "t", "v": "n-2"}, "d": "degrees of freedom"}], "note": null}, {"type": "formula", "name": "F-statistic", "tex": "F=\\frac{\\text{MSR}}{\\text{MSE}}=\\frac{\\text{SSR}/k}{\\text{SSE}/(n-2)}", "terms": [{"s": {"t": "m", "v": "\\text{MSR}"}, "d": "mean square regression"}, {"s": {"t": "m", "v": "\\text{MSE}"}, "d": "mean square error"}, {"s": {"t": "m", "v": "k"}, "d": "number of slope coefficients (= 1 here)"}], "note": "Tests whether the slope is jointly significant."}, {"type": "formula", "name": "t-test of the slope", "tex": "t=\\frac{\\hat{b}_1-B_1}{s_{\\hat{b}_1}}", "terms": [{"s": {"t": "m", "v": "\\hat{b}_1"}, "d": "estimated slope"}, {"s": {"t": "m", "v": "B_{\\mathrm{1}}"}, "d": "hypothesized slope (often 0)"}, {"s": {"t": "m", "v": "s_{\\hat{b}_1}"}, "d": "standard error of the slope"}, {"s": {"t": "t", "v": ""}, "d": "df = n − 2"}], "note": null}, {"type": "formula", "name": "Predicted (forecast) value", "tex": "\\hat{Y}_f=\\hat{b}_0+\\hat{b}_1 X_f", "terms": [{"s": {"t": "m", "v": "\\hat{Y}_f"}, "d": "forecast of Y"}, {"s": {"t": "m", "v": "X_{\\mathrm{f}}"}, "d": "given value of the independent variable"}, {"s": {"t": "m", "v": "\\hat{b}_0,\\;\\hat{b}_1"}, "d": "estimated coefficients"}], "note": null}, {"type": "formula", "name": "Variance of the prediction error", "tex": "s_f^2=s_e^2\\Big[1+\\frac{1}{n}+\\frac{(X_f-\\bar{X})^2}{(n-1)s_X^2}\\Big]", "terms": [{"s": {"t": "m", "v": "s_f^2"}, "d": "variance of the prediction error"}, {"s": {"t": "m", "v": "s_e^2"}, "d": "squared standard error of the estimate"}, {"s": {"t": "m", "v": "X_{\\mathrm{f}}"}, "d": "forecast input"}, {"s": {"t": "m", "v": "\\bar{X}"}, "d": "mean of X"}, {"s": {"t": "m", "v": "s_X^2"}, "d": "variance of X"}, {"s": {"t": "m", "v": "n"}, "d": "sample size"}], "note": "The interval widens as X_f moves away from X̄."}], "concepts": [{"type": "concept", "name": "Dependent vs. independent variable", "def": "The regression explains the dependent variable (Y) using the independent variable (X).", "note": null}, {"type": "concept", "name": "Ordinary least squares", "def": "Chooses the slope and intercept that minimize the sum of squared residuals (vertical distances to the line).", "note": null}, {"type": "concept", "name": "Interpreting slope and intercept", "def": "The slope is the change in Y per unit change in X; the intercept is Y when X = 0.", "note": null}, {"type": "concept", "name": "Coefficient of determination (R²)", "def": "The fraction of the variation in Y explained by X; equals the squared correlation in simple regression.", "note": null}, {"type": "concept", "name": "Standard error of the estimate", "def": "The typical size of the regression residuals; smaller means a tighter fit.", "note": null}, {"type": "concept", "name": "Assumptions of linear regression", "def": "Linearity, independence, homoskedasticity (constant error variance), and normally distributed errors.", "note": null}, {"type": "concept", "name": "Testing the slope", "def": "A t-test (or the F-test) checks whether the slope differs from zero — i.e., whether X explains Y.", "note": null}, {"type": "concept", "name": "Confidence vs. prediction interval", "def": "A prediction interval for a forecast is wider than a confidence interval for the mean and widens away from X̄.", "note": null}, {"type": "concept", "name": "ANOVA and the F-test", "def": "Decomposes total variation into explained (SSR) and unexplained (SSE); the F-test assesses overall significance.", "note": null}]}]}, {"id": "PM", "name": "Portfolio Management", "modules": [{"name": "Learning Module 1 — Portfolio Risk and Return: Part I", "cards": [{"type": "formula", "name": "Portfolio return", "tex": "R_p=\\sum_{i=1}^{n}w_i R_i", "terms": [{"s": {"t": "m", "v": "R_{\\mathrm{p}}"}, "d": "portfolio return"}, {"s": {"t": "m", "v": "w_{\\mathrm{i}}"}, "d": "weight of asset i (weights sum to 1)"}, {"s": {"t": "m", "v": "R_{\\mathrm{i}}"}, "d": "return of asset i"}], "note": "A weighted average of the component returns."}, {"type": "formula", "name": "Two-asset portfolio variance", "tex": "\\sigma_p^2=w_1^2\\sigma_1^2+w_2^2\\sigma_2^2+2w_1w_2\\,\\text{Cov}(R_1,R_2)", "terms": [{"s": {"t": "m", "v": "w_1,\\;w_2"}, "d": "asset weights"}, {"s": {"t": "m", "v": "\\sigma_1^2,\\;\\sigma_2^2"}, "d": "asset variances"}, {"s": {"t": "m", "v": "\\text{Cov}(R_1,R_2)"}, "d": "covariance of the two assets' returns"}], "note": null}, {"type": "formula", "name": "Covariance and correlation", "tex": "\\text{Cov}(R_1,R_2)=\\rho_{12}\\,\\sigma_1\\,\\sigma_2", "terms": [{"s": {"t": "m", "v": "\\rho_{12}"}, "d": "correlation between the two assets (−1 to +1)"}, {"s": {"t": "m", "v": "\\sigma_1,\\;\\sigma_2"}, "d": "standard deviations of the assets"}], "note": "Lower correlation gives a greater diversification (risk-reduction) benefit."}, {"type": "formula", "name": "Portfolio risk when correlation = +1", "tex": "\\sigma_p=w_1\\sigma_1+w_2\\sigma_2", "terms": [{"s": {"t": "m", "v": "\\sigma_p"}, "d": "portfolio standard deviation"}, {"s": {"t": "m", "v": "w_1,\\;w_2"}, "d": "asset weights"}, {"s": {"t": "m", "v": "\\sigma_1,\\;\\sigma_2"}, "d": "asset standard deviations"}], "note": "Only at ρ = +1 is risk the weighted average; below +1 it is lower (diversification)."}, {"type": "formula", "name": "Investor utility function", "tex": "U=E(r)-\\tfrac{1}{2}A\\,\\sigma^2", "terms": [{"s": {"t": "m", "v": "U"}, "d": "investor's utility (certainty-equivalent return)"}, {"s": {"t": "t", "v": "E(r)"}, "d": "expected return"}, {"s": {"t": "m", "v": "A"}, "d": "risk-aversion coefficient (higher = more averse)"}, {"s": {"t": "m", "v": "\\sigma^2"}, "d": "variance of return"}], "note": "Higher A penalizes risk more heavily; A &lt; 0 is risk-seeking."}, {"type": "formula", "name": "Risk-free asset plus one risky asset", "tex": "E(R_p)=w_1 R_f+(1-w_1)E(R_i)\\;;\\;\\;\\sigma_p=(1-w_1)\\sigma_i", "terms": [{"s": {"t": "m", "v": "R_{\\mathrm{f}}"}, "d": "risk-free rate"}, {"s": {"t": "t", "v": "E(R<sub>i</sub>)"}, "d": "expected return of the risky asset"}, {"s": {"t": "m", "v": "w_{\\mathrm{1}}"}, "d": "weight in the risk-free asset"}, {"s": {"t": "m", "v": "\\sigma_i"}, "d": "standard deviation of the risky asset"}], "note": "Combining with a risk-free asset gives a straight risk–return line."}, {"type": "formula", "name": "Capital allocation line (CAL)", "tex": "E(R_p)=R_f+\\frac{E(R_i)-R_f}{\\sigma_i}\\,\\sigma_p", "terms": [{"s": {"t": "m", "v": "R_{\\mathrm{f}}"}, "d": "risk-free rate"}, {"s": {"t": "t", "v": "E(R<sub>i</sub>)-R<sub>f</sub>"}, "d": "risk premium of the risky asset/portfolio"}, {"s": {"t": "m", "v": "\\sigma_i"}, "d": "standard deviation of the risky asset/portfolio"}, {"s": {"t": "m", "v": "\\sigma_p"}, "d": "portfolio standard deviation"}], "note": "The slope is the Sharpe ratio of the risky asset."}, {"type": "formula", "name": "Nominal return decomposition", "tex": "1+E(R)=(1+r_{rF})\\,[1+E(\\pi)]\\,[1+E(RP)]", "terms": [{"s": {"t": "m", "v": "r_{rF}"}, "d": "real risk-free rate"}, {"s": {"t": "m", "v": "E(\\pi)"}, "d": "expected inflation"}, {"s": {"t": "t", "v": "E(RP)"}, "d": "expected risk premium"}], "note": "A required nominal return builds up from real rate, inflation, and a risk premium."}, {"type": "formula", "name": "Large equally-weighted portfolio variance", "tex": "\\sigma_p^2=\\frac{\\bar{\\sigma}^2}{N}+\\frac{N-1}{N}\\,\\overline{\\text{Cov}}", "terms": [{"s": {"t": "m", "v": "\\bar{\\sigma}^2"}, "d": "average variance of the assets"}, {"s": {"t": "m", "v": "\\overline{\\text{Cov}}"}, "d": "average covariance across asset pairs"}, {"s": {"t": "m", "v": "N"}, "d": "number of assets"}], "note": "As N grows, variance approaches the average covariance — undiversifiable risk."}], "concepts": [{"type": "concept", "name": "Portfolio perspective", "def": "Evaluate securities by their contribution to the risk and return of the whole portfolio, not in isolation — diversification is the key benefit.", "note": null}, {"type": "concept", "name": "Risk aversion", "def": "Investors require higher expected return to bear more risk; the risk-aversion coefficient A measures how much extra return they demand.", "note": null}, {"type": "concept", "name": "Utility and indifference curves", "def": "A risk-averse investor's utility rises with return and falls with variance; indifference curves map equally-preferred risk–return combinations.", "note": null}, {"type": "concept", "name": "Diversification and correlation", "def": "Combining assets with correlation below +1 lowers portfolio risk below the weighted average; the benefit grows as correlation falls.", "note": null}, {"type": "concept", "name": "Efficient frontier", "def": "The set of portfolios offering the highest expected return for each level of risk; rational investors hold only frontier portfolios.", "note": null}, {"type": "concept", "name": "Capital allocation line", "def": "Combining the risk-free asset with a risky portfolio traces a straight line; its slope is the risky portfolio's Sharpe ratio.", "note": null}, {"type": "concept", "name": "Systematic vs. nonsystematic risk", "def": "Nonsystematic (firm-specific) risk is diversifiable; systematic (market) risk is not and is what earns a premium.", "note": null}, {"type": "concept", "name": "Historical asset-class risk and return", "def": "Higher-risk asset classes (equities) have historically earned higher average returns than lower-risk ones (bonds, bills).", "note": null}]}, {"name": "Learning Module 2 — Portfolio Risk and Return: Part II", "cards": [{"type": "formula", "name": "Capital market line (CML)", "tex": "E(R_p)=R_f+\\frac{E(R_m)-R_f}{\\sigma_m}\\,\\sigma_p", "terms": [{"s": {"t": "m", "v": "R_{\\mathrm{f}}"}, "d": "risk-free rate"}, {"s": {"t": "t", "v": "E(R<sub>m</sub>)"}, "d": "expected market return"}, {"s": {"t": "m", "v": "\\sigma_m"}, "d": "standard deviation of the market"}, {"s": {"t": "m", "v": "\\sigma_p"}, "d": "portfolio standard deviation"}], "note": "Efficient portfolios combine the risk-free asset and the market portfolio; uses total risk."}, {"type": "formula", "name": "Capital asset pricing model (CAPM / SML)", "tex": "E(R_i)=R_f+\\beta_i\\,[E(R_m)-R_f]", "terms": [{"s": {"t": "t", "v": "E(R<sub>i</sub>)"}, "d": "required return on asset i"}, {"s": {"t": "m", "v": "R_{\\mathrm{f}}"}, "d": "risk-free rate"}, {"s": {"t": "m", "v": "\\beta_i"}, "d": "beta (systematic risk) of asset i"}, {"s": {"t": "t", "v": "E(R<sub>m</sub>)-R<sub>f</sub>"}, "d": "market risk premium"}], "note": "The security market line prices assets by systematic risk (beta) only."}, {"type": "formula", "name": "Beta", "tex": "\\beta_i=\\frac{\\text{Cov}(R_i,R_m)}{\\sigma_m^2}=\\rho_{i,m}\\frac{\\sigma_i}{\\sigma_m}", "terms": [{"s": {"t": "m", "v": "\\text{Cov}(R_i,R_m)"}, "d": "covariance of asset and market returns"}, {"s": {"t": "m", "v": "\\sigma_m^2"}, "d": "market variance"}, {"s": {"t": "m", "v": "\\rho_{i,m}"}, "d": "correlation of asset with the market"}, {"s": {"t": "m", "v": "\\sigma_i,\\;\\sigma_m"}, "d": "standard deviations"}], "note": "Beta measures sensitivity to market moves; the market's beta is 1."}, {"type": "formula", "name": "Portfolio beta", "tex": "\\beta_p=\\sum_{i=1}^{n}w_i\\beta_i", "terms": [{"s": {"t": "m", "v": "\\beta_p"}, "d": "portfolio beta"}, {"s": {"t": "m", "v": "w_{\\mathrm{i}}"}, "d": "weight of asset i"}, {"s": {"t": "m", "v": "\\beta_i"}, "d": "beta of asset i"}], "note": "A weighted average of component betas."}, {"type": "formula", "name": "Market model", "tex": "R_i=\\alpha_i+\\beta_i R_m+e_i", "terms": [{"s": {"t": "m", "v": "R_{\\mathrm{i}}"}, "d": "asset return"}, {"s": {"t": "m", "v": "\\alpha_i"}, "d": "intercept (abnormal/expected return not from the market)"}, {"s": {"t": "m", "v": "\\beta_i"}, "d": "sensitivity to the market"}, {"s": {"t": "m", "v": "R_{\\mathrm{m}}"}, "d": "market return"}, {"s": {"t": "m", "v": "e_{\\mathrm{i}}"}, "d": "firm-specific (residual) return"}], "note": "Estimated by regressing asset returns on market returns."}, {"type": "formula", "name": "Total risk decomposition", "tex": "\\sigma_i^2=\\beta_i^2\\sigma_m^2+\\sigma_e^2", "terms": [{"s": {"t": "m", "v": "\\sigma_i^2"}, "d": "total variance of the asset"}, {"s": {"t": "m", "v": "\\beta_i^2\\sigma_m^2"}, "d": "systematic (market) variance"}, {"s": {"t": "m", "v": "\\sigma_e^2"}, "d": "nonsystematic (firm-specific) variance"}], "note": "Only systematic risk is priced; nonsystematic risk is diversifiable."}, {"type": "formula", "name": "Sharpe ratio", "tex": "\\text{SR}=\\frac{R_p-R_f}{\\sigma_p}", "terms": [{"s": {"t": "m", "v": "R_{\\mathrm{p}}"}, "d": "portfolio return"}, {"s": {"t": "m", "v": "R_{\\mathrm{f}}"}, "d": "risk-free rate"}, {"s": {"t": "m", "v": "\\sigma_p"}, "d": "portfolio standard deviation (total risk)"}], "note": "Excess return per unit of total risk; uses the CML frame."}, {"type": "formula", "name": "Treynor ratio", "tex": "\\text{TR}=\\frac{R_p-R_f}{\\beta_p}", "terms": [{"s": {"t": "m", "v": "R_{\\mathrm{p}}"}, "d": "portfolio return"}, {"s": {"t": "m", "v": "R_{\\mathrm{f}}"}, "d": "risk-free rate"}, {"s": {"t": "m", "v": "\\beta_p"}, "d": "portfolio beta (systematic risk)"}], "note": "Excess return per unit of systematic risk; suits well-diversified portfolios."}, {"type": "formula", "name": "Jensen's alpha", "tex": "\\alpha_p=R_p-\\big\\{R_f+\\beta_p[E(R_m)-R_f]\\big\\}", "terms": [{"s": {"t": "m", "v": "\\alpha_p"}, "d": "risk-adjusted excess return vs. the CAPM"}, {"s": {"t": "m", "v": "R_{\\mathrm{p}}"}, "d": "portfolio return"}, {"s": {"t": "m", "v": "\\beta_p"}, "d": "portfolio beta"}, {"s": {"t": "t", "v": "E(R<sub>m</sub>)-R<sub>f</sub>"}, "d": "market risk premium"}], "note": "Positive alpha means the portfolio beat its CAPM-required return."}, {"type": "formula", "name": "M-squared (M²) measure", "tex": "M^2=(R_p-R_f)\\frac{\\sigma_m}{\\sigma_p}+R_f", "terms": [{"s": {"t": "t", "v": "R<sub>p</sub>-R<sub>f</sub>"}, "d": "portfolio excess return"}, {"s": {"t": "m", "v": "\\sigma_m"}, "d": "market standard deviation"}, {"s": {"t": "m", "v": "\\sigma_p"}, "d": "portfolio standard deviation"}], "note": "Return the portfolio would earn at the market's risk; compare directly to R_m."}], "concepts": [{"type": "concept", "name": "Capital market line (CML)", "def": "The special CAL using the market portfolio; efficient portfolios are a mix of the risk-free asset and the market, priced on total risk.", "note": null}, {"type": "concept", "name": "The market portfolio", "def": "In theory, all investors hold the same risky portfolio — the market — combined with borrowing/lending at the risk-free rate (two-fund separation).", "note": null}, {"type": "concept", "name": "CAPM and its assumptions", "def": "Prices assets by systematic risk: investors are rational, risk-averse, hold the market, and can borrow/lend at the risk-free rate.", "note": null}, {"type": "concept", "name": "Beta interpretation", "def": "Beta measures an asset's systematic risk relative to the market; beta &gt; 1 is more volatile than the market, &lt; 1 less.", "note": null}, {"type": "concept", "name": "Security market line (SML)", "def": "The graphical CAPM: required return versus beta. Assets above the SML are underpriced; below it, overpriced.", "note": null}, {"type": "concept", "name": "CML vs. SML", "def": "The CML uses total risk (σ) and holds only efficient portfolios; the SML uses systematic risk (β) and prices all assets.", "note": null}, {"type": "concept", "name": "Sharpe, Treynor, Jensen's alpha, M²", "def": "Risk-adjusted performance measures: Sharpe/M² use total risk, Treynor/alpha use systematic risk; positive alpha signals skill.", "note": null}, {"type": "concept", "name": "Multifactor models (APT, Fama-French-Carhart)", "def": "Expected return depends on several priced factors (market, size, value, momentum) beyond a single market beta.", "note": null}]}, {"name": "Learning Module 3 — Portfolio Management: An Overview", "cards": [], "concepts": [{"type": "concept", "name": "Portfolio management process", "def": "Planning (IPS), execution (asset allocation and security selection), and feedback (monitoring and rebalancing).", "note": null}, {"type": "concept", "name": "Types of investors", "def": "Individual and institutional (pension funds, endowments, insurers, banks, sovereign wealth funds) — each with distinct objectives and constraints.", "note": null}, {"type": "concept", "name": "Defined benefit vs. defined contribution", "def": "In DB plans the employer bears investment risk and promises a benefit; in DC plans the employee bears the risk.", "note": null}, {"type": "concept", "name": "Pooled investment vehicles", "def": "Mutual funds, ETFs, hedge funds, and separately managed accounts give access to diversified, professionally managed portfolios.", "note": null}, {"type": "concept", "name": "Mutual funds vs. ETFs", "def": "Mutual funds trade once daily at NAV; ETFs trade intraday on exchanges and are often more tax-efficient.", "note": null}, {"type": "concept", "name": "Asset vs. wealth management", "def": "Asset management focuses on investing portfolios; wealth management adds financial planning, tax, and estate services for individuals.", "note": null}]}, {"name": "Learning Module 4 — Basics of Portfolio Planning and Construction", "cards": [], "concepts": [{"type": "concept", "name": "Investment policy statement (IPS)", "def": "The governing document specifying objectives (return, risk) and constraints; the foundation of the portfolio process.", "note": null}, {"type": "concept", "name": "Return and risk objectives", "def": "Return objectives can be absolute or relative; risk objectives combine the ability and willingness to take risk.", "note": null}, {"type": "concept", "name": "Ability vs. willingness to take risk", "def": "Ability depends on time horizon, wealth, and liquidity needs; willingness is psychological. The lower of the two usually governs.", "note": null}, {"type": "concept", "name": "The five constraints", "def": "Liquidity, time horizon, tax concerns, legal/regulatory factors, and unique circumstances shape the feasible portfolio.", "note": null}, {"type": "concept", "name": "Strategic asset allocation", "def": "The long-term target mix of asset classes chosen to meet the IPS; the dominant driver of long-run portfolio results.", "note": null}, {"type": "concept", "name": "Risk budgeting and rebalancing", "def": "Allocate the total risk across positions, then periodically rebalance back toward targets as prices drift.", "note": null}]}, {"name": "Learning Module 5 — The Behavioral Biases of Individuals", "cards": [], "concepts": [{"type": "concept", "name": "Cognitive errors vs. emotional biases", "def": "Cognitive errors stem from faulty reasoning and can be reduced with information; emotional biases stem from feelings and are harder to correct.", "note": null}, {"type": "concept", "name": "Belief perseverance biases", "def": "Conservatism, confirmation, representativeness, illusion of control, and hindsight — sticking to prior beliefs despite new evidence.", "note": null}, {"type": "concept", "name": "Information-processing errors", "def": "Anchoring, mental accounting, framing, and availability distort how data is used in decisions.", "note": null}, {"type": "concept", "name": "Loss aversion", "def": "Losses hurt more than equivalent gains please; leads to holding losers too long and selling winners too soon (disposition effect).", "note": null}, {"type": "concept", "name": "Overconfidence bias", "def": "Overestimating one's knowledge or forecasting ability; leads to excessive trading and under-diversification.", "note": null}, {"type": "concept", "name": "Other emotional biases", "def": "Self-control, status quo, endowment, and regret-aversion biases push investors toward inertia and suboptimal risk-taking.", "note": null}, {"type": "concept", "name": "Behavioral finance and market anomalies", "def": "Aggregated biases may help explain momentum, bubbles, and value/size effects that challenge market efficiency.", "note": null}]}, {"name": "Learning Module 6 — Introduction to Risk Management", "cards": [], "concepts": [{"type": "concept", "name": "Risk management defined", "def": "Not minimizing risk, but taking the risks the entity is best able to bear in pursuit of its goals, within its risk tolerance.", "note": null}, {"type": "concept", "name": "Risk management framework", "def": "Governance, identification and measurement, infrastructure, policies, monitoring, and communication work together to manage risk.", "note": null}, {"type": "concept", "name": "Risk governance and tolerance", "def": "Senior leadership sets an enterprise-wide risk tolerance aligned with objectives; risk governance oversees the whole framework.", "note": null}, {"type": "concept", "name": "Risk budgeting", "def": "Allocating the firm's total risk tolerance across activities, asset classes, or positions to make risk-taking deliberate.", "note": null}, {"type": "concept", "name": "Financial vs. non-financial risks", "def": "Financial: market, credit, liquidity. Non-financial: operational, model, settlement, legal, regulatory, and solvency risks.", "note": null}, {"type": "concept", "name": "Methods to modify risk", "def": "Risk can be prevented/avoided, accepted (self-insured or via risk budgeting), transferred (insurance), or shifted (derivatives).", "note": null}]}]}, {"id": "EC", "name": "Economics", "modules": [{"name":
