"Learning Module 1 — The Firm and Market Structures", "cards": [{"type": "formula", "name": "Total revenue", "tex": "\\text{TR}=P\\times Q", "terms": [{"s": {"t": "m", "v": "\\text{TR}"}, "d": "total revenue"}, {"s": {"t": "m", "v": "P"}, "d": "price per unit"}, {"s": {"t": "m", "v": "Q"}, "d": "quantity sold"}], "note": "Under perfect competition price is fixed; under imperfect competition P = f(Q)."}, {"type": "formula", "name": "Profit-maximizing output rule", "tex": "\\text{MR}=\\text{MC}", "terms": [{"s": {"t": "m", "v": "\\text{MR}"}, "d": "marginal revenue (change in TR per extra unit)"}, {"s": {"t": "m", "v": "\\text{MC}"}, "d": "marginal cost (change in TC per extra unit)"}], "note": "Holds in every market structure; produce where marginal revenue equals marginal cost."}, {"type": "formula", "name": "Perfect competition price relation", "tex": "P=\\text{MR}=\\text{AR}", "terms": [{"s": {"t": "m", "v": "P"}, "d": "market price (a price taker)"}, {"s": {"t": "m", "v": "\\text{MR}"}, "d": "marginal revenue"}, {"s": {"t": "m", "v": "\\text{AR}"}, "d": "average revenue"}], "note": "In perfect competition the firm faces a horizontal demand curve at the market price."}, {"type": "formula", "name": "Breakeven point (long run)", "tex": "\\text{TR}=\\text{TC}\\;\\;\\Leftrightarrow\\;\\;P=\\text{ATC}", "terms": [{"s": {"t": "m", "v": "\\text{TR}"}, "d": "total revenue"}, {"s": {"t": "m", "v": "\\text{TC}"}, "d": "total cost"}, {"s": {"t": "m", "v": "P"}, "d": "price"}, {"s": {"t": "m", "v": "\\text{ATC}"}, "d": "average total cost"}], "note": "Economic profit is zero when price equals average total cost."}, {"type": "formula", "name": "Shutdown point (short run)", "tex": "\\text{Shut down if }P<\\text{AVC}", "terms": [{"s": {"t": "m", "v": "P"}, "d": "price"}, {"s": {"t": "m", "v": "\\text{AVC}"}, "d": "average variable cost"}], "note": "Short run: operate if P ≥ AVC; shut down if price can't cover variable cost. Long run: exit if P &lt; ATC."}, {"type": "formula", "name": "N-firm concentration ratio", "tex": "\\text{CR}_N=\\sum_{i=1}^{N}\\text{Market share}_i", "terms": [{"s": {"t": "m", "v": "\\text{CR}_N"}, "d": "concentration ratio of the top N firms"}, {"s": {"t": "m", "v": "\\text{Market share}_i"}, "d": "sales share of firm i (percent)"}], "note": "Simple but ignores mergers among the largest firms and the share distribution."}, {"type": "formula", "name": "Herfindahl-Hirschman Index (HHI)", "tex": "\\text{HHI}=\\sum_{i=1}^{N}(\\text{Market share}_i)^2", "terms": [{"s": {"t": "m", "v": "\\text{HHI}"}, "d": "Herfindahl-Hirschman Index"}, {"s": {"t": "m", "v": "\\text{Market share}_i"}, "d": "fractional market share of firm i"}], "note": "Squaring gives more weight to larger firms; rises with concentration."}], "concepts": [{"type": "concept", "name": "Four market structures", "def": "Perfect competition, monopolistic competition, oligopoly, and monopoly — ranked by number of firms, product differentiation, and pricing power.", "note": null}, {"type": "concept", "name": "Perfect competition features", "def": "Many firms, identical products, no pricing power (price takers), free entry/exit; price equals marginal cost in equilibrium.", "note": null}, {"type": "concept", "name": "Monopolistic competition", "def": "Many firms with differentiated products and some pricing power; long-run economic profit is competed away to zero.", "note": null}, {"type": "concept", "name": "Oligopoly", "def": "Few firms whose decisions are interdependent; outcomes depend on strategic behavior (Cournot, Nash, kinked demand, Stackelberg).", "note": null}, {"type": "concept", "name": "Monopoly", "def": "A single seller with high barriers to entry and significant pricing power; sets output where MR = MC and may price-discriminate.", "note": null}, {"type": "concept", "name": "Breakeven vs. shutdown", "def": "Long run: exit if price is below average total cost. Short run: keep operating as long as price covers average variable cost.", "note": null}, {"type": "concept", "name": "Measuring market concentration", "def": "The N-firm concentration ratio sums top firms' shares; the HHI squares all shares and better reflects mergers and firm size.", "note": null}, {"type": "concept", "name": "Economies of scale and barriers to entry", "def": "Scale advantages, patents, control of resources, and regulation create barriers that sustain pricing power.", "note": null}]}, {"name": "Learning Module 2 — Understanding Business Cycles", "cards": [{"type": "formula", "name": "Unemployment rate", "tex": "\\text{Unemployment rate}=\\frac{\\text{Unemployed}}{\\text{Labor force}}", "terms": [{"s": {"t": "m", "v": "\\text{Unemployed}"}, "d": "people without a job actively seeking work"}, {"s": {"t": "m", "v": "\\text{Labor force}"}, "d": "employed + unemployed"}], "note": "Excludes discouraged workers, who have stopped looking."}, {"type": "formula", "name": "Labor force participation rate", "tex": "\\text{Participation rate}=\\frac{\\text{Labor force}}{\\text{Working-age population}}", "terms": [{"s": {"t": "m", "v": "\\text{Labor force}"}, "d": "employed + unemployed"}, {"s": {"t": "m", "v": "\\text{Working-age population}"}, "d": "all people of working age"}], "note": null}], "concepts": [{"type": "concept", "name": "Phases of the business cycle", "def": "Expansion, peak, contraction (recession), and trough; economic activity fluctuates around a long-term growth trend.", "note": null}, {"type": "concept", "name": "Leading, coincident, lagging indicators", "def": "Leading indicators turn before the economy (e.g., new orders); coincident move with it; lagging confirm it after the fact.", "note": null}, {"type": "concept", "name": "Inventory-sales ratio", "def": "Rises early in a slowdown as sales fall faster than production; a cyclical signal watched by analysts.", "note": null}, {"type": "concept", "name": "Types of unemployment", "def": "Frictional (job transitions), structural (skills mismatch), and cyclical (demand-driven); the natural rate excludes cyclical.", "note": null}, {"type": "concept", "name": "Limitations of unemployment data", "def": "Discouraged workers and underemployment understate labor-market slack; the participation rate adds context.", "note": null}, {"type": "concept", "name": "Measuring inflation", "def": "CPI (consumer basket), PPI (producer prices), and the GDP deflator; headline vs. core (excludes food and energy).", "note": null}, {"type": "concept", "name": "Demand-pull vs. cost-push inflation", "def": "Demand-pull comes from excess aggregate demand; cost-push from rising input costs (e.g., wages, oil).", "note": null}, {"type": "concept", "name": "Credit cycle", "def": "Fluctuations in credit availability amplify the business cycle; easy credit fuels expansions, tight credit deepens contractions.", "note": null}]}, {"name": "Learning Module 3 — Fiscal Policy", "cards": [{"type": "formula", "name": "MPC and MPS", "tex": "c+s=1\\;\\;\\Rightarrow\\;\\;s=1-c", "terms": [{"s": {"t": "m", "v": "c"}, "d": "marginal propensity to consume (MPC)"}, {"s": {"t": "m", "v": "s"}, "d": "marginal propensity to save (MPS)"}], "note": "Each extra dollar of disposable income is either spent or saved."}, {"type": "formula", "name": "Simple spending (autonomous) multiplier", "tex": "\\text{Multiplier}=\\frac{1}{1-c}=\\frac{1}{\\text{MPS}}", "terms": [{"s": {"t": "m", "v": "c"}, "d": "marginal propensity to consume"}, {"s": {"t": "m", "v": "\\text{MPS}"}, "d": "marginal propensity to save = 1 − c"}], "note": "Ignoring taxes; a higher MPC produces a larger multiplier."}, {"type": "formula", "name": "Fiscal multiplier (with taxes)", "tex": "\\text{Fiscal multiplier}=\\frac{1}{1-c(1-t)}", "terms": [{"s": {"t": "m", "v": "c"}, "d": "marginal propensity to consume"}, {"s": {"t": "m", "v": "t"}, "d": "net tax rate"}], "note": "Taxes leak income out of the spending stream, reducing the multiplier."}, {"type": "formula", "name": "Balanced budget multiplier", "tex": "\\text{Balanced budget multiplier}=1", "terms": [{"s": {"t": "t", "v": ""}, "d": "equal rise in spending and taxes"}], "note": "Raising G and T by the same amount still raises output (by that amount)."}], "concepts": [{"type": "concept", "name": "Fiscal policy defined", "def": "Government use of spending and taxation to influence aggregate demand and the level of economic activity.", "note": null}, {"type": "concept", "name": "Expansionary vs. contractionary", "def": "Expansionary (more spending or lower taxes) boosts demand; contractionary (less spending or higher taxes) restrains it.", "note": null}, {"type": "concept", "name": "Automatic stabilizers", "def": "Taxes and transfers (unemployment benefits) that cushion the cycle without new legislation — rising deficits in downturns.", "note": null}, {"type": "concept", "name": "Discretionary fiscal policy", "def": "Deliberate changes in spending or taxes; subject to recognition, action, and impact lags that can mistime the effect.", "note": null}, {"type": "concept", "name": "The fiscal multiplier", "def": "A change in government spending produces a larger change in output; the size depends on the MPC and the tax rate.", "note": null}, {"type": "concept", "name": "Direct vs. indirect taxes", "def": "Direct taxes fall on income/wealth/profits; indirect taxes fall on spending (VAT, excise) and can be changed quickly.", "note": null}, {"type": "concept", "name": "Ricardian equivalence", "def": "If taxpayers anticipate future taxes to repay debt, they save a tax cut rather than spend it, blunting fiscal stimulus.", "note": null}, {"type": "concept", "name": "Concerns with deficits and debt", "def": "High debt-to-GDP can raise future tax burdens and crowd out private investment, though it may be sustainable if growth exceeds the real rate.", "note": null}]}, {"name": "Learning Module 4 — Monetary Policy", "cards": [{"type": "formula", "name": "Money multiplier", "tex": "\\text{Money multiplier}=\\frac{1}{\\text{Reserve requirement}}", "terms": [{"s": {"t": "m", "v": "\\text{Reserve requirement}"}, "d": "fraction of deposits banks must hold in reserve"}], "note": "The maximum expansion of the money supply from new reserves."}, {"type": "formula", "name": "Quantity theory of money", "tex": "M\\times V=P\\times Y", "terms": [{"s": {"t": "m", "v": "M"}, "d": "money supply"}, {"s": {"t": "m", "v": "V"}, "d": "velocity of money"}, {"s": {"t": "m", "v": "P"}, "d": "price level"}, {"s": {"t": "m", "v": "Y"}, "d": "real output"}], "note": "With V and Y stable, money growth maps one-for-one into inflation (monetarism)."}, {"type": "formula", "name": "Fisher effect", "tex": "R_{\\text{nom}}=R_{\\text{real}}+E(\\pi)", "terms": [{"s": {"t": "m", "v": "R_{\\text{nom}}"}, "d": "nominal interest rate"}, {"s": {"t": "m", "v": "R_{\\text{real}}"}, "d": "real interest rate"}, {"s": {"t": "m", "v": "E(\\pi)"}, "d": "expected inflation (plus risk premiums for risky rates)"}], "note": null}, {"type": "formula", "name": "Neutral policy rate", "tex": "\\text{Neutral rate}=\\text{Real trend GDP growth}+\\text{Inflation target}", "terms": [{"s": {"t": "m", "v": "\\text{Real trend GDP growth}"}, "d": "economy's sustainable real growth rate"}, {"s": {"t": "m", "v": "\\text{Inflation target}"}, "d": "central bank's target inflation"}], "note": "Above the neutral rate policy is contractionary; below it, expansionary."}], "concepts": [{"type": "concept", "name": "Roles and objectives of central banks", "def": "Sole issuer of currency, banker to government/banks, lender of last resort, regulator, and manager of inflation/the money supply.", "note": null}, {"type": "concept", "name": "Money supply tools", "def": "Open market operations, the policy (refinancing) rate, and reserve requirements let a central bank expand or contract money.", "note": null}, {"type": "concept", "name": "Monetary transmission mechanism", "def": "Policy-rate changes flow through market rates, asset prices, credit, expectations, and the exchange rate to demand and inflation.", "note": null}, {"type": "concept", "name": "Money neutrality", "def": "In the long run money affects only prices, not real output; in the short run (sticky prices) it can influence the real economy.", "note": null}, {"type": "concept", "name": "Qualities of effective central banks", "def": "Independence, credibility, and transparency anchor inflation expectations and make policy more effective.", "note": null}, {"type": "concept", "name": "Inflation targeting", "def": "Many central banks target a stated inflation rate (often ~2%) to anchor expectations and guide policy.", "note": null}, {"type": "concept", "name": "Limits of monetary policy", "def": "Liquidity traps, the zero lower bound, and uncertain neutral rates can blunt the effect; quantitative easing is a response.", "note": null}, {"type": "concept", "name": "Monetary and fiscal policy interaction", "def": "The policy mix (tight/loose combinations) shapes interest rates, the exchange rate, and the composition of demand.", "note": null}]}, {"name": "Learning Module 5 — Introduction to Geopolitics", "cards": [], "concepts": [{"type": "concept", "name": "Geopolitics defined", "def": "The study of how geography, resources, and national interests shape the interactions of states and non-state actors.", "note": null}, {"type": "concept", "name": "State and non-state actors", "def": "Countries, multinational companies, NGOs, and supranational bodies all exert geopolitical influence.", "note": null}, {"type": "concept", "name": "Cooperation vs. nationalism", "def": "Countries range from globalization and cooperation to autarky and nationalism, shaping trade and capital flows.", "note": null}, {"type": "concept", "name": "Tools of geopolitics", "def": "National security, economic (sanctions, tariffs), and financial tools are used to pursue state interests.", "note": null}, {"type": "concept", "name": "Geopolitical risk types", "def": "Event risk (known date), exogenous risk (sudden shock), and thematic risk (long-running issues) affect investments differently.", "note": null}, {"type": "concept", "name": "Assessing geopolitical risk", "def": "Judge by likelihood and the size/velocity of the impact on markets; globalization raises interconnected risk.", "note": null}]}, {"name": "Learning Module 6 — International Trade", "cards": [], "concepts": [{"type": "concept", "name": "Absolute vs. comparative advantage", "def": "Absolute: producing more with the same resources. Comparative: a lower opportunity cost — the basis for gains from trade.", "note": null}, {"type": "concept", "name": "Gains from trade", "def": "Specializing by comparative advantage and trading expands total output and consumption beyond self-sufficiency.", "note": null}, {"type": "concept", "name": "Benefits and costs of trade", "def": "Trade raises efficiency, variety, and growth but creates winners and losers, prompting demands for protection.", "note": null}, {"type": "concept", "name": "Tariffs, quotas, and subsidies", "def": "Trade restrictions protect domestic industry but create deadweight losses and raise prices for consumers.", "note": null}, {"type": "concept", "name": "Trading blocs", "def": "Free-trade areas, customs unions, common markets, and monetary unions deepen integration in stages.", "note": null}, {"type": "concept", "name": "Balance of payments accounts", "def": "The current account (trade, income), capital account, and financial account must sum to zero (offsetting flows).", "note": null}, {"type": "concept", "name": "Why capital flows matter", "def": "Current-account deficits are financed by financial-account inflows; persistent imbalances carry risks.", "note": null}]}, {"name": "Learning Module 7 — Capital Flows and the FX Market", "cards": [{"type": "formula", "name": "Real exchange rate", "tex": "S^{\\text{real}}_{d/f}=S_{d/f}\\times\\frac{P_f}{P_d}", "terms": [{"s": {"t": "m", "v": "S^{\\text{real}}_{d/f}"}, "d": "real exchange rate (units of domestic real goods per foreign)"}, {"s": {"t": "m", "v": "S_{d/f}"}, "d": "nominal spot rate (domestic per foreign)"}, {"s": {"t": "m", "v": "P_{\\mathrm{f}}"}, "d": "foreign price level"}, {"s": {"t": "m", "v": "P_{\\mathrm{d}}"}, "d": "domestic price level"}], "note": "Measures relative purchasing power; a rise means the foreign good costs more domestically."}, {"type": "formula", "name": "Percentage change in a currency", "tex": "\\%\\Delta=\\frac{S_1}{S_0}-1", "terms": [{"s": {"t": "m", "v": "S_0,\\;S_1"}, "d": "beginning and ending exchange rate (same quote convention)"}, {"s": {"t": "m", "v": "\\%\\Delta"}, "d": "appreciation (+) or depreciation (−) of the base currency"}], "note": "A +x% move in d/f implies roughly a −x% move in the inverse f/d quote."}, {"type": "formula", "name": "Expected return on a foreign-currency asset", "tex": "R_{d/f}\\approx r_f+\\%\\Delta S_{d/f}", "terms": [{"s": {"t": "m", "v": "R_{d/f}"}, "d": "domestic-currency return on the foreign asset"}, {"s": {"t": "m", "v": "r_{\\mathrm{f}}"}, "d": "foreign-currency return"}, {"s": {"t": "m", "v": "\\%\\Delta S_{d/f}"}, "d": "percentage appreciation of the foreign currency"}], "note": "Domestic return combines the foreign asset return and the currency move."}], "concepts": [{"type": "concept", "name": "Functions of the FX market", "def": "Facilitates trade and investment across currencies and lets participants hedge or speculate on exchange-rate moves.", "note": null}, {"type": "concept", "name": "Exchange rate quote conventions", "def": "A quote is price currency per base currency (P/B); the base appreciates when the quote rises.", "note": null}, {"type": "concept", "name": "Direct vs. indirect quotes", "def": "Direct: domestic per foreign. Indirect: foreign per domestic. They are reciprocals of each other.", "note": null}, {"type": "concept", "name": "Nominal vs. real exchange rate", "def": "The real rate adjusts the nominal rate for relative price levels, measuring true purchasing power.", "note": null}, {"type": "concept", "name": "Spot vs. forward rates", "def": "Spot is for immediate delivery; forward locks a rate for a future date, set by the interest-rate differential.", "note": null}, {"type": "concept", "name": "Capital restrictions", "def": "Controls on cross-border flows affect currencies, asset prices, and a country's cost of capital.", "note": null}]}, {"name": "Learning Module 8 — Exchange Rate Calculations", "cards": [{"type": "formula", "name": "Cross rate", "tex": "\\frac{A}{B}=\\frac{A}{C}\\times\\frac{C}{B}", "terms": [{"s": {"t": "t", "v": "A/B"}, "d": "desired cross rate"}, {"s": {"t": "m", "v": "A/C,\\;C/B"}, "d": "two quotes sharing the common currency C"}], "note": "Chain the quotes so the common currency cancels; invert a quote when needed."}, {"type": "formula", "name": "Appreciation / depreciation", "tex": "\\%\\Delta=\\frac{S_1}{S_0}-1", "terms": [{"s": {"t": "m", "v": "S_0,\\;S_1"}, "d": "initial and new spot rate (price-currency per base)"}, {"s": {"t": "m", "v": "\\%\\Delta"}, "d": "change in the base currency's value"}], "note": "The base currency appreciates if the quote rises; the price currency moves inversely."}, {"type": "formula", "name": "Forward rate (covered interest rate parity)", "tex": "F_{f/d}=S_{f/d}\\,\\frac{1+r_f\\,\\tau}{1+r_d\\,\\tau}", "terms": [{"s": {"t": "m", "v": "F_{f/d}"}, "d": "forward rate (price currency f per base d)"}, {"s": {"t": "m", "v": "S_{f/d}"}, "d": "spot rate"}, {"s": {"t": "m", "v": "r_f,\\;r_d"}, "d": "foreign and domestic interest rates"}, {"s": {"t": "m", "v": "\\tau"}, "d": "term as a fraction of a year (e.g., 90/360)"}], "note": "The higher-yield currency trades at a forward discount (no-arbitrage)."}, {"type": "formula", "name": "Forward premium / discount (points)", "tex": "F_{f/d}-S_{f/d}=S_{f/d}\\,\\frac{(r_f-r_d)\\,\\tau}{1+r_d\\,\\tau}", "terms": [{"s": {"t": "m", "v": "F_{f/d}-S_{f/d}"}, "d": "forward points (× 10,000 for pips)"}, {"s": {"t": "m", "v": "S_{f/d}"}, "d": "spot rate"}, {"s": {"t": "m", "v": "r_f,\\;r_d"}, "d": "foreign and domestic interest rates"}, {"s": {"t": "m", "v": "\\tau"}, "d": "day-count fraction of a year"}], "note": "Positive when the base currency's rate is lower than the price currency's."}, {"type": "formula", "name": "Mark-to-market value of a forward (to the long)", "tex": "V_t=\\frac{(F_t-F_0)\\,(\\text{Contract size})}{1+r_d\\,\\tau}", "terms": [{"s": {"t": "m", "v": "V_{\\mathrm{t}}"}, "d": "value of the forward position at time t"}, {"s": {"t": "m", "v": "F_{\\mathrm{0}}"}, "d": "original contract forward rate"}, {"s": {"t": "m", "v": "F_{\\mathrm{t}}"}, "d": "current forward rate to the contract's maturity"}, {"s": {"t": "m", "v": "r_{\\mathrm{d}}"}, "d": "domestic rate to maturity"}, {"s": {"t": "m", "v": "\\tau"}, "d": "time remaining as a fraction of a year"}], "note": "Value equals the present value of the gain locked in by offsetting the contract."}], "concepts": [{"type": "concept", "name": "Cross rates", "def": "An exchange rate between two currencies derived from each one's rate against a common third currency.", "note": null}, {"type": "concept", "name": "Bid-offer spread", "def": "Dealers buy at the bid and sell at the offer; the spread widens with lower liquidity, larger size, and market stress.", "note": null}, {"type": "concept", "name": "Triangular arbitrage", "def": "Exploits inconsistent cross rates among three currencies to earn a riskless profit, forcing quotes back into line.", "note": null}, {"type": "concept", "name": "Covered interest rate parity", "def": "Forward rates are set so that hedged returns are equal across currencies — no arbitrage; the high-rate currency trades at a forward discount.", "note": null}, {"type": "concept", "name": "Uncovered interest rate parity", "def": "Expected currency depreciation offsets the interest-rate differential, so expected returns are equal (unhedged); often fails empirically.", "note": null}, {"type": "concept", "name": "Forward points", "def": "The forward rate stated as points added to or subtracted from spot; reflect the interest-rate differential and the term.", "note": null}, {"type": "concept", "name": "Mark-to-market of a forward", "def": "A currency forward's value is the present value of the gain from entering an offsetting forward at the current rate.", "note": null}]}]}]}</script>

  const sel = $('subject');
  sel.innerHTML = '<option value="ALL">All subjects</option>' +
    DATA.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}
function buildTopic(){
  const sid = $('subject').value;
  let html = `<label class="ms-item ms-all"><input type="checkbox" id="allTopics" checked> <b>All topics</b></label>`;
  DATA.subjects.forEach(s=>{
    if(sid!=='ALL' && s.id!==sid) return;
    s.modules.forEach((m,mi)=>{
      const label = (sid==='ALL' ? s.id+' &middot; ' : '') + m.name;
      html += `<label class="ms-item"><input type="checkbox" class="topic-cb" value="${s.id}||${mi}"> <span>${label}</span></label>`;
    });
  });
  $('msPanel').innerHTML = html;
  $('allTopics').addEventListener('change', onAllTopics);
  document.querySelectorAll('.topic-cb').forEach(cb=> cb.addEventListener('change', onTopicCb));
  updateMsLabel();
}
function selectedTopicKeys(){
  const all = $('allTopics');
  const checked = [...document.querySelectorAll('.topic-cb:checked')].map(cb=>cb.value);
  if((all && all.checked) || checked.length===0) return null;   // null => all topics
  return new Set(checked);
}
function onAllTopics(){
  if($('allTopics').checked){ document.querySelectorAll('.topic-cb').forEach(cb=>cb.checked=false); }
  else if(document.querySelectorAll('.topic-cb:checked').length===0){ $('allTopics').checked=true; }
  updateMsLabel(); buildDeck();
}
function onTopicCb(){
  const anyChecked = document.querySelectorAll('.topic-cb:checked').length>0;
  $('allTopics').checked = !anyChecked;
  updateMsLabel(); buildDeck();
}
function updateMsLabel(){
  const n = document.querySelectorAll('.topic-cb:checked').length;
  $('msBtn').textContent = (n===0) ? 'All topics' : (n+' topic'+(n>1?'s':'')+' selected');
}
function buildDeck(){
  const sid = $('subject').value;
  const ctype = $('ctype').value;     // ALL | formula | concept
  const keys = selectedTopicKeys();   // null => all
  deck = [];
  DATA.subjects.forEach(s=>{
    if(sid!=='ALL' && s.id!==sid) return;
    s.modules.forEach((m,mi)=>{
      if(keys && !keys.has(s.id+'||'+mi)) return;
      const meta = {subj:s.name, subjId:s.id, mod:m.name};
      // Formula cards first, then concept cards (separately sorted within each module).
      if(ctype!=='concept') (m.cards||[]).forEach(c=> deck.push({...c, ...meta}));
      if(ctype!=='formula') (m.concepts||[]).forEach(c=> deck.push({...c, ...meta}));
    });
  });
  idx = 0; flipped = false;
  $('deckLabel').textContent = deck.length ? `${deck.length} card${deck.length>1?'s':''}` : '';
  render();
}
function katexInto(el, tex, display){
  try{ katex.render(tex, el, {displayMode:!!display, throwOnError:false, strict:false}); }
  catch(e){ el.textContent = tex; }
}
function render(){
  const host = $('cardHost');
  if(!deck.length){ host.innerHTML = '<div class="card"><div class="empty">No cards for this selection.</div></div>';
    $('counter').textContent=''; $('bar').style.width='0'; return; }
  const c = deck[idx];
  const isConcept = c.type === 'concept';
  const card = document.createElement('div');
  card.className = 'card' + (flipped?' flipped':'') + (isConcept?' concept':'');
  const back = isConcept
    ? `<div class="fname">${c.name}</div>
       <div class="def">${c.def||''}</div>
       ${c.note?`<div class="note">${c.note}</div>`:''}`
    : `<div class="fname">${c.name}</div>
       <div class="formula" id="fx"></div>
       <div class="where-h">where:</div>
       <table class="where"><tbody id="wh"></tbody></table>
       ${c.note?`<div class="note">${c.note}</div>`:''}`;
  const hint = isConcept
    ? (flipped?'Tap to hide':'Tap to reveal explanation')
    : (flipped?'Tap to hide':'Tap to reveal formula');
  card.innerHTML = `
    <div class="top">
      <span class="badge">${c.subjId}</span>
      <span class="badge kind ${isConcept?'concept':'formula'}">${isConcept?'Concept':'Formula'}</span>
      <div class="modname">${c.mod}</div>
    </div>
    <div class="front">
      <h2>${c.name}</h2>
    </div>
    <div class="back">${back}</div>
    <div class="flip-hint">${hint}</div>`;
  host.innerHTML=''; host.appendChild(card);
  card.addEventListener('click', flip);
  if(flipped && !isConcept){
    katexInto(card.querySelector('#fx'), c.tex, true);
    const wh = card.querySelector('#wh');
    c.terms.forEach(t=>{
      const tr=document.createElement('tr');
      const td1=document.createElement('td'); td1.className='sym';
      if(t.s.t==='m'){ katexInto(td1, t.s.v, false); } else { td1.innerHTML=t.s.v; }
      const td2=document.createElement('td'); td2.className='eq'; td2.textContent='=';
      const td3=document.createElement('td'); td3.innerHTML=t.d;
      tr.append(td1,td2,td3); wh.appendChild(tr);
    });
  }
  $('counter').textContent = `${idx+1} / ${deck.length}`;
  $('bar').style.width = ((idx+1)/deck.length*100)+'%';
}
function flip(){ flipped=!flipped; render(); }
function next(){ if(!deck.length)return; idx=(idx+1)%deck.length; flipped=false; render(); }
function prev(){ if(!deck.length)return; idx=(idx-1+deck.length)%deck.length; flipped=false; render(); }
function shuffle(){ for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];} idx=0; flipped=false; render(); }

$('subject').addEventListener('change', ()=>{ buildTopic(); buildDeck(); });
$('ctype').addEventListener('change', buildDeck);
function togglePanel(open){
  const p=$('msPanel'); const show = open===undefined ? p.hidden : open;
  p.hidden = !show; $('msBtn').setAttribute('aria-expanded', show?'true':'false');
}
$('msBtn').addEventListener('click', e=>{ e.stopPropagation(); togglePanel(); });
$('msPanel').addEventListener('click', e=> e.stopPropagation());
document.addEventListener('click', ()=> togglePanel(false));
$('flipBtn').addEventListener('click', flip);
$('next').addEventListener('click', next);
$('prev').addEventListener('click', prev);
$('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); flip(); }
  else if(e.code==='ArrowRight'){ next(); }
  else if(e.code==='ArrowLeft'){ prev(); }
});
function boot(){ buildSubject(); buildTopic(); buildDeck(); }
if(window.katex){ boot(); } else {
  const s=document.querySelector('script[src*="katex.min.js"]');
  s.addEventListener('load', boot); window.addEventListener('load', ()=>{ if(window.katex && !deck.length) boot(); });
}
</script>
</body>
</html>
